<script>
(function(){
  var groups=new Map(),list=document.getElementById('term-list'),input=document.getElementById('term-filter'),empty=document.getElementById('no-terms');
  var entries=Object.entries(SS.terms).sort(function(a,b){return a[1].en.localeCompare(b[1].en,'en')});
  entries.forEach(function(entry){
    var letter=entry[1].en[0].toUpperCase();
    if(!groups.has(letter))groups.set(letter,[]);
    groups.get(letter).push(entry);
  });
  /* 领域：厂商专有词按 tag；通用词按「详见」那一站所在的总图线；厂商站上的通用词归到它最接近的领域 */
  var DOMS=[['all','全部','All'],['a','AI 应用','AI Apps'],['m','模型','Model'],['d','数据','Data'],['c','计算','Compute'],['n','网络','Network'],['s','存储','Storage'],['vast','VAST','VAST'],['ddn','DDN','DDN'],['weka','WEKA','WEKA'],['nvidia','NVIDIA','NVIDIA']];
  var VLINE={'v-aios':'d','d-ai':'a','d-inf':'d','b-ai':'a','b-inf':'a','b-data':'d','b-gpu':'c','f-tok':'a','f-orch':'a','f-eng':'m','f-kv':'m','f-cp':'c','f-infra':'c','f-ai':'a','f-gov':'a'};
  function domOf(t){if(t.tag!=='generic'&&DOMS.some(function(d){return d[0]===t.tag}))return t.tag;var s=t.see&&SS.stations[t.see];if(!s)return 's';
    var h=s.lines.filter(function(l){return 'amdcns'.indexOf(l)>-1&&l.length===1});if(h.length)return h[0];
    for(var i=0;i<s.lines.length;i++)if(VLINE[s.lines[i]])return VLINE[s.lines[i]];return 's'}
  var dom='all',doms=document.getElementById('term-doms'),letters=document.getElementById('term-letters');
  function drawDoms(){var cnt={all:entries.length};entries.forEach(function(e){var d=domOf(e[1]);cnt[d]=(cnt[d]||0)+1});
    doms.innerHTML=DOMS.filter(function(d){return cnt[d[0]]}).map(function(d){return '<button type="button" data-dom="'+d[0]+'" aria-pressed="'+(dom===d[0])+'">'+SS.esc(SS.L(d[1],d[2]))+'<span>'+cnt[d[0]]+'</span></button>'}).join('')}
  doms.addEventListener('click',function(e){var b=e.target.closest('[data-dom]');if(!b)return;dom=b.getAttribute('data-dom');drawDoms();filter();input.dispatchEvent(new Event('input'))});
  function drawLetters(){letters.innerHTML=sections.map(function(s){var L=s.id.slice(2);return '<a href="#'+s.id+'"'+(s.hidden?' aria-disabled="true" tabindex="-1"':'')+'>'+L+'</a>'}).join('')}
  var sections=[];
  function filter(){
    var query=input.value.trim().toLowerCase(),count=0;
    sections.forEach(function(section){var found=false;
      Array.from(section.children).slice(1).forEach(function(row){
        var t=SS.terms[row.id],words=[t.zh,t.en].concat(t.alias||[],row.textContent).join(' ').toLowerCase();
        row.hidden=!words.includes(query)||(dom!=='all'&&domOf(t)!==dom);
        if(!row.hidden){found=true;count++}
      });
      section.hidden=!found;
    });
    empty.hidden=count>0;
    drawLetters();
  }
  function jump(){
    var target=document.getElementById(location.hash.slice(1));
    if(!target||!target.classList.contains('glossary-term'))return;
    if(target.hidden){input.value='';if(dom!=='all'&&domOf(SS.terms[target.id])!==dom){dom='all';drawDoms()}input.dispatchEvent(new Event('input'))}
    target.scrollIntoView();
  }
  input.addEventListener('input',filter);
  addEventListener('hashchange',jump);
  document.addEventListener('ss-lang',function(){
    var en=SS.lang()==='en',esc=SS.esc,first=!sections.length;
    document.title=SS.L('术语表','Glossary')+" · Shan's Stack";
    list.innerHTML=Array.from(groups,function(group){
      return '<section class="glossary-group" id="g-'+esc(group[0])+'"><h2>'+esc(group[0])+'</h2>'+group[1].map(function(entry){
        var id=entry[0],t=entry[1],name=t.en,alt=t.zh,see=SS.termSee(t);  /* 英文名为主标题，中文名作副标题（中文模式才显示） */
        return '<article class="glossary-term" id="'+esc(id)+'"><h3><span lang="en" data-noconv>'+esc(name)+'</span>'+
          (name===alt||en?'':'<span class="gzh" lang="zh">'+esc(alt)+'</span>')+'</h3><p>'+esc(SS.T(t.d))+'</p>'+
          (see?'<a href="'+esc(see)+'">'+esc(SS.L('详见：','See: ')+SS.title(t.see))+'</a>':'')+'</article>';
      }).join('')+'</section>';
    }).join('');
    sections=Array.from(list.children);
    drawDoms();
    try{var q0=new URLSearchParams(location.search).get('q');if(q0)input.value=q0}catch(e){}
    filter();
    if(first&&location.hash)requestAnimationFrame(jump);
  });
})();
</script>
<script>/* 搜索框：提示文字跟语言走，右侧显示总数或匹配数 */
(function(){var i=document.getElementById('term-filter'),c=document.getElementById('term-count');
function up(){var all=document.querySelectorAll('.glossary-term').length,shown=[].filter.call(document.querySelectorAll('.glossary-term'),function(x){return !x.hidden&&x.offsetParent!==null}).length;
  i.placeholder=SS.L('搜索术语，例如 PFC、条带','Search terms, e.g. PFC, stripe');
  var f=i.value.trim()||document.querySelector('.gdoms [aria-pressed="true"]:not([data-dom="all"])');
  c.textContent=f?SS.L('找到 '+shown+' 个','Found '+shown):SS.L('共 '+all+' 个','All '+all)}
i.addEventListener('input',function(){requestAnimationFrame(up)});document.getElementById('term-doms').addEventListener('click',function(){requestAnimationFrame(up)});document.addEventListener('ss-lang',function(){requestAnimationFrame(up)});setTimeout(up,0)})();
</script>
