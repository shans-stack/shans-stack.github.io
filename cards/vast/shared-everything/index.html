<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Everything</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1b1d20; --soft:#5a6068; --faint:#9aa0a7; --rule:#dedfdb;
  --node:#2f5d7c; --node-lift:#e6eef4; --ssd:#3d7a5a; --ssd-lift:#e4f1ea;
  --bad:#c0462a; --bad-lift:#f8e4de; --off:#c9cbc7; --pulse:#e39b2a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131518; --panel:#1b1e22; --ink:#eceded; --soft:#b0b5bb; --faint:#6f767d; --rule:#2c3136;
    --node:#7fb4d6; --node-lift:#1a2731; --ssd:#73c095; --ssd-lift:#18291f;
    --bad:#e47a5c; --bad-lift:#33201b; --off:#3a3f44; --pulse:#f0b14c;
  }
}
:root[data-theme="dark"]{
  --bg:#131518; --panel:#1b1e22; --ink:#eceded; --soft:#b0b5bb; --faint:#6f767d; --rule:#2c3136;
  --node:#7fb4d6; --node-lift:#1a2731; --ssd:#73c095; --ssd-lift:#18291f;
  --bad:#e47a5c; --bad-lift:#33201b; --off:#3a3f44; --pulse:#f0b14c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.kicker{font-size:13px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.lang{border:1px solid var(--rule);background:var(--panel);color:var(--soft);
  border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.stage{background:var(--panel);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.caption{padding:20px 24px 8px;min-height:120px}
.caption h2{margin:0 0 6px;font-size:24px;line-height:1.3;font-weight:600}
.caption p{margin:0;color:var(--soft);font-size:16px}
.ctrl{display:flex;align-items:center;justify-content:space-between;padding:12px 24px 20px}
.dots{display:flex;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rule);transition:background .3s,transform .3s}
.dot.on{background:var(--ink);transform:scale(1.25)}
button.nav{border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:10px;
  padding:8px 16px;font-size:15px;cursor:pointer}
button.nav:disabled{opacity:.35;cursor:default}
.hint{margin-top:10px;font-size:13px;color:var(--faint);text-align:center}
/* svg parts */
.scene{transition:opacity .6s}
.box{transition:fill .5s,stroke .5s}
.link{stroke:var(--rule);stroke-width:1.2;transition:stroke .5s,opacity .5s}
.lbl{font-size:13px;fill:var(--soft)}
.big{font-size:15px;font-weight:600;fill:var(--ink)}
.x{stroke:var(--bad);stroke-width:3;stroke-linecap:round;opacity:0;transition:opacity .4s}
.rebuild{stroke:var(--bad);stroke-width:2;stroke-dasharray:6 6;fill:none;opacity:0;transition:opacity .4s}
.rebuild.on{opacity:1;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion: reduce){.rebuild.on{animation:none}}
@media (max-width:600px){.caption h2{font-size:20px}.caption{padding:16px}.ctrl{padding:10px 16px 16px}}
</style>
</head>
<body>
<main>
  <header>
    <span class="kicker" id="kicker">VAST 架构 · 一分钟看懂</span>
    <button class="lang" id="lang">EN</button>
  </header>

  <div class="stage">
    <svg id="svg" viewBox="0 0 800 400" role="img" aria-label="animation"></svg>
    <div class="caption"><h2 id="t"></h2><p id="d"></p></div>
    <div class="ctrl">
      <button class="nav" id="prev">←</button>
      <div class="dots" id="dots"></div>
      <button class="nav" id="next">→</button>
    </div>
  </div>
  <div class="hint" id="hint">用 ← → 键或点按钮一步步看</div>
</main>

<script>
const T = {
  zh:{kicker:"VAST 架构 · 一分钟看懂",hint:"用 ← → 键或点按钮一步步看",lang:"EN",
    steps:[
      ["一台服务器坏了，会发生什么？","先看大多数存储是怎么搭的。"],
      ["传统做法：每台服务器只管自己的盘","数据分散在各台服务器下面，盘跟着服务器走。"],
      ["一台服务器坏了，它下面的盘也一起下线","这些盘上的数据要从别处在网络上重建，系统忙上好一阵。"],
      ["VAST 换了个搭法：计算和盘分开","上面的 CNode 负责计算、不存数据；下面的盘放在 DBox 里，通过高速网络连在一起。"],
      ["每个 CNode 都能直接读写每一块盘","任何一个请求，交给哪个 CNode 都一样。"],
      ["一个 CNode 坏了，盘一块都没少","别的 CNode 接着干活，不用重建数据。"],
      ["再加一个 CNode，接上就能用","新节点马上能看到全部的盘，数据不用搬。"]
    ]},
  en:{kicker:"VAST architecture · in one minute",hint:"Use ← → or the buttons to step through",lang:"中文",
    steps:[
      ["What happens when a server fails?","First, how most storage systems are built."],
      ["The usual way: each server owns its own drives","Data is spread across servers, and drives belong to the server they sit in."],
      ["One server fails, and its drives go offline with it","Their data has to be rebuilt from elsewhere over the network, which keeps the system busy for a while."],
      ["VAST splits compute from the drives","CNodes on top do the work and hold no data. Drives sit in DBoxes below, joined by a fast network."],
      ["Every CNode reads and writes every drive directly","Any request can go to any CNode."],
      ["A CNode fails, and no drive is lost","The other CNodes carry on. Nothing needs rebuilding."],
      ["Add a CNode and it just joins","The new node sees every drive right away. No data moves."]
    ]}
};
let lang="zh", step=0;
const N=T.zh.steps.length;
const S="http://www.w3.org/2000/svg", svg=document.getElementById("svg");
const el=(n,a={},p=svg)=>{const e=document.createElementNS(S,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};

/* ---------- Scene A: shared-nothing ---------- */
const A=el("g",{class:"scene"});
const aServers=[];
const aX=[70,250,430,610];
aX.forEach((x,i)=>{
  const g=el("g",{},A);
  const b=el("rect",{x,y:60,width:120,height:250,rx:12,class:"box",fill:"var(--node-lift)",stroke:"var(--node)","stroke-width":1.5},g);
  const t=el("text",{x:x+60,y:88,"text-anchor":"middle",class:"big"},g); t.textContent="Server "+(i+1);
  const disks=[];
  for(let k=0;k<4;k++){
    disks.push(el("rect",{x:x+20,y:110+k*46,width:80,height:32,rx:6,class:"box",fill:"var(--ssd-lift)",stroke:"var(--ssd)","stroke-width":1.2},g));
  }
  const x1=el("line",{x1:x+30,y1:120,x2:x+90,y2:290,class:"x"},g);
  const x2=el("line",{x1:x+90,y1:120,x2:x+30,y2:290,class:"x"},g);
  aServers.push({b,disks,xs:[x1,x2]});
});
const net=el("line",{x1:60,y1:345,x2:740,y2:345,stroke:"var(--rule)","stroke-width":3,"stroke-linecap":"round"},A);
const netL=el("text",{x:400,y:375,"text-anchor":"middle",class:"lbl"},A);
const rebuild=[0,2,3].map(i=>el("path",{d:`M${aX[i]+60} 310 V345 H${aX[1]+60} V310`,class:"rebuild"},A));

/* ---------- Scene B: shared-everything ---------- */
const B=el("g",{class:"scene",opacity:0});
const linkLayer=el("g",{},B), pulseLayer=el("g",{},B);
const fabricY=200;
const fab=el("rect",{x:60,y:fabricY-6,width:680,height:12,rx:6,fill:"var(--rule)"},B);
const fabL=el("text",{x:400,y:fabricY-14,"text-anchor":"middle",class:"lbl"},B);
const cX=[100,250,400,550,700];
const cnodes=cX.map((x,i)=>{
  const g=el("g",{},B);
  const b=el("rect",{x:x-55,y:50,width:110,height:60,rx:10,class:"box",fill:"var(--node-lift)",stroke:"var(--node)","stroke-width":1.5},g);
  const t=el("text",{x,y:86,"text-anchor":"middle",class:"big"},g); t.textContent="CNode";
  const x1=el("line",{x1:x-25,y1:62,x2:x+25,y2:98,class:"x"},g);
  const x2=el("line",{x1:x+25,y1:62,x2:x-25,y2:98,class:"x"},g);
  const l=el("line",{x1:x,y1:110,x2:x,y2:fabricY-6,class:"link"},linkLayer);
  g.style.transition="opacity .6s, transform .6s";
  return {g,b,xs:[x1,x2],l,x,alive:true,shown:i<4};
});
const ssds=[];
[[90,"DBox 1"],[420,"DBox 2"]].forEach(([x,name])=>{
  el("rect",{x,y:250,width:290,height:110,rx:12,fill:"none",stroke:"var(--rule)","stroke-width":1.5},B);
  const t=el("text",{x:x+145,y:384,"text-anchor":"middle",class:"lbl"},B); t.textContent=name;
  for(let k=0;k<6;k++){
    const sx=x+18+k*45;
    const r=el("rect",{x:sx,y:275,width:36,height:60,rx:6,class:"box",fill:"var(--ssd-lift)",stroke:"var(--ssd)","stroke-width":1.2},B);
    el("line",{x1:sx+18,y1:fabricY+6,x2:sx+18,y2:275,class:"link"},linkLayer);
    ssds.push({r,x:sx+18});
  }
});
const ssdL=el("text",{x:400,y:240,"text-anchor":"middle",class:"lbl"},B);

/* pulses: CNode -> fabric -> SSD */
const pulses=[];
let pulsing=false;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function spawn(){
  const live=cnodes.filter(c=>c.alive&&c.shown);
  if(!live.length) return;
  const c=live[Math.floor(Math.random()*live.length)], s=ssds[Math.floor(Math.random()*ssds.length)];
  const dot=el("circle",{r:5,fill:"var(--pulse)"},pulseLayer);
  pulses.push({dot,c,s,t:0});
}
let last=0, acc=0;
function tick(ts){
  const dt=Math.min(50,ts-(last||ts)); last=ts;
  if(pulsing && !reduce){
    acc+=dt; if(acc>140){acc=0;spawn();}
  }
  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i]; p.t+=dt/900;
    const pts=[[p.c.x,110],[p.c.x,fabricY],[p.s.x,fabricY],[p.s.x,275]];
    const seg=[90,Math.abs(p.s.x-p.c.x),75], tot=seg.reduce((a,b)=>a+b,0);
    let d=Math.min(1,p.t)*tot, k=0;
    while(k<2 && d>seg[k]){d-=seg[k];k++}
    const f=seg[k]?d/seg[k]:1, a=pts[k], b=pts[k+1];
    p.dot.setAttribute("cx",a[0]+(b[0]-a[0])*f); p.dot.setAttribute("cy",a[1]+(b[1]-a[1])*f);
    if(p.t>=1 || !pulsing){p.dot.remove();pulses.splice(i,1)}
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- step states ---------- */
function setServer(s,state){
  const bad=state==="fail";
  s.b.setAttribute("fill",bad?"var(--bad-lift)":"var(--node-lift)");
  s.b.setAttribute("stroke",bad?"var(--bad)":"var(--node)");
  s.disks.forEach(d=>{d.setAttribute("fill",bad?"var(--off)":"var(--ssd-lift)");d.setAttribute("stroke",bad?"var(--faint)":"var(--ssd)")});
  s.xs.forEach(x=>x.style.opacity=bad?1:0);
}
function render(){
  const L=T[lang];
  document.documentElement.lang=lang==="zh"?"zh":"en";
  document.getElementById("kicker").textContent=L.kicker;
  document.getElementById("hint").textContent=L.hint;
  document.getElementById("lang").textContent=L.lang;
  document.getElementById("t").textContent=L.steps[step][0];
  document.getElementById("d").textContent=L.steps[step][1];
  netL.textContent=lang==="zh"?"网络":"Network";
  fabL.textContent=lang==="zh"?"高速网络（NVMe-oF）":"Fast network (NVMe-oF)";
  ssdL.textContent=lang==="zh"?"所有的盘":"All drives";

  const inA=step<=2;
  A.setAttribute("opacity",inA?1:0); B.setAttribute("opacity",inA?0:1);
  A.style.opacity=inA?1:0; B.style.opacity=inA?0:1;
  aServers.forEach((s,i)=>setServer(s,step>=2&&i===1?"fail":"ok"));
  rebuild.forEach(r=>r.classList.toggle("on",step===2));

  cnodes.forEach((c,i)=>{
    c.shown = i<4 || step>=6;
    c.alive = !(i===1 && step>=5);
    c.g.style.opacity=c.shown?1:0;
    c.g.style.transform=c.shown?"translateY(0)":"translateY(-20px)";
    c.l.style.opacity=c.shown?(c.alive?1:.15):0;
    c.b.setAttribute("fill",c.alive?"var(--node-lift)":"var(--bad-lift)");
    c.b.setAttribute("stroke",c.alive?"var(--node)":"var(--bad)");
    c.xs.forEach(x=>x.style.opacity=c.alive?0:1);
  });
  linkLayer.querySelectorAll(".link").forEach(l=>l.style.stroke=step>=4?"var(--node)":"var(--rule)");
  pulsing = step>=4;

  document.getElementById("prev").disabled=step===0;
  document.getElementById("next").disabled=step===N-1;
  document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("on",i===step));
}
const dots=document.getElementById("dots");
for(let i=0;i<N;i++){const d=document.createElement("span");d.className="dot";dots.appendChild(d)}
const go=n=>{step=Math.max(0,Math.min(N-1,n));render()};
document.getElementById("prev").onclick=()=>go(step-1);
document.getElementById("next").onclick=()=>go(step+1);
document.getElementById("lang").onclick=()=>{lang=lang==="zh"?"en":"zh";render()};
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")go(step+1);if(e.key==="ArrowLeft")go(step-1)});
render();
</script>
</body>
</html>
