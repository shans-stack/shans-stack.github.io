<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>演示 · Shan's Stack</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/palette.css">
<link rel="stylesheet" href="assets/site.css">
<!-- 演示播放器：按讲稿顺序一站一站往下翻。
     有知识点页的站，直接跳进知识点页的演示模式（那边翻完最后一步会回到这里的下一站）；
     没有的站，显示一页「制作中」过渡页：站名加一句话说明。
     地址：present.html?map=<地图>&talk=<讲稿 id> 或 &stops=a,b,c&name=…，再加 &i=<第几站，从 0 起>。 -->
<style>
body{overflow:hidden}
.pv{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:3vh 5vw 2.5vh}
.pv-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:clamp(14px,1.2vw,18px);color:var(--ink3)}
.pv-top b{font-weight:500;color:var(--ink2)}
.pv-mid{display:flex;flex-direction:column;justify-content:center;max-width:62rem}
.pv-l{display:flex;align-items:center;gap:10px;font-size:clamp(15px,1.3vw,20px);color:var(--ink2)}
.pv-l svg{width:clamp(22px,2vw,30px);height:clamp(22px,2vw,30px)}
.pv-bar{display:flex;gap:4px;height:6px;width:min(320px,50vw);margin-top:18px}
.pv-bar i{flex:1}
.pv h1{font-size:clamp(34px,4.6vw,76px);line-height:1.18;margin-top:2.5vh;letter-spacing:-.01em}
.pv h1 .tag{font-size:clamp(13px,1.1vw,17px);vertical-align:middle;margin-left:.5em;padding:2px 10px}
.pv p.d{font-size:clamp(20px,2vw,32px);color:var(--ink2);margin-top:2.5vh;line-height:1.55;max-width:34em}
.pv p.n{font-size:clamp(14px,1.1vw,17px);color:var(--ink3);margin-top:3vh}
.pv-ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pv-dots{display:flex;flex:1;min-width:160px;position:relative;justify-content:space-between}
.pv-dots::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:4px;margin-top:-2px;background:var(--rule2)}
.pv-dots a{width:28px;height:44px;display:grid;place-items:center;position:relative;z-index:1}
.pv-dots a::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--lc);box-sizing:content-box}
.pv-dots a.done::after{background:var(--lc)}
.pv-dots a[aria-current=step]::after{width:14px;height:14px;background:var(--lc);border:4px solid var(--ink)}
.pv .empty{font-size:20px;color:var(--ink2)}
@media (max-width:720px){.pv{padding:16px}.pv-top{flex-direction:column;gap:2px}}
</style>
</head>
<body>
<script src="assets/symbols.js"></script>
<main class="pv" id="pv"></main>
<script src="data/lines.js"></script>
<script src="data/stations.js"></script>
<script src="data/maps.js"></script>
<script src="data/talks.js"></script>
<script src="assets/core.js"></script>
<script src="assets/metro.js"></script>
<script>
(function(){
var SS=window.SS,L=SS.L,q=new URLSearchParams(location.search);
var mapId=SS.mapById[q.get('map')]?q.get('map'):'home',map=SS.mapById[mapId];
var talk=SS.talkById[q.get('talk')]||null;
var stops=(q.get('stops')?q.get('stops').split(','):(talk?talk.stops:[])).filter(function(id){return SS.stations[id]&&SS.inMap(id,mapId)});
var name=q.get('name')||'';
var i=Math.max(0,Math.min(stops.length-1,parseInt(q.get('i')||'0',10)||0));
var rt=stops.length?SS.Metro.route(mapId,stops):null;
function deck(j,extra){
  var u='map='+mapId+(talk&&!q.get('stops')?'&talk='+talk.id:'&stops='+encodeURIComponent(stops.join(',')))+(name?'&name='+encodeURIComponent(name):'')+'&i='+j+(extra||'');
  return u;
}
function back(){var u=SS.url(map.href)+(talk&&!q.get('stops')?'?talk='+talk.id:'?stops='+encodeURIComponent(stops.join(','))+(name?'&name='+encodeURIComponent(name):''))+'#map';return u}
function go(j,extra){
  if(j<0||j>=stops.length)return;
  var s=SS.stations[stops[j]];
  if(s.page){location.replace(SS.url(s.page)+'?'+deck(j,extra)+'#present');return}
  location.replace(SS.url('present.html')+'?'+deck(j));
}
/* 有知识点页的站：直接进它的演示模式（从后一站往回翻时停在最后一步） */
if(stops.length&&SS.stations[stops[i]].page){go(i,q.get('step')==='last'?'&step=last':'');return}
function render(){
  var pv=document.getElementById('pv');
  if(!stops.length){pv.innerHTML='<div></div><p class="empty">'+L('这场讲稿没有站。','This talk has no stops.')+' <a class="btn" href="'+SS.url(map.href)+'#map">'+L('回到地图','Back to the map')+'</a></p><div></div>';return}
  var id=stops[i],s=SS.stations[id],ls=SS.linesIn(id,mapId),tn=talk&&!q.get('stops')?SS.L(talk.zh,talk.en):(name||L('自定义讲解','Custom talk'));
  document.title=SS.title(id)+' · '+tn;
  pv.innerHTML='<div class="pv-top"><span><b>'+SS.esc(tn)+'</b> · '+SS.esc(SS.L(map.zh,map.en))+'</span><span>'+L('第 '+(i+1)+' 站，共 '+stops.length+' 站','Stop '+(i+1)+' of '+stops.length)+'</span></div>'+
    '<div class="pv-mid"><p class="pv-l">'+ls.map(function(l){return SS.sym(l)+'<span>'+SS.esc(SS.lineName(l))+L('线','')+'</span>'}).join('<span>·</span>')+'</p>'+
    '<div class="pv-bar">'+ls.map(function(l){return '<i style="background:'+SS.lc(l)+'"></i>'}).join('')+'</div>'+
    '<h1>'+SS.esc(SS.title(id))+'<span class="tag">'+SS.stName(s.st)+'</span></h1><p class="d">'+SS.esc(SS.desc(id,mapId))+'</p>'+
    '<p class="n">'+L('这个知识点的分步讲解还在制作。','The step-by-step walkthrough for this topic is still being made.')+'</p></div>'+
    '<div class="pv-ctl"><button class="btn" type="button" data-p'+(i===0?' disabled':'')+'>'+L('上一站','Previous')+'</button><div class="pv-dots">'+
    stops.map(function(sid,j){var lc=SS.lc(rt&&rt.at[j]?rt.at[j].line:SS.linesIn(sid,mapId)[0]);return '<a href="#" data-go="'+j+'" style="--lc:'+lc+'" class="'+(j<i?'done':'')+'" aria-label="'+SS.esc(SS.name(sid))+'"'+(j===i?' aria-current="step"':'')+'></a>'}).join('')+
    '</div><button class="btn" type="button" data-n'+(i===stops.length-1?' disabled':'')+'>'+L('下一站','Next')+'</button><a class="btn" href="'+back()+'">'+L('退出（Esc）','Exit (Esc)')+'</a></div>';
}
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-p],[data-n],[data-go]');if(!t)return;e.preventDefault();
  if(t.hasAttribute('data-p'))go(i-1,'&step=last');else if(t.hasAttribute('data-n'))go(i+1);else go(+t.getAttribute('data-go'))});
document.addEventListener('keydown',function(e){if(e.metaKey||e.ctrlKey||e.altKey)return;var k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();go(i+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(i-1,'&step=last')}
  else if(k==='Escape'){location.href=back()}
  else if(k==='Home')go(0);else if(k==='End')go(stops.length-1)});
document.addEventListener('ss-lang',render);
})();
</script>
</body>
</html>
