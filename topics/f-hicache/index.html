<script>
window.SS_TOPIC_CFG={
  anim: "f-hicache",
  ar: [900/350,380/420],
  steps: [
    {
      "t": [
        "在 SGLang 中设置缓存层级",
        "Organizing Cache Tiers Inside SGLang"
      ],
      "d": [
        "HiCache 使用显存 L1、主机内存 L2，以及按配置接入的外部存储 L3。",
        "HiCache uses GPU memory as L1, host memory as L2, and a configured external storage backend as L3."
      ],
      "b": [
        [
          "<p>KV Cache 是注意力层为已处理 token 保留的键和值。L1 保存 GPU 可直接使用的缓存，L2 提供本实例的主机内存缓存。L3 为可选层，只有后端和配置提供共享访问时，才能用于跨实例复用。</p>"
        ],
        [
          "<p>The KV cache holds keys and values retained by attention layers for processed tokens. L1 holds cache the GPU can use directly, and L2 provides host-memory cache for the local instance. Optional L3 enables cross-instance reuse when the backend and its configuration provide shared access.</p>"
        ]
      ]
    },
    {
      "t": [
        "用 HiRadixTree 匹配本地前缀",
        "Matching Local Prefixes with HiRadixTree"
      ],
      "d": [
        "HiRadixTree 用同一棵本地前缀索引定位在 L1 和 L2 连续命中的键值。",
        "HiRadixTree uses one local prefix index to locate a contiguous match across L1 and L2."
      ],
      "b": [
        [
          "<p>HiRadixTree 是 SGLang 基数树索引的分层扩展，记录 token 序列与本地缓存的位置。查找可以得到一段已在显存的前缀，紧接着一段仍在主机内存的前缀。索引查找阶段只定位数据，实际复制随后进行。</p>"
        ],
        [
          "<p>HiRadixTree extends SGLang’s radix-tree index to track token sequences and their local cache locations across tiers. Lookup may find the first part of a prefix in GPU memory and its contiguous continuation in host memory. The lookup locates those entries, with data copying handled separately.</p>"
        ]
      ]
    },
    {
      "t": [
        "从 L3 预取连续命中的部分",
        "Prefetching the Contiguous L3 Match"
      ],
      "d": [
        "本地匹配结束后，达到触发门槛的 L3 连续命中部分可以预先读入 L2。",
        "After local matching, a contiguous L3 hit that meets the trigger threshold can be prefetched into L2."
      ],
      "b": [
        [
          "<p>预取指在计算需要数据之前发起读取。HiCache 查询 L3 中紧随本地命中部分的缓存，按配置决定何时停止等待。预取停止后，已取得的缓存可以与本地命中部分一起使用。</p>"
        ],
        [
          "<p>Prefetching starts a read before computation needs the data. HiCache checks L3 for the continuation of the local match and follows its configured policy for when to stop waiting. Data already retrieved can be used alongside the local cache hit.</p>"
        ]
      ]
    },
    {
      "t": [
        "将主机内存中的命中块装入显存",
        "Loading Host Cache Hits into GPU Memory"
      ],
      "d": [
        "L2 中可复用的键值复制回 L1，SGLang 可按模型层重叠传输与计算。",
        "Reusable keys and values are copied from L2 to L1, and SGLang can overlap transfers with computation across model layers."
      ],
      "b": [
        [
          "<p>L2 包括原有主机缓存，也可以包括刚从 L3 预取的数据。进入预填充阶段时，已经抵达 GPU 的键值供模型使用。按层装载时，GPU 可以计算当前模型层，同时把下一层所需的缓存传到显存。</p>"
        ],
        [
          "<p>L2 can contain both existing host cache and data just prefetched from L3. During prefill, keys and values that have reached GPU memory are ready for the model. With layer-by-layer loading, the GPU can compute the current model layer while cache for the next layer moves into GPU memory.</p>"
        ]
      ]
    },
    {
      "t": [
        "按写入策略保留下层副本",
        "Retaining Copies According to the Write Policy"
      ],
      "d": [
        "写入策略决定何时在主机内存保留副本，包括入缓存时写入、按命中次数选择，或在显存驱逐时回写。",
        "The write policy determines when to copy KV to host memory: on cache insertion, selectively based on hit counts, or on eviction from GPU memory."
      ],
      "b": [
        [
          "<p>即时写入（write-through）在新 KV 进入显存缓存时把它复制到主机内存。选择性即时写入按命中次数选择前缀备份。回写（write-back）把备份推迟到显存驱逐时。配置 L3 后端后，HiCache 还可在外部存储保留副本。</p>"
        ],
        [
          "<p>Write-through copies new KV to host memory when it enters the GPU cache. Selective write-through uses hit counts to choose prefixes to back up. Write-back defers the backup until eviction from GPU memory. With an L3 backend configured, HiCache can also retain a copy in external storage.</p>"
        ]
      ]
    }
  ]
};
</script>
