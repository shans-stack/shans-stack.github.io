     "<p><code>guidellm run</code> combines a target endpoint, model, data, and profile. A profile specifies load behavior and can expand into sub-benchmarks using different scheduling strategies. The same requests can create different in-flight loads under different scheduling.</p>",

   "b": [

    [

   ],
   "b": [

    [
     "<p>The default outputs are <code>benchmarks.json</code> and <code>benchmarks.csv</code>. Configuration, achieved load, measurement windows, and dispatch delays affect whether a result can be reproduced. Slow data preparation or dispatch by the client can lower reported throughput while the endpoint still has spare capacity.</p>"
    ]
