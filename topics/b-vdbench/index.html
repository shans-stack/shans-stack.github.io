    "Oracle 的存储压测工具按参数文件生成块设备或文件系统 I/O 负载。",

   ],
   "b": [
    [
     "<p>Vdbench 用文本参数文件声明目标、访问方式和运行条件。块设备模式可直接访问 LUN（系统识别的逻辑块设备），文件系统模式按定义的布局在测试目录发起文件与目录操作。写入与格式化会改变测试目标，因此测试使用可写且可丢弃的设备或目录。</p>",
     "<p>截至 2026-11-23，Oracle 下载页列出的最新版本为 5.04.07，Oracle 于 2018-06-14 公告该版本可用。</p>"

    [
     "<p>Vdbench uses a text parameter file to declare targets, access patterns, and run conditions. Block mode can address a LUN, a logical block device recognized by the system. File system mode issues file and directory operations within a defined test layout. Writes and formatting change the target, so runs use writable, disposable devices or directories.</p>",
     "<p>As of November 23, 2026, the latest version listed by Oracle is 5.04.07. Oracle announced its availability on June 14, 2018.</p>"
    ]
   ]
  },
  {
   "t": [
    "块设备的 SD、WD 和 RD",
    "SD, WD, and RD for Block Devices"
   ],
   "d": [
    "SD 定义设备，WD 定义访问方式，RD 选择负载并规定运行条件。",
    "SD defines the device, WD defines the access pattern, and RD selects the workload and run conditions."
   ],
   "b": [
    [
     "<p>SD（Storage Definition）描述测试设备。WD（Workload Definition）引用 SD，描述 <code>xfersize</code> 传输大小、<code>rdpct</code> 读取比例和 <code>seekpct</code> 随机访问比例。RD（Run Definition）选定 WD，并设定 <code>iorate</code> 目标 I/O 速率、持续时间和报告间隔。</p>"
    ],
    [
     "<p>An SD (Storage Definition) describes a test device. A WD (Workload Definition) references an SD and describes transfer size (<code>xfersize</code>), read percentage (<code>rdpct</code>), and random access percentage (<code>seekpct</code>). An RD (Run Definition) selects WDs and sets the target I/O rate (<code>iorate</code>), run duration, and reporting interval.</p>"
    ]
   ]
  },
  {
   "t": [
    "文件系统的 FSD、FWD 和 RD",
    "FSD, FWD, and RD for File Systems"
   ],
   "d": [
    "文件系统模式定义目录树及文件操作，按文件系统操作速率加压。",
    "File system mode defines the directory tree and file operations, then applies a target operation rate."
   ],
   "b": [
    [
     "<p>FSD（File System Definition）从 <code>anchor</code> 指定的根路径定义目录树和文件布局。FWD（File System Workload Definition）引用 FSD，并指定读取、写入、创建或删除等操作及线程数。RD 以 <code>fwdrate</code> 设置文件系统操作速率。若测试包含创建、删除等元数据操作，该速率就同时包含这些操作。</p>"
    ],
    [
     "<p>An FSD (File System Definition) describes the directory tree and file layout under an <code>anchor</code> path. An FWD (File System Workload Definition) references an FSD and specifies operations such as read, write, create, or delete, plus a thread count. The RD sets the file system operation rate with <code>fwdrate</code>. When metadata operations are in the workload, the rate includes those operations.</p>"
    ]

    ],
    [
     "<p>Warm-up lets the system reach a representative state. Measurement intervals contribute the reported statistics. The target rate is the offered load, while the achieved rate counts completed operations. A sweep can reveal where response time increases or the system falls behind the target.</p>"
    ]
   ]
  },
  {
   "t": [
    "报告口径与对照条件",
    "Reporting and Comparison Conditions"
   ],
   "d": [
    "对照 IOPS、数据吞吐和响应时间时，同时核对操作类型、工作集和缓存状态。",
    "Compare IOPS, data throughput, and response time together with the operation mix, working set, and cache state."
   ],
   "b": [
    [
     "<p>IOPS 表示每秒完成的 I/O 次数，吞吐量表示每秒传输的字节数。相同 IOPS 在不同传输大小下对应不同吞吐。响应时间直方图显示操作分布，可补充均值。工作集是本次运行访问的数据范围。当工作集可被缓存容纳时，结果可能主要反映缓存路径。</p>"

    ]
   ]

 ]
