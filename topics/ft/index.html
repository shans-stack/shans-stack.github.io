window.SS_TOPIC_CFG = {

   ],
   "b": [
    [
     "<p>预训练是在规模较大的语料上建立初始参数的阶段。自回归语言模型用序列的已有部分预测下一个 token。实际出现的下一个 token 提供训练目标，这种从输入数据本身生成监督信号的方式称为自监督。</p>"
    ],
    [
     "<p>Pretraining establishes initial parameters using a large corpus. An autoregressive language model predicts the next token from the preceding sequence. The next token in the training text provides the target. Obtaining the training signal from the input data itself is called self-supervision.</p>"
    ]
   ]
  },
  {
   "t": [
    "在领域语料上继续预训练",
    "Continued Pretraining on Domain Text"
   ],
   "d": [
    "在已有权重上继续执行语言建模目标，使模型接触更多目标领域的术语和文本。",
    "Continuing the language-modeling objective from existing weights exposes the model to more target-domain language."
   ],
   "b": [
    [
     "<p>继续预训练从已有模型初始化，使用领域语料继续更新权重。例如技术语料可提高专门术语及其语境在训练数据中的覆盖。训练目标仍可沿用下一个 token 预测，领域范围主要由选用的数据决定。</p>"
    ],
    [
     "<p>Continued pretraining starts from an existing model and updates the weights on domain text. Technical corpora, for example, can increase coverage of specialized vocabulary and context. The objective can remain next-token prediction, with the selected data defining the domain coverage.</p>"
    ]
   ]
  },
  {
   "t": [
    "监督微调与目标输出",
    "Supervised Fine-Tuning and Target Outputs"
   ],
   "d": [
    "用指令和参考答案构成训练样本，让模型学习任务需要的回答方式。",
    "Instruction and reference-answer pairs teach the model the response patterns required by a task."
   ],
   "b": [
    [
     "<p>监督微调从已有权重出发，使用带参考输出的任务样本，例如指令与参考回答。对于对话数据，训练配置可将 token 预测损失限制在助手回答上，指令仍作为上下文。</p>"
    ],
    [
     "<p>Supervised fine-tuning starts from existing weights and uses task examples with target outputs, such as instructions paired with reference responses. With conversational data, the training configuration can restrict token prediction loss to assistant responses while retaining the instruction as context.</p>"
    ]
   ]
  },
  {
   "t": [
    "成对回答的偏好优化",
    "Preference Optimization with Paired Responses"
   ],
   "d": [
    "同一指令下标出更受偏好的回答，训练使模型相对倾向该回答。",
    "Preference data identifies a preferred response to the same prompt and trains the model to favor it relatively more."
   ],
   "b": [
    [
     "<p>偏好训练使用同一提示下的优选和次选回答。直接偏好优化（DPO）根据这类标注直接优化模型，使其提高优选回答相对于次选回答的倾向。</p>"
    ],
    [
     "<p>Preference training uses preferred and rejected responses to the same prompt. Direct Preference Optimization (DPO) uses these labels to optimize the model directly, increasing the relative preference for the chosen response.</p>"
    ]
   ]
  },
  {
   "t": [
    "全量微调更新基础权重",
    "Update Base Weights with Full Fine-Tuning"

   "d": [
    "全量微调把基础模型权重设为可训练参数，任务梯度可更新各层。",
    "Full fine-tuning makes the base weights trainable, allowing task gradients to update every layer."
   ],
   "b": [
    [
     "<p>全量微调根据任务数据计算损失和梯度，优化器据此更新基础权重。这种做法能直接调整全部层的参数，同时要为可训练参数保留梯度及所需的优化器状态。每个独立微调版本通常要保存一份新的模型权重。</p>"
    ],
    [
     "<p>Full fine-tuning computes loss and gradients from the task data, then uses an optimizer to update base weights. It can directly adjust parameters throughout the model, and it needs memory for gradients and optimizer state associated with those trainable parameters. An independent fine-tuned version typically saves a new set of model weights.</p>"
    ]
   ]
  },
  {
   "t": [

    "LoRA freezes the base weights and trains two smaller matrices that represent a weight update."
   ],
   "b": [
    [
     "<p>低秩适配（LoRA）把某些层的权重增量表示成两个小矩阵的乘积。基础权重仍参与前向计算，梯度只用于更新适配器参数。适配器可以独立保存并与对应基础模型组合，较少的可训练参数也减少了相应梯度和优化器状态。</p>"
    ],
    [
     "<p>Low-Rank Adaptation (LoRA) represents weight updates in selected layers as products of two smaller matrices. Base weights still participate in the forward pass, while gradients update the adapter parameters. Adapters can be saved separately and combined with the corresponding base model. Fewer trainable parameters also reduce their associated gradients and optimizer state.</p>"
    ]
   ]
  }
 ]
