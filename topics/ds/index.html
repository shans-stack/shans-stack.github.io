<script>
window.SS_TOPIC_CFG={
 "anim": "ds",
 "ar": [900/340,360/420],
 "steps": [
  {
   "t": [
    "固定样本版本",
    "Pin a Dataset Version"
   ],
   "d": [
    "数据集版本固定样本集合及其解释方式，便于重现一次训练的输入。",
    "A dataset version fixes the sample set and how it is interpreted so training inputs can be reproduced."
   ],
   "b": [
    [
     "<p>训练数据集由文本、图像或带标签的记录等样本组成。指定数据仓库的提交及数据文件，可以固定加载的样本来源。字段定义与预处理规则也可随训练配置保存，以便复现输入。</p>"
    ],
    [
     "<p>A training dataset consists of samples such as text, images, or labeled records. Selecting a repository commit and data files fixes the inputs loaded from that source. Field definitions and preprocessing rules can also be recorded in the training configuration to reproduce the inputs.</p>"
    ]
   ]
  },
  {
   "t": [
    "划分训练与验证数据",
    "Separate Training and Validation Data"
   ],
   "d": [
    "训练集用于更新模型，验证集用于评估模型在留出样本上的表现。",
    "The training split updates the model, and the validation split assesses it on held-out samples."
   ],
   "b": [
    [
     "<p>训练与验证分别使用各自的样本集合。同一源文档生成多个样本时，可将文档标识用作分组键，使这些样本进入同一集合，避免源文档在两个集合之间重叠。</p>"
    ],
    [
     "<p>Training and validation use separate sample sets. If a source document yields multiple samples, its identifier can serve as the grouping key so all its samples remain in one split, avoiding overlap between splits at the source-document level.</p>"
    ]
   ]
  },
  {
   "t": [
    "把小样本组装成分片",
    "Bundle Small Samples into Shards"
   ],
   "d": [
    "分片把一组样本放进同一文件，便于成组读取和分配。",
    "A shard stores a group of samples in one file for grouped reads and assignment."
   ],
   "b": [
    [
     "<p>分片是数据集的一部分，可以把许多小样本封装成一个可独立读取的文件。这种组织方式可以减少逐样本打开小文件的操作，并给多个加载进程提供可分配的读取单元。分片的划分还要给这些进程留下足够独立的读取任务。</p>"
    ],
    [
     "<p>A shard is a portion of a dataset that can package many small samples into one independently readable file. This reduces individual file opens and provides units of work that can be assigned to multiple loading processes. The sharding scheme also needs to leave enough independent reads for those processes.</p>"
    ]
   ]
  },
  {
   "t": [
    "给训练进程分配样本",
    "Assign Samples to Training Processes"
   ],
   "d": [
    "分布式采样器把一轮中的样本索引分配给各训练进程。",
    "A distributed sampler assigns sample indices to training processes for a pass through the dataset."
   ],
   "b": [
    [
     "<p>采样器决定读取哪些样本及其顺序。在数据并行训练中，多个训练进程处理各自的批次并合并参数更新所需的信息。采样器可以依进程编号分配索引，并在每轮调整打乱顺序。对无法整除的样本数，实现可按配置舍弃尾部索引或补齐索引。</p>"
    ],
    [
     "<p>A sampler determines which samples to read and in what order. In data-parallel training, processes handle their own batches and combine information used for model updates. A sampler can assign indices by process and reshuffle them each epoch. When the sample count is uneven, implementations can drop or pad trailing indices according to configuration.</p>"
    ]
   ]
  },
  {
   "t": [
    "预取下一批",
    "Prefetch the Next Batch"
   ],
   "d": [
    "GPU 计算当前批次时，加载进程可读取并准备下一批。",
    "While the GPU computes the current batch, loaders can read and prepare the next one."
   ],
   "b": [
    [
     "<p>数据加载可以包括读取、解码和批次整理。预取可在当前批次计算时提前准备后续批次，暂存批次会占用内存。如果读取和解码长期低于训练消费速率，预取队列仍会耗尽。</p>"
    ],
    [
     "<p>Loading can include I/O, decoding, and collation. Prefetching can prepare subsequent batches during computation on the current batch, using memory for staged batches. The prefetch queue still drains if sustained loading and decoding throughput is below the training consumption rate.</p>"
    ]
   ]
  }
 ]
};
</script>
