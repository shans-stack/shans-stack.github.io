        [
          "\u003cp>A BlueField DPU is a data processing unit that handles infrastructure tasks such as networking. DOCA supplies software for BlueField development and operation, and DOCA-Host includes host drivers and tools for BlueField and ConnectX. The following example uses DOCA Flow on BlueField to show how an application configures packet processing.\u003c/p>"
