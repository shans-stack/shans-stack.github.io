    ],
    [
     "<p>The key-value (KV) cache holds keys and values computed by a Transformer’s attention mechanism. Prefill processes the input tokens and builds the cache. Decode uses it to generate output tokens one at a time. The GPU’s high-bandwidth memory (HBM) provides the working space for the active cache.</p>"
    ]
   ]
  },
  {
   "t": [
    "将缓存写入持久存储",

   "d": [

    "Augmented Memory Grid saves computed KV blocks asynchronously to a persistent tier on NeuralMesh."
   ],
   "b": [
    [
     "<p>WEKA 将由 NeuralMesh 和 NVMe 存储提供的持久缓存层称为 Token Warehouse。活跃缓存可继续在显存中参与解码，写入仓库的副本可在对应显存空间被回收后继续保留，用于后续会话。</p>"
    ],
    [
     "<p>WEKA calls its persistent cache tier on NeuralMesh and NVMe storage the token warehouse. The active cache can remain in GPU memory for decoding. The stored copy remains available for later sessions after its GPU memory is reclaimed.</p>"
    ]
   ]
  },
  {
   "t": [
    "查找可复用的请求前缀",
    "Finding a Reusable Request Prefix"
   ],
   "d": [

    [

    ]
