window.SS_TOPIC_CFG={
  "anim": "n-cudnn",
  "ar": [
    2.7439024390243905,
    0.8181818181818182
  ],
  "steps": [
    {
      "t": [
        "GPU 上的深度学习算子",
        "Deep Learning Operations on the GPU"
      ],
      "d": [
        "框架可调用 cuDNN，在 NVIDIA GPU 上执行卷积、矩阵乘法和注意力等深度学习算子。",
        "A framework can call cuDNN to run deep learning operations such as convolution, matrix multiplication, and attention on NVIDIA GPUs."
      ],
      "b": [
        [
          "\u003cp>算子是对张量执行的运算，张量是按一个或多个维度排列的数据。cuDNN 提供用于训练和推理的 GPU 实现，框架可调用这些实现来执行模型中的一段计算。\u003c/p>"
        ],
        [
          "\u003cp>An operation computes on tensors, which are arrays organized along one or more dimensions. cuDNN supplies GPU implementations for training and inference. A framework can call those implementations to execute part of a model.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "用张量连接算子",
        "Connecting Operations with Tensors"
      ],
      "d": [
        "算子图描述卷积、偏置加法和 ReLU 之间的张量依赖。",
        "The operation graph describes the tensor dependencies between convolution, bias addition, and ReLU."
      ],
      "b": [
        [
          "\u003cp>算子图定义输入、输出以及算子之间的张量依赖。示例中，卷积从输入与权重计算特征，偏置加法为特征加上可学习的偏移，ReLU 将负值截为零。框架描述这段运算后，cuDNN 才为它选择执行方式。\u003c/p>"
        ],
        [
          "\u003cp>An operation graph specifies inputs, outputs, and the tensor dependencies between operations. In this example, convolution computes features from input and weights, bias addition applies a learned offset, and ReLU clips negative values to zero. cuDNN can then select an implementation for the specified computation.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "选择执行计划",
        "Selecting an Execution Plan"
      ],
      "d": [
        "同一张图可有多种引擎配置；支持检查筛出可用配置，再由选中的配置构建执行计划。",
        "One graph can have several engine configurations. Support checks identify compatible configurations, and the selected one becomes an execution plan."
      ],
      "b": [
        [
          "\u003cp>引擎是实现这张图的计算方案；配置可包含分块大小等参数。启发式查询按预期表现给出候选顺序，支持检查确认候选能在当前环境执行这张图。也可用实际运行时间比较受支持的候选，这一过程称为自动调优。\u003c/p>"
        ],
        [
          "\u003cp>An engine implements the graph. Its configuration can include settings such as tile size. A heuristic ranks candidates by expected performance, while support checks establish whether each can execute the graph in the current environment. Autotuning can time compatible candidates directly.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "融合中间运算",
        "Fusing Intermediate Operations"
      ],
      "d": [
        "在支持融合的计划中，卷积、偏置和 ReLU 可在同一个 GPU 内核中执行。",
        "A supported fused plan can execute convolution, bias addition, and ReLU in one GPU kernel."
      ],
      "b": [
        [
          "\u003cp>内核是提交到 GPU 执行的计算程序。融合实现可在内核内部消费中间结果，避免将这些结果分别作为张量写回显存再读入下一内核。图仍保留三个算子的逻辑顺序，是否能融合取决于图和可用的引擎。\u003c/p>"
        ],
        [
          "\u003cp>A kernel is a program launched on the GPU. A fused implementation can consume intermediate results within the kernel, avoiding separate writes to device memory and reads by the next kernel. The logical graph still specifies all three operations in order. Fusion depends on the graph and available engines.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "绑定缓冲区并执行",
        "Binding Buffers for Execution"
      ],
      "d": [
        "执行时将实际张量地址和所需工作区传给已构建的计划。",
        "At execution time, the built plan receives the actual tensor addresses and any required workspace."
      ],
      "b": [
        [
          "\u003cp>图定义的是计算和张量属性。运行时将输入、输出等外部张量绑定到实际的 GPU 内存地址；若计划需要工作区，还要提供临时缓冲区。随后 GPU 按计划执行并写入输出。\u003c/p>"
        ],
        [
          "\u003cp>The graph defines computation and tensor properties. At runtime, external tensors such as inputs and outputs are bound to actual GPU memory addresses. A plan that requires workspace also receives a scratch buffer. The GPU executes the plan and writes the outputs.\u003c/p>"
        ]
      ]
    }
  ]
};
