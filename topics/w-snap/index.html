<script>
window.SS_TOPIC_CFG={
  anim: "w-snap",
  ar: [848/324, 370/430],
  steps: [
    {
      t: ["保存文件系统状态", "Capture Filesystem State"],
      d: ["应用持续运行时，WEKA 可以为整个文件系统创建时间点快照。", "WEKA can capture a point-in-time snapshot of an entire filesystem while applications continue running."],
      b: [["\u003cp>文件系统快照保存捕获时的文件数据和元数据。元数据描述文件系统中的对象及其组织方式，例如文件名和目录结构。捕获后，活动文件系统可以继续接受写入，快照保留对应时间点的视图。\u003c/p>"], ["\u003cp>A filesystem snapshot preserves file data and metadata at capture time. Metadata describes filesystem objects and their organization, such as file names and directory structure. After capture, the live filesystem can continue accepting writes while the snapshot preserves the point-in-time view.\u003c/p>"]]
    },
    {
      t: ["保留变化前后的版本", "Retain Old and New Versions"],
      d: ["快照新增的空间取决于它与其他文件系统状态之间的差异。", "The additional space associated with a snapshot depends on how it differs from other filesystem states."],
      b: [["\u003cp>未变化的数据可以供活动文件系统和快照共同引用。活动文件系统改写部分内容后，快照仍可访问旧版本。例如活动状态引用 A 和 B′，快照仍引用 A 和 B。\u003c/p>", "\u003cp>快照占用同一文件系统的可用空间。删除快照可回收的空间受其他状态的引用影响，因而与快照可见的数据总量不同。\u003c/p>"], ["\u003cp>The live filesystem and a snapshot can reference the same unchanged data. When the live filesystem overwrites part of that data, the snapshot can still access the older version. For example, the live state can reference A and B′ while the snapshot still references A and B.\u003c/p>", "\u003cp>Snapshots consume free space in their filesystem. The space that deletion can reclaim depends on which data other states still reference, so it differs from the total amount visible in the snapshot.\u003c/p>"]]
    },
    {
      t: ["读取历史文件", "Access an Older File"],
      d: ["隐藏的 .snapshots 目录为读取和取回历史文件提供路径。", "The hidden .snapshots directory provides a path for reading and recovering older files."],
      b: [["\u003cp>.snapshots 可从文件系统根目录访问，也可从其子目录进入对应范围的历史视图。单个文件可以从快照中复制出来，活动文件系统的其他内容可以保留现状。\u003c/p>"], ["\u003cp>The hidden .snapshots directory is available from the filesystem root and also exposes the relevant historical view from subdirectories. A file can be copied out of a snapshot while the rest of the live filesystem stays in its current state.\u003c/p>"]]
    },
    {
      t: ["派生可写快照", "Derive a Writable Snapshot"],
      d: ["复制只读快照可以创建一条单独可写的分支。", "Duplicating a read-only snapshot can create a separate writable branch."],
      b: [["\u003cp>可写快照以原快照的数据为起点，可以承载测试等会修改数据的工作负载。写入发生在派生分支，原快照继续保存历史状态。WEKA 不支持将可写快照改回只读快照。\u003c/p>"], ["\u003cp>A writable snapshot starts with the source snapshot's data and can serve workloads that modify it, such as tests. Writes affect the derived branch while the original continues to preserve the historical state. WEKA does not support changing a writable snapshot back to read-only.\u003c/p>"]]
    },
    {
      t: ["恢复整个文件系统", "Restore a Whole Filesystem"],
      d: ["文件系统级恢复会以快照状态更新目标的数据和元数据。", "A filesystem restore updates the target's data and metadata to the snapshot state."],
      b: [["\u003cp>文件系统级恢复覆盖目标文件系统的数据和元数据。WEKA 要求恢复期间停止目标文件系统的 I/O 服务，使应用在恢复过程中暂停对目标的读写。\u003c/p>"], ["\u003cp>A whole-filesystem restore replaces the target's data and metadata with the snapshot state. WEKA requires the target filesystem's I/O services to stop during the restore, suspending application reads and writes to it.\u003c/p>"]]
    }
  ]
};
</script>
