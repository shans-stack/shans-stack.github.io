<script>
window.SS_TOPIC_CFG={
  anim: "w-snap",
  ar: [848/324, 370/430],
  steps: [
    {
      t: ["保存文件系统状态", "Capture Filesystem State"],
      d: ["应用持续运行时，WEKA 可以为整个文件系统创建默认只读的时间点快照。", "WEKA can capture an entire filesystem at a point in time while applications continue running. Snapshots are read-only by default."],
      b: [["<p>文件系统快照保存捕获时的文件数据和元数据。元数据描述文件名、目录结构及其他文件系统属性。捕获时，活动文件系统与快照引用已有数据块。活动文件系统可继续接受写入。</p>"],["<p>A filesystem snapshot preserves file data and metadata at capture time. Metadata describes names, directory structure, and other filesystem attributes. At capture time the live filesystem and snapshot reference the existing blocks. The live filesystem can continue accepting writes.</p>"]]
    },
    {
      t: ["保留变化前后的版本", "Retain Old and New Versions"],
      d: ["快照新增的空间取决于它与其他文件系统状态之间的差异。", "The additional space associated with a snapshot depends on how it differs from other filesystem states."],
      b: [["\u003cp>未变化的数据可以供活动文件系统和快照共同引用。活动文件系统改写部分内容后，快照仍可访问旧版本。例如活动状态引用 A 和 B′，快照仍引用 A 和 B。\u003c/p>", "\u003cp>快照占用同一文件系统的可用空间。删除快照可回收的空间受其他状态的引用影响，因而与快照可见的数据总量不同。\u003c/p>"], ["\u003cp>The live filesystem and a snapshot can reference the same unchanged data. When the live filesystem overwrites part of that data, the snapshot can still access the older version. For example, the live state can reference A and B′ while the snapshot still references A and B.\u003c/p>", "\u003cp>Snapshots consume free space in their filesystem. The space that deletion can reclaim depends on which data other states still reference, so it differs from the total amount visible in the snapshot.\u003c/p>"]]
    },
    {
      t: ["读取历史文件", "Access an Older File"],
      d: ["隐藏的 .snapshots 目录为读取和取回历史文件提供路径。", "The hidden .snapshots directory provides a path for reading and recovering older files."],
      b: [["\u003cp>.snapshots 可从文件系统根目录访问，也可从其子目录进入对应范围的历史视图。单个文件可以从快照中复制出来，活动文件系统的其他内容可以保留现状。\u003c/p>"], ["\u003cp>The hidden .snapshots directory is available from the filesystem root and also exposes the relevant historical view from subdirectories. A file can be copied out of a snapshot while the rest of the live filesystem stays in its current state.\u003c/p>"]]
    },
    {
      t: ["创建并访问可写克隆", "Create and Access a Writable Clone"],
      d: ["同一文件系统中的可写克隆以只读快照为起点，并有自己的访问点。", "A writable clone starts from a read-only snapshot in the same filesystem and has its own access point."],
      b: [["<p>在 WEKA 图形界面中，Duplicate Snapshot 会预填源文件系统与源快照，并允许将新快照设为可写。源和克隆初始引用同一份数据。</p>", "<p>克隆的访问点是挂载文件系统中 <code>.snapshots</code> 下的独立目录。测试任务可修改其中的文件，原只读快照继续保留历史版本。</p>"],["<p>In the WEKA GUI, Duplicate Snapshot preselects the source filesystem and snapshot and offers a writable setting. The source and clone initially reference the same data.</p>", "<p>The clone has its own access directory under <code>.snapshots</code> in the mounted filesystem. Test workloads can edit files there while the source snapshot retains its earlier version.</p>"]]
    },
    {
      t: ["从克隆另建只读快照", "Capture a New Read-Only Snapshot from the Clone"],
      d: ["可写快照保持可写。另建只读快照可以固定克隆当前的内容。", "The writable snapshot stays writable. A new read-only snapshot captures its current contents."],
      b: [["<p>WEKA 的快照更新操作允许修改名称和访问点。可写状态无法改回只读。以克隆为源另建的只读快照会保留测试后的版本，克隆可以继续接收写入。</p>"],["<p>WEKA’s snapshot update operation can change the name and access point. Writability cannot be reversed. A new read-only snapshot of the clone preserves the post-test version while the clone can continue accepting writes.</p>"]]
    },
    {
      t: ["将新的只读快照上传到对象存储", "Upload the New Read-Only Snapshot to Object Storage"],
      d: ["Snap-to-Object 可将新的只读快照上传到配置好的对象存储。", "Snap-to-Object can upload the new read-only snapshot to configured object storage."],
      b: [["<p>对象存储保留新快照所记录的测试后状态。Snap-to-Object 只接受只读快照，可写克隆继续留在原文件系统中。</p>"], ["<p>Object storage preserves the post-test state captured by the new snapshot. Snap-to-Object accepts only read-only snapshots, and the writable clone remains in the original filesystem.</p>"]]
    },
    {
      t: ["恢复整个文件系统", "Restore a Whole Filesystem"],
      d: ["文件系统级恢复会以快照状态更新目标的数据和元数据。", "A filesystem restore updates the target's data and metadata to the snapshot state."],
      b: [["<p>文件系统级恢复用快照状态更新目标的数据和元数据。图中是直接覆盖目标的恢复流程，目标文件系统的 I/O 在恢复期间需要暂停。</p>"], ["<p>A whole-filesystem restore updates the target's data and metadata to the snapshot state. The diagram shows a direct overwrite of the target, which requires pausing I/O on that filesystem during the restore.</p>"]]
    }
  ]
};
</script>
