        "Interactive Validation"

      "d": [
        "在工作区加载训练代码和样本数据，通过小规模实验验证训练流程。",
        "Load training code and sample data into a workspace to validate the training workflow with a small experiment."
      ],
      "b": [
        [
          "<p>工作区是可以从浏览器或开发工具连接的交互式运行环境。代码和样本数据接入后，可先验证数据读取、预处理和训练脚本，也可以调试内存或依赖问题。通过验证的代码版本与依赖配置可以交给批量训练使用。</p>","<p>Red Hat OpenShift AI 是这类平台的一个例子：它在 OpenShift 上提供工作区、训练、模型部署与监控工具。</p>"
        ],
        [
          "<p>A workspace is an interactive runtime that developers reach through a browser or development tool. With code and sample data in place, it can validate data loading, preprocessing, and the training script, and help diagnose memory or dependency problems. The validated code revision and dependency configuration can then go into a batch training job.</p>","<p>Red Hat OpenShift AI is one example of such a platform, providing workbenches, training, model deployment, and monitoring tools on OpenShift.</p>"
        ]
      ]
    },
    {
      "t": [
        "提交训练作业",
        "Submitting a Training Job"
      ],
      "d": [
        "将镜像、代码入口、数据和资源需求记录在作业规格里，由调度器分配资源。",
        "A job specification records the image, entry point, data, and resource requirements for the scheduler."
      ],
      "b": [
        [
          "<p>容器镜像封装运行时和软件依赖，入口指定启动训练的命令。训练作业同时声明数据位置、参数和所需 GPU。调度器负责依据资源可用性和策略安排运行，提交后作业可独立于交互会话执行。NVIDIA Run:ai 将这种训练作业和交互式工作区定义为两类工作负载。</p>"
        ],
        [
          "<p>A container image packages the runtime and software dependencies, and the entry point identifies the command that starts training. The job also declares its data location, parameters, and GPU requirements. The scheduler assigns capacity under its resource and policy constraints, and the submitted job can run independently of the interactive session. NVIDIA Run:ai defines training jobs and interactive workspaces as separate workload types.</p>"
        ]
      ]
    },

      "t": [
        "分布式训练",
        "Distributed Training"

      ],
      "b": [
        [

        ],
        [
          "<p>Data parallelism is one common approach. Each worker holds a replica of the model, processes a different shard, and computes gradients, which guide parameter updates. PyTorch DistributedDataParallel synchronizes gradients between replicas. The training code determines how data is assigned to workers.</p>"

      ]

      ],
      "b": [

        ],
        [
          "<p>A checkpoint is a snapshot of training state at a particular point. Resuming training typically needs model weights, optimizer state, and progress metadata. The optimizer uses gradients to update parameters and accumulates its own state over the run. Saving the checkpoint outside the running instance lets a replacement instance read the latest successfully written state.</p>"

      ]

        "Evaluation and Model Registration"
