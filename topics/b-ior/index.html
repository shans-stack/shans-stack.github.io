<script>
window.SS_TOPIC_CFG={
 "anim": "b-ior",
 "ar": [
  2.6,
  1.0588235294117647
 ],
 "steps": [
  {
   "t": [
    "多个进程读写同一套存储",
    "Parallel Processes on One Storage System"
   ],
   "d": [
    "IOR 用 MPI 组织多个进程，对并行存储分别测量写入和读取吞吐。",
    "IOR uses MPI to coordinate processes and measure write and read throughput separately on parallel storage."
   ],
   "b": [
    [
     "<p>MPI（消息传递接口）为分布在一个或多个节点上的进程提供通信与协调机制。IOR 的进程各自执行 I/O，常用接口包括 POSIX 文件调用和 MPI-IO。吞吐反映这些进程共同运行时的结果。文件与目录的元数据操作另由同项目的 mdtest 衡量。</p>",
     "<p>截至 2026-11-23，最新公开正式版为 IOR 4.0.0，发布于 2024-01-12。</p>"
    ],
    [
     "<p>MPI, the Message Passing Interface, provides communication and coordination for processes across one or more nodes. IOR processes perform I/O through interfaces such as POSIX file calls or MPI-IO. Throughput reflects their combined run. The companion mdtest benchmark measures file and directory metadata operations.</p>",
     "<p>As of November 23, 2026, IOR 4.0.0 was the latest public stable release. It was released on January 12, 2024.</p>"
    ]
   ]
  },
  {
   "t": [
    "共享文件与每进程一文件",
    "Shared Files and File per Process"
   ],
   "d": [
    "文件布局决定多个进程是访问同一个文件内的各自区间，还是访问独立文件。",
    "File layout determines whether processes use separate regions of one file or operate on separate files."
   ],
   "b": [
    [
     "<p>MPI 启动器定义进程数和节点放置，例如 <code>mpirun -n N ior -f workload.ior</code> 启动 N 个进程，脚本定义 I/O 接口、方向与测试路径。常规布局下，各进程可写入共享文件中不同的区间；<code>-F</code> 切换到每进程一个文件。两种布局对文件系统的并发访问方式有不同要求，布局是读报告的重要条件。</p>"
    ],
    [
     "<p>The MPI launcher defines process count and placement. For example, <code>mpirun -n N ior -f workload.ior</code> starts N processes, and the script defines the I/O interface, direction, and test path. In a typical shared-file layout, processes write distinct regions of the same file. <code>-F</code> selects a file per process. The layouts exercise file system concurrency differently, making layout a key reporting condition.</p>"
    ]
   ]
  },
  {
   "t": [
    "传输大小、块和分段",
    "Transfers, Blocks, and Segments"
   ],
   "d": [
    "在完整写读阶段，每个进程每段处理一个块，块由多次传输组成。",
    "For a complete read or write phase, each process handles one block per segment, and each block consists of transfers."
   ],
   "b": [
    [
     "<p><code>-t</code> 是一次传输大小，<code>-b</code> 是每进程每段的数据量，<code>-s</code> 是段数。在常规顺序配置且完整跑完的情况下，每个方向的逻辑总字节数等于参与进程数乘以 <code>-b</code> 再乘以 <code>-s</code>。提前截止的运行以实际传输量为准。</p>"
    ],
    [
     "<p><code>-t</code> sets the transfer size, <code>-b</code> sets bytes per process per segment, and <code>-s</code> sets the number of segments. In a regular sequential configuration that completes, logical bytes in each direction equal the participating process count times <code>-b</code> times <code>-s</code>. A run that stops early uses its actual transfer volume.</p>"
    ]
   ]
  },
  {
   "t": [
    "客户端缓存与同步",
    "Client Cache and Synchronization"
   ],
   "d": [
    "读回可命中本地页面缓存，缓冲写也可能在后端完成前结束计时。",
    "Readback can hit the local page cache, and buffered writes can finish timing before backend completion."
   ],
   "b": [
    [
     "<p><code>-C</code> 调整读回任务映射。跨节点的偏移与实际进程放置匹配时，进程可读到另一节点写入的数据，从而避开写入节点的本地页面缓存。对 POSIX 测试，<code>-e</code> 在写阶段关闭文件时执行同步。<code>-Q</code> 可指定读回偏移。在这类测试中，缓存和写完成是两个测量条件，服务端缓存仍需考虑。</p>"
    ],
    [
     "<p><code>-C</code> changes the readback task mapping. With a cross-node offset that matches actual rank placement, a process reads data written on another node, avoiding the writer's local page cache. For POSIX tests, <code>-e</code> synchronizes the write at file close. <code>-Q</code> can set the readback offset. Client caching and write completion are separate measurement conditions. Server-side caching still matters.</p>"
    ]
   ]
  },
  {
   "t": [
    "吞吐与阶段用时",
    "Throughput and Phase Timing"
   ],
   "d": [
    "每次迭代分别报告读和写的聚合吞吐，以及打开、传输、关闭和总用时。",
    "Each iteration reports aggregate read and write throughput separately, with open, transfer, close, and total times."
   ],
   "b": [
    [
     "<p>IOR 迭代输出中的 <code>bw(MiB/s)</code> 是全体参与进程的聚合吞吐。打开、读写、关闭及总用时能帮助区分时间花在何处。重复运行的结果可以查看波动；单看最好一次，或把 IOR 聚合吞吐当成应用吞吐，会丢失文件布局、缓存、进程数和实际访问模式所限定的范围。</p>"
    ],
    [
     "<p>The <code>bw(MiB/s)</code> field in IOR's iteration output is aggregate throughput across participating processes. Open, read/write, close, and total times help identify where time was spent. Repeated runs show variation. A single best iteration or an application-throughput claim based on IOR alone loses the scope defined by layout, cache, process count, and access pattern.</p>"
    ]
   ]
  }
 ]
};
