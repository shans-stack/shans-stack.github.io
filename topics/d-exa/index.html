<script>
/* 七步：标题、一句话说明（演示模式也用）、文档模式正文。正文只取自 Lustre 公开手册与作者学习笔记里讲 Lustre 架构、EXAScaler 公开功能的页面，不写性能数字，不做厂商对比。 */
window.SS_TOPIC_CFG={
 "anim": "d-exa",
 "ar": [960/476,480/692],
 "steps": [
  {
   "t": [
    "单文件服务器的访问瓶颈",
    "Single-Server File Access Bottleneck"
   ],
   "d": [
    "很多计算节点同时读同一份数据，单台文件服务器只有一个出口，请求在它门口排队。",
    "Many compute nodes read the same data at once, but a single file server has only one way out, so requests queue at its door."
   ],
   "b": [
    [
     "<p>GPU 集群与超算的计算节点可并发读取训练数据、写入结果。由单台文件服务器服务全部请求时，其链路和处理能力限制聚合访问性能。</p>",
     "<p>并行文件系统要解决的就是这件事：让数据分散在很多台服务器上，节点可以同时找它们要数据。EXAScaler 就是这样一套并行文件系统，下面几步讲它的基本做法。</p>"
    ],
    [
     "<p>Compute nodes in GPU clusters and supercomputers can read training data and write results concurrently. When a single file server serves every request, its links and processing capacity limit aggregate I/O.</p>",
     "<p>A parallel file system solves exactly this: data is spread across many servers, and nodes can ask all of them for data at the same time. EXAScaler is such a parallel file system, and the next steps show how it works.</p>"
    ]
   ]
  },
  {
   "t": [
    "元数据与文件数据服务",
    "Metadata and File Data Services"
   ],
   "d": [
    "常规 OST 布局中，元数据和文件布局存于 MDT，文件内容存于 OSS 提供的 OST。",
    "For a conventional OST layout, the MDT holds metadata and the layout, while the OSTs served by the OSS store the file data."
   ],
   "b": [
    [
     "<p><b>元数据</b>描述文件的名称、目录、权限和<b>布局</b>。元数据服务器（MDS）通过元数据目标（MDT）保存这些信息。常规布局的文件内容以对象形式存放在对象存储目标（OST）上，由对象存储服务器（OSS）提供访问。</p>",
     "<p>一个文件的数据可以分布在多个 OST 上。DoM 布局可将文件的起始数据放在 MDT 中。客户端挂载时从管理服务（MGS）获取文件系统配置。</p>"
    ],
    [
     "<p><b>Metadata</b> describes a file’s name, directory, permissions, and <b>layout</b>. The metadata server (MDS) stores this information on a metadata target (MDT). In a conventional layout, file data is stored as objects on object storage targets (OSTs) served by object storage servers (OSSs).</p>",
     "<p>A file’s data can span multiple OSTs. A DoM layout can place the initial file data on the MDT. Clients obtain the file system configuration from the management service (MGS) at mount time.</p>"
    ]
   ]
  },
  {
   "t": [
    "从元数据服务获取布局",
    "Layout Lookup Through the Metadata Service"
   ],
   "d": [
    "需要查找布局时，客户端会向元数据服务获取文件属性和 OST 布局。",
    "When a layout lookup is needed, the client gets the file attributes and OST layout from the metadata service."
   ],
   "b": [
    [
     "<p>原生 Lustre 客户端在操作系统内核运行。应用打开采用常规 OST 布局的文件且需要向服务端查找时，客户端向元数据服务获取文件属性与布局。布局描述文件的字节范围对应哪些对象。</p>",
     "<p>对于已实例化的 OST 布局范围，连续的数据读写由相应 OSS 处理。若写入跨入尚未实例化的 PFL 组件，元数据服务会参与分配该范围所需的对象。</p>"
    ],
    [
     "<p>The native Lustre client runs in the operating system kernel. When an application opens a file with a conventional OST layout and needs a server lookup, the client obtains the file attributes and layout from the metadata service. The layout maps file byte ranges to objects.</p>",
     "<p>Once the OST layout for a range has been instantiated, the corresponding OSSs handle ongoing data I/O. If a write crosses into a PFL component that has yet to be instantiated, the metadata service participates in allocating its objects.</p>"
    ]
   ]
  },
  {
   "t": [
    "并行访问数据服务器",
    "Parallel Access to Data Servers"
   ],
   "d": [
    "拿到布局后，客户端直接并行读写多台数据服务器，元数据服务器不在这条路上。",
    "With the layout in hand, the client reads and writes several data servers in parallel; the metadata server is not on this path."
   ],
   "b": [
    [
     "<p>有了布局，客户端就知道第 1 块在哪台、第 2 块在哪台，于是同时向这几台数据服务器要数据。数据从数据服务器直接流到计算节点，不经过元数据服务器，也没有中间的网关转一手。这就是「元数据路径和数据路径分开」：找数据的路和搬数据的路是两条。</p>",
     "<p>客户端和服务器之间走 Lustre 自己的网络层 LNet，可以跑在以太网上，也可以跑在 InfiniBand 上，并支持 RDMA。</p>"
    ],
    [
     "<p>With the layout, the client knows which server holds piece 1, which holds piece 2, and so on, so it asks those data servers for data at the same time. Data flows from the data servers straight to the compute node, not through the metadata server and not through a gateway in between. This is the separation of the metadata path from the data path: the road to find data and the road to move data are two different roads.</p>",
     "<p>Clients and servers communicate over LNet, Lustre's own network layer, which runs over Ethernet or InfiniBand and supports RDMA.</p>"
    ]
   ]
  },
  {
   "t": [
    "聚合带宽与并发访问",
    "Aggregate Bandwidth and Concurrent Access"
   ],
   "d": [
    "同样一段时间，从几台服务器同时取数，送到的数据比只靠一台多得多。",
    "In the same amount of time, pulling data from several servers at once delivers far more than relying on one."
   ],
   "b": [
    [
     "<p>一台服务器的网口和盘有上限；四台同时出数，客户端收到的数据就是四份速度叠在一起。集群里有很多客户端时也一样：各客户端分别访问不同的数据服务器，不会集中到同一台。</p>",
     "<p>要注意的是，「叠加」是近似的：实际能叠多少，还取决于网络、客户端数量和数据在服务器之间分得是否均匀。不能把它当成「加一台就一定多一份」的保证。画面只是示意，不代表实测数字。</p>"
    ],
    [
     "<p>One server's network port and disks have a limit; with four servers sending at once, the client receives four streams added together. The same holds with many clients in a cluster: they go to different data servers instead of crowding one door.</p>",
     "<p>Note that the adding up is approximate: how much adds up in practice depends on the network, the number of clients and how evenly the data is spread across servers. It is not a guarantee that one more server always adds one more share. The animation is schematic, not measured.</p>"
    ]
   ]
  },
  {
   "t": [
    "新增 OST 与文件布局",
    "Adding OSTs and Allocating File Layouts"
   ],
   "d": [
    "新增 OST 增加容量并可参与后续分配。文件使用哪些目标、占用几个条带由布局决定。",
    "New OSTs add capacity and can serve later allocations. The layout determines the target selection and stripe count for each file."
   ],
   "b": [
    [
     "<p>新增在线 OST 可增加可用容量和潜在的聚合带宽。文件创建时，布局策略、OST 池和目标状态决定条带数量和具体目标。示意中，已有文件 A 保留四目标布局，新文件 B 分别示例选择四个和五个 OST。</p>",
     "<p>新增 OST 本身不会重分布旧文件。利用新目标重排旧数据需要迁移文件或重写数据。</p>"
    ],
    [
     "<p>Adding active OSTs can increase available capacity and potential aggregate bandwidth. The layout policy, OST pool, and target state determine the stripe count and target selection when a file is created. In the illustration, existing file A retains its four-target layout, and the two example layouts for new file B select four and five OSTs, respectively.</p>",
     "<p>Existing files retain their placement when an OST is added. Redistributing existing data to the new targets requires migrating files or rewriting data.</p>"
    ]
   ]
  },
  {
   "t": [
    "EXAScaler 与上游 Lustre",
    "EXAScaler and Upstream Lustre"
   ],
   "d": [
    "EXAScaler 以 Lustre 为基础，提供 Hot Pools、数据服务和 Insight 管理监控。",
    "EXAScaler builds on Lustre and provides Hot Pools, data services, and Insight for management and monitoring."
   ],
   "b": [
    [
     "<p>上游 Lustre 提供目录自动分片、DoM 和 PFL。目录自动分片可将较大的目录分布到多个元数据目标，DoM 可把文件起始数据放到元数据目标上，PFL 可为不同字节范围指定不同的布局。</p>",
     "<p>EXAScaler 在 Lustre 基础上提供 Hot Pools 冷热分层、多租户、NFS / SMB 网关、S3 数据服务和 Insight 监控。DDN 将 EXAScaler 集成进面向高性能计算与 GPU 集群的存储平台。</p>"
    ],
    [
     "<p>Upstream Lustre provides directory auto-splitting, DoM, and PFL. Directory auto-splitting can distribute a large directory across metadata targets, DoM can place the first part of a file on a metadata target, and PFL can assign different layouts to different byte ranges.</p>",
     "<p>EXAScaler builds on Lustre with Hot Pools tiering, multi-tenancy, NFS and SMB gateways, S3 data services, and Insight monitoring. DDN integrates EXAScaler into storage platforms for high-performance computing and GPU clusters.</p>"
    ]
   ]
  }
 ]
};
</script>
