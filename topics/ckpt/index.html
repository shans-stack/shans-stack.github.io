<script>
window.SS_TOPIC_CFG={
 "anim": "ckpt",
 "ar": [900/340,360/420],
 "steps": [
  {
   "t": [
    "保存继续训练所需状态",
    "Save the State Needed to Resume"
   ],
   "d": [
    "检查点保存模型参数、优化器状态和训练进度。",
    "A checkpoint saves model parameters, optimizer state and training progress."
   ],
   "b": [
    [
     "<p>检查点是训练在选定时刻保存的一组可恢复状态。模型参数决定模型如何计算，优化器根据训练信号更新这些参数。保存模型参数和优化器的累积状态，使重启后能够按原来的更新规则继续训练。为续接学习率、随机过程或输入顺序，训练代码还可以保存相应的调度、随机数和数据读取状态。</p>"
    ],
    [
     "<p>A checkpoint is a recoverable set of training state saved at a selected point. Model parameters determine the model’s computation, and the optimizer updates them using training signals. Saving parameters and accumulated optimizer state lets a restarted run continue with the same update rule. Training code can also save scheduling, random-number and data-loading state to resume learning rates, random processes or input order.</p>"
    ]
   ]
  },
  {
   "t": [
    "各进程写入所负责的分片",
    "Write Shards from Their Owning Processes"
   ],
   "d": [
    "分布式训练进程可以把各自负责的状态并行写入检查点目录。",
    "Distributed training processes can write their portions of the state into a checkpoint directory in parallel."
   ],
   "b": [
    [
     "<p>当模型和优化器状态分布在多个进程中，一个分片可以代表其中一部分状态。分布式检查点可以让参与进程各自写入分片，并记录位置和范围。恢复时，读取器据此定位各进程所需的状态。</p>"
    ],
    [
     "<p>When model and optimizer state are distributed across processes, a shard can hold a portion of that state. Distributed checkpointing can have participating processes write their own shards and record locations and ranges. At recovery time, the reader uses this information to locate the state needed by each process.</p>"
    ]
   ]
  },
  {
   "t": [
    "分片写入完成后登记检查点",
    "Checkpoint Finalization After Shard Writes"
   ],
   "d": [
    "独立保存的检查点在所需分片和元数据写入成功后可用于恢复。",
    "A separately stored checkpoint is recoverable after the required shards and metadata have been written."
   ],
   "b": [
    [
     "<p>新检查点可以写入独立位置。以 PyTorch Distributed Checkpoint 的文件系统写入器为例，各进程写入其数据，协调进程完成检查点元数据写入。写入失败时，仍可选择已保留的完整版本恢复。</p>"
    ],
    [
     "<p>A new checkpoint can be written to a separate location. With the PyTorch Distributed Checkpoint file-system writer, participating processes write their data and a coordinator finalizes the checkpoint metadata. A retained complete version remains available if the new write fails.</p>"
    ]
   ]
  },
  {
   "t": [
    "暂存后在后台写入",
    "Stage a Copy for Background Writes"
   ],
   "d": [
    "把状态复制到暂存缓冲区后，后台写入可以与后续训练重叠。",
    "After state is copied into a staging buffer, background writes can overlap later training."
   ],
   "b": [
    [
     "<p>暂存把当前检查点所需状态复制到独立缓冲区，让训练可以继续修改工作状态。后台任务再从暂存区写入存储。复制、缓冲区内存以及后台写入的资源占用都需要计入开销，写入完成后，检查点才成为可用的恢复点。</p>"
    ],
    [
     "<p>Staging copies checkpoint state into a separate buffer so training can continue changing the working state. A background task then writes from that buffer to storage. The copy, buffer memory and background I/O all contribute to overhead. The checkpoint becomes a recovery point when the write completes.</p>"
    ]
   ]
  },
  {
   "t": [
    "从最近的完整版本继续训练",
    "Resume from the Latest Complete Checkpoint"
   ],
   "d": [
    "重启后先还原状态，再执行检查点之后的训练步骤。",
    "After restart, the job restores its state and runs the steps after the checkpoint."
   ],
   "b": [
    [
     "<p>恢复流程将选定检查点中的模型和优化器状态加载到训练进程。应用保存并恢复相应的进度和数据读取状态时，可以从该位置继续取样。中断前在该检查点之后完成的训练步骤需要重新执行。保存频率越高，潜在的重做区间越短，保存操作也越频繁。</p>"
    ],
    [
     "<p>The training processes load model and optimizer state from the selected checkpoint. When the application saves and restores progress and input state, sampling can resume from that point. Steps completed after the checkpoint must be repeated. More frequent saves shorten the potential replay interval and increase the number of save operations.</p>"
    ]
   ]
  }
 ]
};
</script>
