<script>
window.SS_TOPIC_CFG={
 "anim": "embed",
 "ar": [900/340,360/420],
 "steps": [
  {
   "t": [
    "解析文档并保留出处",
    "Parse Documents and Retain Provenance"
   ],
   "d": [
    "解析得到可处理的文本，同时保留标题、页码或章节等来源信息。",
    "Parsing produces text for processing and preserves source details such as headings, pages or sections."
   ],
   "b": [
    [
     "<p>向量化摄取是把源内容处理成可用于向量检索的记录。对文档，解析器先从页面或文件中抽取正文和结构，再记录文本对应的位置。位置和文档标识可在检索命中后用来定位原文。</p>"
    ],
    [
     "<p>Embedding ingest turns source content into records for vector retrieval. A document parser first extracts text and structure from pages or files, then records where the text came from. A location and document identifier can link a search result back to its source.</p>"
    ]
   ]
  },
  {
   "t": [
    "按文档结构切分文本",
    "Text Chunking by Document Structure"
   ],
   "d": [
    "标题与段落可作为切分边界，索引记录可保留所属文档及章节。",
    "Headings and paragraphs can serve as chunk boundaries. Index records can retain the source document and section."
   ],
   "b": [
    [
     "<p>文本块是可独立编码与检索的文档片段。切块可沿章节或段落边界保留相关内容，超过模型输入上限的片段再继续分拆。块的边界影响一次命中能返回多少上下文，来源位置可将结果连回文档。</p>"
    ],
    [
     "<p>A chunk is a passage that can be encoded and retrieved independently. Chunking can preserve related material along section or paragraph boundaries and split passages that exceed the encoder’s input limit. Chunk boundaries determine the context returned with a match, and source locations connect results back to the document.</p>"
    ]
   ]
  },
  {
   "t": [
    "将文本块编码为向量",
    "Encode Each Chunk as a Vector"
   ],
   "d": [
    "嵌入模型把一个文本块编码为一组数字，供后续计算语义相似度。",
    "An embedding model encodes a chunk as a list of numbers for semantic similarity scoring."
   ],
   "b": [
    [
     "<p>嵌入向量是一组由模型计算出的数值，用来表示输入内容。摄取过程为每个文本块生成向量，并关联块的标识。检索时，查询文本也需要用兼容的编码方式进入同一向量空间，再用相似度度量为候选块排序。</p>"
    ],
    [
     "<p>An embedding is a vector of numbers computed by a model to represent its input. Ingest produces a vector for each chunk and associates it with the chunk identifier. At query time, compatible encoding places the query in the same vector space so a similarity measure can rank candidate chunks.</p>"
    ]
   ]
  },
  {
   "t": [
    "将向量和来源写入索引",
    "Index Vectors with Their Sources"
   ],
   "d": [
    "索引记录把向量与原文片段的标识、位置和检索字段关联起来。",
    "An index entry associates the vector with its source chunk identifier, location and search fields."
   ],
   "b": [
    [
     "<p>向量索引按相似度查找候选记录。向量可以和块文本一同写入，也可以和指向块文本的引用写入。文档标识、章节和内容类别等字段支持取回原文、显示出处或限制查询范围。</p>"
    ],
    [
     "<p>A vector index finds candidate records by similarity. A vector can be indexed with its chunk text or with a reference to the text. Fields such as the document identifier, section and content category support source lookup, attribution or query filtering.</p>"
    ]
   ]
  },
  {
   "t": [
    "同步修改和删除",
    "Apply Updates and Deletions"
   ],
   "d": [
    "文档修改时更新受影响的索引记录，文档删除时移除其对应记录。",
    "When a document changes, affected index records are updated. Deletion removes its associated records."
   ],
   "b": [
    [
     "<p>索引可用父文档标识关联该文档的块。以 Azure AI Search 索引投影为例，父文档变更时可更新其块，并移除更新后不再存在的块。源文档删除时，配置了支持该来源的删除检测策略后，索引器才会移除关联记录。</p>"
    ],
    [
     "<p>An index can associate chunks with a parent document identifier. In Azure AI Search index projections, a change to a parent document can update its chunks and remove chunks no longer present after the update. Deleting the source document removes the associated records when the indexer has a supported deletion detection policy configured.</p>"
    ]
   ]
  }
 ]
};
