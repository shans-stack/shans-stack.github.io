<script>
window.SS_TOPIC_CFG={
 "anim": "d-flr",
 "ar": [900/342,360/320],
 "steps": [
  {
    "t": [
      "同一文件的多个镜像",
      "Multiple Mirrors of One File"
    ],
    "d": [
      "FLR 为选定文件维护多个数据布局，每个镜像覆盖同一份逻辑内容。",
      "FLR maintains multiple layouts for a selected file, each covering the same logical contents."
    ],
    "b": [
      [
        "<p>FLR（File Level Redundancy，文件级冗余）是 Lustre 的按文件保护机制。镜像描述一份逻辑内容的存放位置，文件仍以同一个路径访问。文件条带化把不同数据段分布到多个目标，镜像则为这些数据段保留额外副本。</p>"
      ],
      [
        "<p>File Level Redundancy (FLR) is Lustre’s per-file protection mechanism. Each mirror locates a copy of the logical contents under the same file path. Striping distributes different ranges across targets, and mirroring keeps additional copies of those ranges.</p>"
      ]
    ]
  },
  {
    "t": [
      "按故障域放置镜像",
      "Placing Mirrors Across Failure Domains"
    ],
    "d": [
      "镜像可选用不同的目标池，使同一个故障域失效时仍有独立的数据副本。",
      "Mirrors can use separate target pools so one copy can remain available if a failure domain goes offline."
    ],
    "b": [
      [
        "<p>OST（Object Storage Target，数据目标）保存文件数据。OST 池是供布局选择的一组目标。故障域是一组可能一起失效的资源，例如同一服务器或同一机柜。镜像跨故障域的效果取决于池与实际硬件拓扑的对应关系。</p>"
      ],
      [
        "<p>An Object Storage Target (OST) holds file data. An OST pool groups targets for layout selection. A failure domain groups resources that can fail together, such as those in one server or rack. Protection across domains depends on how the pools map to the physical topology.</p>"
      ]
    ]
  },
  {
    "t": [
      "从可用镜像读取",
      "Reading from an Available Mirror"
    ],
    "d": [
      "首选镜像不可用时，客户端可以从包含最新数据的另一镜像读取相同范围。",
      "If the preferred mirror is unavailable, the client can read the same range from another up-to-date mirror."
    ],
    "b": [
      [
        "<p>布局可以标注首选组件，组件是镜像中覆盖一段字节范围的子布局。首选标志提供选择提示。要改走另一条路径，该范围必须有可访问且仍有效的副本。</p>"
      ],
      [
        "<p>A layout can mark preferred components. A component is part of a mirror layout that covers a byte range. The preference is a selection hint. Using another path requires an accessible and valid copy of that range.</p>"
      ]
    ]
  },
  {
    "t": [
      "写入与过期范围",
      "Writes and Stale Ranges"
    ],
    "d": [
      "在延迟同步模式下，写入更新选定镜像，其他镜像中受影响的组件可标为过期。",
      "With delayed synchronization, a write updates one mirror and can mark affected components in other mirrors as stale."
    ],
    "b": [
      [
        "<p>在这种模式下，客户端写入选定镜像，布局把其他镜像中与写入重叠的组件标记为过期。过期意味着组件可能仍保留旧数据，读取当前内容时需要使用有效组件。</p>"
      ],
      [
        "<p>In this mode, the client writes to a selected mirror. The layout marks overlapping components in other mirrors as stale. A stale component can still contain older data, so reads of current contents use valid components.</p>"
      ]
    ]
  },
  {
    "t": [
      "重新同步镜像",
      "Resynchronizing a Mirror"
    ],
    "d": [
      "重新同步使用有效镜像的数据更新过期组件，恢复多个镜像的有效副本。",
      "Resynchronization uses an up-to-date mirror to refresh stale components and restore valid copies."
    ],
    "b": [
      [
        "<p>重新同步按过期组件处理受影响的范围。一份当前数据留在来源镜像，目标镜像补齐后也能提供当前内容。同步期间，该范围的冗余依赖现有有效副本。</p>"
      ],
      [
        "<p>Resynchronization repairs the ranges covered by stale components. The source retains the current data, and the refreshed destination can serve it once synchronization completes. Until then, redundancy for the range depends on the existing valid copies.</p>"
      ]
    ]
  }
]
};
