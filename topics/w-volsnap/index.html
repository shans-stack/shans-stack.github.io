<script>
window.SS_TOPIC_CFG={
  anim: "w-volsnap",
  ar: [848/324, 370/430],
  steps: [
    {
      t: ["卷与底层存储", "Volumes and Their Backing Storage"],
      d: ["Kubernetes 持久卷经 WEKA CSI 对接目录、可写快照或整个文件系统。", "WEKA CSI maps Kubernetes persistent volumes to directories, writable snapshots, or entire filesystems."],
      b: [["\u003cp>持久卷（PV）是 Kubernetes 提供给工作负载的持久存储资源，持久卷声明（PVC）是对该资源的请求。CSI（容器存储接口）把请求交给存储插件处理。WEKA CSI 可以将目录、可写快照或整个 WEKA 文件系统呈现为卷。底层类型也决定了快照的范围。\u003c/p>"], ["\u003cp>A persistent volume (PV) is a Kubernetes storage resource for workloads. A persistent volume claim (PVC) requests that resource. CSI, the Container Storage Interface, passes the request to a storage plugin. WEKA CSI can present a directory, a writable snapshot, or an entire filesystem as a volume. The backing type also determines the scope of a snapshot.\u003c/p>"]]
    },
    {
      t: ["捕获卷的时间点", "Capture a Volume at a Point in Time"],
      d: ["文件系统卷的 VolumeSnapshot 对应只读的 WEKA 文件系统快照。", "A VolumeSnapshot of a filesystem-backed volume maps to a read-only WEKA filesystem snapshot."],
      b: [["\u003cp>VolumeSnapshot 是 Kubernetes 表示卷在某个时间点状态的资源。以整个文件系统为底层时，WEKA CSI 创建该文件系统的只读快照。源卷继续服务，快照保留捕获时的状态。\u003c/p>"], ["\u003cp>A VolumeSnapshot is the Kubernetes resource that represents a volume at a point in time. For a filesystem-backed volume, WEKA CSI creates a read-only snapshot of that filesystem. The source volume continues serving its workload while the snapshot preserves the captured state.\u003c/p>"]]
    },
    {
      t: ["从快照创建可写卷", "Restore into a Writable Volume"],
      d: ["以 VolumeSnapshot 为来源的新 PVC 对应一份新的可写快照。", "A new PVC sourced from the VolumeSnapshot is backed by a new writable snapshot."],
      b: [["\u003cp>从文件系统卷的快照创建新卷时，WEKA CSI 派生一个可写快照作为底层。新卷继承捕获时的数据，可以单独挂载和修改，原来的只读快照仍保留。\u003c/p>"], ["\u003cp>When a new volume is created from a snapshot of a filesystem-backed volume, WEKA CSI derives a writable snapshot as its backing storage. The new volume starts with the captured data and can be mounted and modified separately. The read-only snapshot remains available.\u003c/p>"]]
    },
    {
      t: ["直接克隆源卷", "Clone the Source Volume Directly"],
      d: ["新 PVC 也可以直接引用源 PVC，以克隆时的状态为起点。", "A new PVC can reference the source PVC directly and start with its state at clone time."],
      b: [["\u003cp>在 WEKA 的文件系统卷示例中，直接克隆同样生成以可写快照为底层的新卷。从快照恢复使用先前保存的状态，直接克隆捕获源卷在克隆时的状态。源卷期间若有写入，两条路径得到的新卷内容可以不同。\u003c/p>"], ["\u003cp>In WEKA's filesystem-backed volume example, a direct clone also produces a new volume backed by a writable snapshot. A restore uses the previously saved state. A direct clone captures the source at clone time. Writes to the source in the interval can cause the resulting volumes to differ.\u003c/p>"]]
    },
    {
      t: ["目录卷的快照范围", "Snapshot Scope for Directory-Backed Volumes"],
      d: ["启用目录卷快照后，WEKA 捕获包含该目录的整个文件系统。", "When snapshots are enabled for a directory-backed volume, WEKA captures the entire filesystem that contains it."],
      b: [["\u003cp>多个目录卷可以位于同一个 WEKA 文件系统。目录卷的 CSI 快照默认禁用。启用后，底层快照范围是整个文件系统，所需空间也受同一文件系统中其他目录卷的变更影响。\u003c/p>"], ["\u003cp>Multiple directory-backed volumes can share one WEKA filesystem. CSI snapshots of these volumes are disabled by default. When enabled, the underlying snapshot covers the entire filesystem, so changes in other directory-backed volumes on that filesystem can affect space usage.\u003c/p>"]]
    }
  ]
};
</script>
