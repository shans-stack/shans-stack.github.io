    ],
    [
     "<p>Logical data size counts the original bytes applications read and write. A storage system may represent those bytes in less space. Compression encodes patterns within a piece of data. Deduplication finds identical data within its lookup scope, so several files or versions can reference one stored copy.</p>"
    ]
   ]
  },
  {
   "t": [

   "b": [
    [
     "<p>无损压缩要求解码后的内容逐字节等于输入。一种例子是游程编码，即将连续重复的值与重复次数一起记录。实际压缩格式还可以使用其他编码方式，以适应各种数据分布。</p>"
    ],
    [
     "<p>Lossless compression reproduces the input byte for byte. Run-length encoding, for example, can store a repeated value with its repeat count. Compression formats can also use other encodings for different data distributions.</p>"

   "t": [
    "去重保留共享数据和各自的引用",

    ],
    [
     "<p>Chunking divides file content into regions that can be compared separately. A deduplication system can use a fingerprint, a compact identifier derived from a chunk's contents, to look up existing data. On a match, the new file record can reference the existing chunk. Reads retrieve the chunks in the order recorded for that file.</p>"
    ]
   ]
  },
  {
   "t": [

    "One approach finds duplicates in the original data, then compresses the unique chunks before storing them."

   "b": [

    "Identical chunks across versions can be shared. Distinct data that is already compressed often takes more storage."
   ],
   "b": [
    [
