        "A model service catalog lists services that can be requested or invoked, along with their capabilities and availability."

      "b": [
        [
          "<p>模型服务目录面向需要接入模型的应用。生成对话、处理多模态输入和生成嵌入向量是不同能力。条目记录模型标识、支持的输入输出和可用范围，方便应用团队按任务选择服务。模态指文本、图像等输入或输出的数据形式。</p>"
        ],
        [
          "<p>Model service catalogs serve applications that need to integrate a model. Chat generation, multimodal processing, and embedding generation are distinct capabilities. Entries describe model identifiers, supported inputs and outputs, and availability so application teams can select a service for the task. A modality is a form of input or output data, such as text or images.</p>"
        ]
      ]
    },
    {
      "t": [
        "明确调用约定",
        "Defining the Invocation Contract"
      ],
      "d": [
        "服务条目列出模型标识、支持的 API 和请求方式。",
        "A service entry specifies the model identifier, supported API, and request format."
      ],
      "b": [
        [
          "<p>模型标识在请求中指明要调用的模型。API 是应用向服务发请求的接口。条目可以标明支持的输入格式和流式响应能力。流式响应指服务在生成过程中陆续返回内容。AWS 的 Amazon Bedrock 文档按模型列出可用区域和 API 兼容性，并在调用接口中以模型标识选择目标。</p>"
        ],
        [
          "<p>A model identifier identifies the target model in the request. An API is the interface through which an application sends requests to a service. A catalog entry can specify input formats and support for streaming, which returns content as it is generated. AWS documents model availability by region and API compatibility for Amazon Bedrock. Its invocation API uses a model identifier to select the target.</p>"
        ]
      ]
    },
    {
      "t": [
        "将模型部署为端点",
        "Deploying a Model as an Endpoint"
      ],
      "d": [
        "推理部署加载模型，应用通过端点发送推理请求。",
        "An inference deployment loads the model, and applications send inference requests to an endpoint."
      ],
      "b": [
        [
          "<p>部署为模型配置推理引擎和运行资源。推理引擎负责执行模型计算，端点则是接收调用的网络入口。同一模型可以有多套部署，目录把已开放的服务与可访问的端点对应起来。Rafay 的做法是由运营方定义模型端点，再将其封装成可通过 API 调用的服务。</p>"
        ],
        [
          "<p>A deployment assigns a model an inference engine and runtime resources. The engine executes model computations, and the endpoint is the network entry point that receives calls. A model can have multiple deployments, and the catalog associates published services with reachable endpoints. Rafay’s approach is to define model endpoints and package them as API-accessible services.</p>"
        ]
      ]
    },
    {
      "t": [
        "按调用方控制访问",
        "Controlling Access by Caller"
      ],
      "d": [
        "应用携带调用凭据，平台按权限决定请求能否到达端点。",
        "Applications present credentials, and the platform checks whether the caller may invoke the endpoint."
      ],
      "b": [
        [
          "<p>凭据是用于证明调用方身份的信息，例如 API 密钥或签名请求。共享平台可以按租户和角色授予调用权限，限制哪些团队可以使用某项服务。租户是具有独立访问范围的组织或团队。目录公开的能力说明帮助发现服务，调用时的授权检查负责执行访问策略。</p>"
        ],
        [
          "<p>A credential proves the caller’s identity, for example through an API key or a signed request. A shared platform can grant invocation rights by tenant and role to control which teams may use a service. A tenant is an organization or team with its own access scope. Published catalog metadata supports discovery, and authorization at invocation time enforces access policy.</p>"
        ]
      ]
    },
    {
      "t": [
        "管理模型版本和迁移",
        "Managing Model Versions and Migration"
      ],
      "d": [
        "版本标识明确模型行为所对应的版本，生命周期状态为迁移提供依据。",
        "A version identifier pins the model revision, and lifecycle status informs migration."
      ],
      "b": [
        [
          "<p>平台可同时发布现有版本和新版本。独立标识让应用团队保留现有调用，并在切换前验证新版本的输出和接口兼容性。AWS 的 Amazon Bedrock 在模型清单中返回生命周期状态，供应用团队识别需要迁移的模型。</p>"
        ],
        [
          "<p>A platform can publish both an existing version and a new one. Separate identifiers let application teams keep their existing calls in place while validating the new version’s output and API compatibility. AWS returns lifecycle status in the Amazon Bedrock model list so application teams can identify models that require migration.</p>"
        ]
      ]
    }

document.addEventListener('ss-lang', () => {

][window.SS.lang() === 'en' ? 1 : 0];

    button.textContent = labels[i];

    button.lang = english ? 'en' : ['zh-Hans', 'zh-Hant'][i];
  });
});

<script>
document.addEventListener('ss-lang', ({detail}) => {
  const controls = document.querySelector('.nav .langs');

  const labels = english ? ['ZH-CN', 'ZH-TW', 'EN'] : ['简', '繁', 'EN'];

  controls.querySelectorAll('button').forEach((button, i) => {
    button.textContent = labels[i];
    button.title = names[i];
    button.lang = english ? 'en' : ['zh-Hans', 'zh-Hant', 'en'][i];
    button.setAttribute('aria-label', names[i]);
  });
});
</script>
