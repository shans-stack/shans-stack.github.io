      "t": [
        "上下文缓存来自模型计算",
        "Inference Produces the Context Cache"
      ],
      "d": [
        "KV Cache 保存模型处理过的 Token 的中间结果，后续生成可复用它们。",
        "The KV cache stores intermediate results for tokens the model has processed so later generation can reuse them."
      ],
      "b": [
        [
          "<p>生成式模型先在预填充阶段处理输入 Token（模型处理的文本单位），并保存注意力计算所需的键和值，形成 KV Cache。解码阶段逐步生成后续 Token，并读取这些缓存。上下文越长、并发请求越多，需要保留的缓存通常越多，GPU 的高带宽内存（HBM）也会面临更大的容量压力。</p>"
        ],
        [
          "<p>During prefill, a generative model processes input tokens, the units of text it operates on. It stores attention keys and values as a KV cache. During decoding, the model reads these cached values as it generates further tokens. Longer contexts and more concurrent requests typically increase the amount of cache competing for high-bandwidth memory (HBM) on the GPU.</p>"
        ]
      ]
    },
    {
      "t": [
        "CMX 增加共享的闪存层",
        "CMX Adds a Shared Flash Tier"
      ],
      "d": [
        "CMX 在节点内存与持久共享存储之间提供可由多节点访问的缓存层。",
        "CMX adds a cache tier that multiple nodes can access between node-local memory and durable shared storage."
      ],
      "b": [
        [
          "<p>CMX（Context Memory Storage）在 NVIDIA 的层级划分中是 G3.5，即经以太网连接的共享闪存，位于 GPU 显存、主机内存和本地固态盘组成的本地层与持久共享存储之间。CMX 面向可重建的上下文缓存，日志、模型或需要长期保存的结果仍可保存在持久存储。</p>"
        ],
        [
          "<p>NVIDIA calls its CMX Context Memory Storage tier G3.5. It uses Ethernet-attached shared flash between the node-local tiers, which include GPU and host memory and local SSDs, and durable shared storage. CMX is intended for context cache that can be reconstructed. Logs, models, and results with long retention requirements can remain on durable storage.</p>"
        ]
      ]
    },
    {
      "t": [
        "BlueField-4 处理缓存 I/O",
        "BlueField-4 Handles Cache I/O"
      ],
      "d": [
        "BlueField-4 管理 CMX 存储端的数据读写，计算节点经 Spectrum-X 以太网访问共享缓存。",
        "BlueField-4 manages I/O on the CMX storage side, while compute nodes access shared cache over Spectrum-X Ethernet."
      ],
      "b": [
        [
          "<p>CMX 使用 BlueField-4 存储处理器管理闪存，并可在数据路径中卸载加密和完整性检查。DOCA Memos 提供管理与共享缓存的键值接口。Spectrum-X 网络承载远程直接内存访问（RDMA）流量，将计算节点接到 CMX 存储节点。</p>"
        ],
        [
          "<p>CMX uses BlueField-4 storage processors to manage flash and can offload encryption and integrity checking along the data path. DOCA Memos provides key-value interfaces for managing and sharing cache. Spectrum-X carries remote direct memory access (RDMA) traffic between compute nodes and CMX storage nodes.</p>"
        ]
      ]
    },
    {
      "t": [
        "在解码前把缓存调回内存",
        "Loading Cache Back Into Memory Before Decode"
      ],
      "d": [
        "推理框架可在解码前把匹配的缓存块从 CMX 调入主机内存或 GPU 显存。",
        "Before decoding, an inference framework can load matching cache blocks from CMX into host or GPU memory."
      ],
      "b": [
        [
          "<p>以 NVIDIA Dynamo 的公开架构为例，缓存管理器跟踪 KV 块，NIXL（NVIDIA 推理传输库）协助在不同层级间搬运这些块。将匹配的块预先调入目标节点后，解码可以在计算节点读取它们。如果需要的块不可用，模型仍需计算相应上下文。</p>"
        ],
        [
          "<p>In NVIDIA’s published Dynamo architecture, cache managers track KV blocks and NIXL, the NVIDIA Inference Transfer Library, helps move them between tiers. Loading matching blocks ahead of time lets decoding read them from the compute node. If a required block is unavailable, the model still has to compute the corresponding context.</p>"
        ]
      ]
    },
    {
      "t": [
        "STX 定义架构，CMX 承担缓存层",
        "STX Defines the Architecture and CMX Provides the Cache Tier"
      ],
      "d": [
        "CMX 是 STX 的一项实现，针对共享缓存保留与复用，持久数据仍有自己的存储路径。",
        "CMX implements STX for shared cache retention and reuse. Durable data follows its own storage path."
      ],
      "b": [
        [
          "<p>STX 定义存储处理器、网络和软件的组合方式。CMX 以此构建推理上下文存储，把匹配的缓存返回给不同计算节点。缓存可以被淘汰并重新计算，需要长期保留的原始数据和结果应由具备相应持久性要求的存储层保存。</p>"
        ],
        [
          "<p>STX defines how storage processors, networking, and software fit together. CMX uses that design to return matching context cache to different compute nodes. Cache entries can be evicted and recomputed. Source data and results that must be retained belong on a storage tier with the required durability.</p>"
        ]
      ]
