    ],
    [
     "<p>The S3 (Simple Storage Service) API organizes data into buckets and objects. An endpoint is the service address a client connects to. WEKA configures servers running the S3 protocol as a logical S3 service. The service accepts object requests and uses the WEKA filesystem as its backing store.</p>"
    ]
   ]
  },
  {
   "t": [
    "将存储桶映射到目录",
    "Mapping a Bucket to a Directory"
   ],
   "d": [
    "存储桶可由新目录承载，也可以绑定已有目录。",
    "A bucket can use a newly created directory or expose an existing directory."
   ],
   "b": [
    [
     "<p>存储桶是对象的命名容器。WEKA 的 S3 管理接口允许将文件系统中的现有路径提供为存储桶，也可在创建存储桶时由系统新建目录。S3 客户端用存储桶名访问目标目录所提供的对象。</p>"
    ],
    [
     "<p>A bucket is a named container for objects. WEKA S3 administration can expose a pre-existing filesystem path as a bucket or create a directory when the bucket is provisioned. S3 clients use the bucket name to access the objects exposed through that directory.</p>"
    ]
   ]
  },
  {
   "t": [
    "对象键对应文件",
    "Object Keys Map to Files"

   "d": [
    "S3 服务将对象写入文件系统，并按对象键读取对应文件的数据。",

   "b": [

    ],
    [
     "<p>An object key identifies an object within a bucket. The WEKA S3 service accepts object contents through PUT and returns them through GET. For example, a bucket object with the key <code>run.json</code> can correspond to a file named <code>run.json</code> in its backing directory.</p>"
    ]
   ]

    ],
    [
     "<p>An application can authenticate S3 requests using access credentials. WEKA Identity and Access Management (IAM) policies control which operations an S3 user can perform on particular buckets or objects. When HTTPS is used, Transport Layer Security (TLS) protects the connection.</p>"

    [
     "<p>POSIX, NFS, or SMB access can reach the files backing a bucket. Both views share the same data, so operations can affect what is visible through the other view. For example, when an object expiration rule deletes an object, the backing file is deleted too.</p>"
