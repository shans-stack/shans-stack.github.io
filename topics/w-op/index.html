 "steps": [
  {
   "t": [
    "声明集群的目标状态",
    "Declare the Desired Cluster State"
   ],
   "d": [
    "Kubernetes 自定义资源记录目标配置，WEKA Operator 持续对照实际状态。",
    "Kubernetes custom resources describe the desired configuration, and the WEKA Operator checks it against the running state."
   ],
   "b": [
    [
     "<p>自定义资源定义（CRD）把 WEKA 的资源类型加入 Kubernetes API。提交这一类型的资源实例，即自定义资源（CR），就可以声明要运行的存储组件及其配置。</p>",
     "<p>Operator 是持续运行的 Kubernetes 控制器。它按目标配置创建和管理组件。反复检查并处理状态差异的过程称为调谐（reconciliation）。</p>"
    ],
    [
     "<p>A custom resource definition (CRD) adds a WEKA resource type to the Kubernetes API. An instance of that type, called a custom resource (CR), declares the storage components and their intended configuration.</p>",
     "<p>The Operator is a Kubernetes controller that runs continuously. It creates and manages components according to the desired configuration. The ongoing process of checking and acting on differences is called reconciliation.</p>"
    ]
   ]
  },
  {
   "t": [
    "用 WekaCluster 描述后端",
    "Define the Backend with WekaCluster"
   ],
   "d": [
    "WekaCluster 描述后端资源，Operator 按配置在指定节点部署计算和驱动器组件。",
    "WekaCluster defines the backend, and the Operator deploys compute and drive components on the designated nodes."
   ],
   "b": [
    [
     "<p>WekaCluster 指定后端的资源需求及部署范围。计算组件负责存储处理和集群逻辑，驱动器组件管理分配给 WEKA 的盘。协议组件只在配置相应服务后创建。</p>",
     "<p>Operator 为每个组件创建 WekaContainer，再据此创建运行 WEKA 进程的 Pod。Pod 是 Kubernetes 调度和运行容器的基本单位。</p>"
    ],
    [
     "<p>WekaCluster specifies the backend's resource requirements and placement. Compute components handle storage operations and cluster logic, while drive components manage the drives assigned to WEKA. Protocol components are created when their services are configured.</p>",
     "<p>The Operator creates a WekaContainer for each component, then creates the Pod that runs the WEKA process. A Pod is the basic unit Kubernetes schedules to run containers.</p>"
    ]
   ]
  },
  {
   "t": [
    "用 WekaClient 连接应用节点",
    "Connect Application Nodes with WekaClient"
   ],
   "d": [
    "Operator 根据 WekaClient 在指定节点部署客户端。客户端可连接 Kubernetes 集群内外的 WEKA 后端。",
    "The Operator deploys clients on nodes selected by WekaClient. The clients reach a WEKA backend inside or outside Kubernetes."
   ],
   "b": [
    [
     "<p>WekaClient 自定义资源可通过节点选择器声明部署范围。Operator 在每个匹配节点部署一个客户端 Pod，由该 Pod 建立到后端的数据连接。</p>",
     "<p>完整部署由 Kubernetes 管理后端和客户端。仅客户端部署则保留外部的 WEKA 后端，由 Kubernetes 管理应用侧的客户端。</p>"
    ],
    [
     "<p>The WekaClient custom resource can specify a node selector. The Operator deploys one client Pod on each matching node. That Pod establishes the data connection to the backend.</p>",
     "<p>In a full deployment, Kubernetes manages both backend and client components. In a client-only deployment, the WEKA backend stays outside Kubernetes, which manages the clients on the application side.</p>"
    ]
   ]
  },
  {
   "t": [
    "把持久卷交给应用",
    "Provide Persistent Volumes to Applications"
   ],
   "d": [
    "WEKA CSI 插件处理持久卷请求，节点上的 WEKA 客户端提供文件系统访问。",
    "The WEKA CSI plugin handles persistent volume requests, and the node-local WEKA client provides filesystem access."
   ],
   "b": [
    [
     "<p>容器存储接口（CSI）是 Kubernetes 与存储驱动之间的接口。应用通过持久卷声明申请存储，CSI 插件按 StorageClass 定义的规则配发或挂载存储。StorageClass 描述可用的存储类型和配发方式。</p>",
     "<p>Operator 可以随 WekaClient 管理 CSI 插件的生命周期。卷挂载后，应用的文件 I/O 由节点上的 WEKA 客户端发往后端。</p>"
    ],
    [
     "<p>The Container Storage Interface (CSI) is the interface between Kubernetes and a storage driver. An application requests storage through a PersistentVolumeClaim. The CSI plugin provisions or mounts storage according to the StorageClass, which describes the storage type and provisioning policy.</p>",
     "<p>The Operator can manage the CSI plugin as part of WekaClient. Once the volume is mounted, application file I/O reaches the backend through the WEKA client on the node.</p>"
    ]
   ]
  },
  {
   "t": [
    "观察运行状态与组件恢复",
    "Observe Health and Component Recovery"
   ],
   "d": [
    "WekaCluster 汇总后端状态。符合替换条件时，Operator 依据仍存在的资源重建 Pod。",
    "WekaCluster summarizes backend status, and the Operator can replace a Pod from a resource that still exists."
   ],
   "b": [
    [
     "<p>集群级状态和单个 WekaContainer 的状态反映不同层级。所需后端组件进入 Running 后，集群才进入 Ready，表示已可提供 I/O。</p>",
     "<p>Pod 结束且相应 WekaContainer 仍存在时，Operator 可以创建替换 Pod。资源的持久身份与 Pod 的运行状态分开管理，具有节点绑定的组件保留原有节点约束。</p>"
    ],
    [
     "<p>Cluster status and individual WekaContainer status describe different layers. The cluster reaches Ready after its required backend components reach Running, indicating that it can serve I/O.</p>",
     "<p>When a Pod terminates and the corresponding WekaContainer still exists, the Operator can create a replacement Pod. The persistent identity is managed separately from the Pod's running state, and node-bound components retain their placement constraints.</p>"
    ]
   ]
  }
 ]
