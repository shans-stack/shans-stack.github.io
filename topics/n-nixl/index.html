<script>
window.SS_TOPIC_CFG={
  "anim": "n-nixl",
  "ar": [
    2.7439024390243905,
    0.8181818181818182
  ],
  "steps": [
    {
      "t": [
        "Prefill 与 Decode 的交接",
        "The Prefill-to-Decode Handoff"
      ],
      "d": [
        "在分离式推理中，NIXL 可将 Prefill 生成的 KV Cache 传到 Decode 实例。",
        "In disaggregated inference, NIXL can transfer the KV cache from prefill to a decode instance."
      ],
      "b": [
        [
          "\u003cp>Prefill 处理提示词并生成 KV Cache，即注意力层后续生成 token 时复用的键和值。两个阶段部署在不同实例时，推理框架安排交接，NIXL 承担点对点数据传输。\u003c/p>"
        ],
        [
          "\u003cp>Prefill processes the prompt and produces the KV cache, the attention keys and values reused when generating subsequent tokens. When the stages run in separate instances, the inference framework coordinates the handoff and NIXL handles point-to-point data transfer.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "注册可传输的缓冲区",
        "Registering Transferable Buffers"
      ],
      "d": [
        "运行时为两端创建代理，并将用于传输的缓冲区登记到相应后端。",
        "The runtime creates an agent at each endpoint and registers transfer buffers with the relevant backend."
      ],
      "b": [
        [
          "\u003cp>代理是 NIXL 管理缓冲区和传输请求的对象。后端是执行实际传输的插件，可支持不同的内存或存储类型。应用分配传输缓冲区后，可提前注册并在后续请求中重复使用。\u003c/p>"
        ],
        [
          "\u003cp>An agent is the NIXL object that manages buffers and transfer requests. A backend is a plug-in that performs the transfer and supports particular memory or storage types. After allocating buffers, the application can register them in advance and reuse them across requests.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "交换端点元数据",
        "Exchanging Endpoint Metadata"
      ],
      "d": [
        "两端通过控制路径交换并缓存元数据，以便识别远端代理和已注册区域。",
        "The endpoints exchange and cache metadata over a control path to identify peer agents and registered regions."
      ],
      "b": [
        [
          "\u003cp>代理元数据包含与后端相关的连接或注册信息。推理运行时可在数据传输之前加载对端元数据，并在后续请求中复用。实际读写的远端缓冲区描述符还需由应用交给发起端。\u003c/p>"
        ],
        [
          "\u003cp>Agent metadata carries backend-specific connection or registration information. The inference runtime can load peer metadata before data transfer and reuse it for later requests. The application also provides the initiator with descriptors for the specific remote buffers involved.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "在已注册区域间传输",
        "Transferring Between Registered Regions"
      ],
      "d": [
        "发起端提交读或写请求，兼容的后端在本端和远端已注册区域之间传输数据。",
        "The initiator posts a read or write, and a compatible backend transfers data between registered local and remote regions."
      ],
      "b": [
        [
          "\u003cp>传输请求关联本端与远端缓冲区描述符。以 Decode 发起的读请求为例，数据路径从 Prefill 的 GPU 缓冲区指向 Decode 的 GPU 缓冲区。具体路径取决于后端和部署；NIXL 也可通过适配的后端访问其他内存或存储端点。\u003c/p>"
        ],
        [
          "\u003cp>A transfer request pairs local and remote buffer descriptors. In a read initiated by decode, the data path runs from the prefill GPU buffer to the decode GPU buffer. The actual path depends on the backend and deployment. Other memory or storage endpoints are available through compatible backends.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "检查完成后消费",
        "Consuming Data After Completion"
      ],
      "d": [
        "请求提交后，运行时检查完成状态；Decode 在数据就绪后继续生成。",
        "After posting the request, the runtime checks completion before decode consumes the data and continues generation."
      ],
      "b": [
        [
          "\u003cp>提交请求与传输完成是两个状态。发起端可查询完成状态；支持通知的后端还可向对端发送完成通知。推理运行时据此衔接后续计算，避免在目标缓冲区写完前读取 KV Cache。\u003c/p>"
        ],
        [
          "\u003cp>Posting and completion are separate states. The initiator can query status, and backends that support notifications can also signal the peer. The inference runtime coordinates subsequent work so the destination cache is read after the transfer completes.\u003c/p>"
        ]
      ]
    }
  ]
};
</script>
