<script>
window.SS_TOPIC_CFG={
 "anim": "b-clickbench",
 "ar": [
  2.318840579710145,
  0.9230769230769231
 ],
 "steps": [
  {
   "t": [
    "访问日志上的 43 个查询",
    "43 Queries over Web Analytics Logs"
   ],
   "d": [
    "ClickBench 在一张网站访问日志宽表上运行扫描、筛选和聚合查询。",
    "ClickBench runs scans, filters, and aggregations on one wide web analytics table."
   ],
   "b": [
    [
     "<p>宽表把许多字段放在同一张表里。ClickBench 的输入来自生产环境访问日志，固定数据集约有一亿行，标准查询集有 43 条。查询设计覆盖顺序扫描、带筛选条件的扫描及关系运算。由于输入是一张表，测试范围以单表分析为主。</p>",
     "<p>截至 2026-11-23，项目采用持续更新的公开方法和结果，未设编号发布轮次。官方变更日志的最新记录日期为 2026-11-18，更新了报告的存储类型筛选。</p>"
    ],
    [
     "<p>A wide table puts many fields in one table. ClickBench uses a fixed dataset of about 100 million rows derived from production web analytics logs and a set of 43 queries. The queries cover scans, filtered scans, and relational operations, primarily within that one table.</p>",
     "<p>As of November 23, 2026, the project continuously publishes its methodology and results with no numbered rounds. The latest official changelog entry is dated November 18, 2026 and updates the report’s storage-type selector.</p>"
    ]
   ]
  },
  {
   "t": [
    "装载、配置和计时",
    "Load, Configuration, and Timing"
   ],
   "d": [
    "装载和查询分开计量，测试同时记录最终数据大小与部署条件。",
    "Loading and querying are measured separately, alongside stored data size and deployment details."
   ],
   "b": [
    [
     "<p>测试按系统的建表与装载脚本准备数据，再执行等价查询。数据布局、存储类型、是否额外调优以及机器配置会改变测量条件。报告分别展示装载时间和数据大小，有些直接查询外部数据的引擎可以省略装载。</p>",
     "<p>查询计时覆盖端到端的请求执行与结果取回。有预处理或后处理时，相应耗时属于该查询的完整路径。</p>"
    ],
    [
     "<p>The system’s scripts create and load the table, then execute equivalent queries. Data layout, storage type, additional tuning, and machine configuration shape the test conditions. The report separates load time and stored data size. Some engines that query external data can skip loading.</p>",
     "<p>End-to-end query timing includes execution and fetching the result. Where there is query pre- or post-processing, it belongs to the same execution path.</p>"
    ]
   ]
  },
  {
   "t": [
    "冷跑与热跑",
    "Cold and Hot Runs"
   ],
   "d": [
    "每条查询运行三次，首轮用于冷跑，后两轮用于热跑。",
    "Each query runs three times. The first is the cold run, and the next two are hot runs."
   ],
   "b": [
    [
     "<p>严格冷跑在每条查询首次执行前清除操作系统页缓存和数据库缓存。页缓存是操作系统在内存中保留的文件数据。历史上也有只清页缓存的较弱冷态口径，报告会将这类提交标记为 no-cold。</p>",
     "<p>查询结果缓存按规则禁用。热跑可受益于缓存的源数据。后两次都成功时，热跑汇总使用其中较短的用时。</p>"
    ],
    [
     "<p>A true cold run clears the operating system page cache and database caches before the first execution of each query. The page cache holds file data in memory. The older method of clearing only the page cache represents a less strict state and carries the no-cold tag.</p>",
     "<p>Query result caches are disabled under the rules. Hot runs can benefit from cached source data. If both hot runs succeed, the shorter runtime represents the query in the hot summary.</p>"
    ]
   ]
  },
  {
   "t": [
    "查询用时如何汇总",
    "How Query Times Are Aggregated"
   ],
   "d": [
    "冷跑和热跑分别计算逐查询相对用时，再用几何平均汇总。",
    "Cold and hot summaries each take the geometric mean of per-query relative times."
   ],
   "b": [
    [
     "<p>每条查询以适用比较集合内该查询的最快用时为基准。被比较条目的用时除以基准，得到该条查询的相对用时。几何平均是把这些比值相乘再取相应次数的方根，避免直接把耗时差异很大的查询时长相加。</p>",
     "<p>失败或缺失的计时在汇总时按项目规则代入惩罚值。相对汇总分会随查询选择、基准集合和缓存条件而变化。</p>"
    ],
    [
     "<p>Each query uses the fastest result for that query in the applicable comparison set as its baseline. Dividing the observed runtime by that baseline gives a relative time. The geometric mean multiplies the ratios and takes the root for the number of ratios, avoiding a sum of runtimes across very different queries.</p>",
     "<p>Failed or missing timings are subject to the project’s penalty rules. The relative summary can change with query selection, the reference set, and cache conditions.</p>"
    ]
   ]
  },
  {
   "t": [
    "分项指标和适用范围",
    "Individual Metrics and Scope"
   ],
   "d": [
    "查询用时、装载时间和存储大小反映不同特征，比较依赖一致的测试条件。",
    "Runtime, load time, and stored size describe different properties and depend on comparable test conditions."
   ],
   "b": [
    [
     "<p>Combined 是按项目规定的权重组合冷跑、热跑、装载时间及数据大小的相对分数。解读时还需核对硬件、缓存模式、数据位置、调优标识和未完成查询。标准查询时长主要反映逐条运行的分析路径，单表结果无法覆盖多表数据仓库或生产环境的混合负载。</p>"
    ],
    [
     "<p>Combined uses the project’s weights to combine relative cold time, hot time, load time, and data size. Hardware, cache mode, storage location, tuning status, and incomplete queries provide context. The standard query timings mainly describe one-at-a-time analytics, with scope limited to a single-table workload.</p>"
    ]
   ]
  }
 ]
};
</script>
