<script>
window.SS_TOPIC_CFG={
 "anim": "f-route",
 "ar": [
  2.410958904109589,
  1.029940119760479
 ],
 "steps": [
  {
   "t": [
    "从模型池选一个副本",
    "Replica Selection Within a Model Pool"
   ],
   "d": [
    "模型后端确定后，路由器为当前请求选择池内可用的副本。",
    "Once a model backend is chosen, the router selects an eligible replica for the request."
   ],
   "b": [
    [
     "<p>副本是一个已加载同一模型、可以独立接收请求的服务实例。网关先确定服务目标，再由实例路由逻辑从这个模型池中选择具备资格的副本。就绪状态用于判断实例能否接收请求，队列和缓存则用于在候选实例之间取舍。</p>"
    ],
    [
     "<p>A replica is a serving instance that has loaded the same model and can accept requests independently. The gateway first selects the service target, and the instance router then chooses an eligible replica from that model pool. Readiness establishes whether an instance can receive traffic. Queue and cache signals inform the choice among eligible replicas.</p>"
    ]
   ]
  },
  {
   "t": [
    "用队列和容量决定分流",
    "Queue and Capacity Signals"
   ],
   "d": [
    "轮询按顺序分配请求，负载感知路由用当前排队和容量信号调整选择。",
    "Round robin rotates through replicas, while load-aware routing adapts to current queue and capacity signals."
   ],
   "b": [
    [
     "<p>轮询依次在副本间分配请求。推理请求的输入和输出长度各异，请求数相近的两个副本仍可能承担不同份量的工作。队列深度反映等待的请求数量，正在运行的请求和 用于保留已处理输入状态的 KV Cache 占用则能补充实例当前负载与剩余空间的信息。</p>"
    ],
    [
     "<p>Round robin assigns requests to replicas in turn. Inference requests vary in input and output length, so two replicas handling similar numbers of requests may face different amounts of work. Queue depth counts pending requests. Running requests and occupancy of the KV cache, which retains state for inputs already processed, add information about current load and available space.</p>"
    ]
   ]
  },
  {
   "t": [
    "查找可复用的前缀",
    "Reusable Prefix Lookup"
   ],
   "d": [
    "若副本已有匹配的输入前缀，模型可以复用已有的 KV Cache，减少重复计算。",
    "When a replica already has a matching input prefix, it can reuse KV cache to reduce repeated computation."
   ],
   "b": [
    [
     "<p>KV Cache 保存模型注意力层对已处理 Token 的键和值。前缀是从输入开头连续匹配的 Token 序列，例如多轮对话重带的历史。路由器可根据缓存索引判断哪个候选副本保有匹配块。命中时，该副本可复用这些块，只对尚未缓存的输入执行 Prefill，也就是生成开始前处理输入的阶段。</p>"
    ],
    [
     "<p>The KV cache stores attention keys and values for tokens the model has processed. A prefix is a contiguous sequence of matching tokens from the start of the input, such as history carried forward in a conversation. A cache index can show the router which candidates hold matching blocks. The chosen replica can reuse those blocks and run prefill, the processing of input before generation, on the uncached portion.</p>"
    ]
   ]
  },
  {
   "t": [
    "权衡命中与等待",
    "Cache Reuse and Queueing Trade-Offs"
   ],
   "d": [
    "已命中的副本仍可能排队，路由策略要权衡省下的计算与当前等待。",
    "A replica with a cache hit may still have a queue, so the routing policy weighs saved work against current wait."
   ],
   "b": [
    [
     "<p>前缀命中越多，副本要重新处理的输入通常越少。但如果该副本已经积压请求或剩余容量很少，策略可把新请求发给较空闲的副本，由它处理未缓存的输入。实例路由要估算的是一次请求在当前状态下的总处理代价，缓存命中和可用容量都参与选择。</p>"
    ],
    [
     "<p>More prefix matches generally mean less input to process again. If that replica has a long queue or little remaining capacity, the policy may send the new request to a less loaded replica, where the uncached input is processed. The selection accounts for the total cost of serving the request under current conditions, including cache reuse and available capacity.</p>"
    ]
   ]
  },
  {
   "t": [
    "从缓存事件维护路由索引",
    "Routing Indexes from Cache Events"
   ],
   "d": [
    "路由器可订阅引擎的缓存变化，更新副本各自持有哪些前缀块。",
    "A router can subscribe to cache changes to track which prefix blocks each replica holds."
   ],
   "b": [
    [
     "<p>NVIDIA Dynamo 的 KV-aware 路由可跟踪缓存块的创建与移除，并按匹配块预计能减少的 Prefill 工作和实例的活跃负载选择 worker。worker 是执行模型推理的服务进程。</p>",
     "<p>开源项目 llm-d 的精确前缀路由用模型服务器发布的事件建立缓存块到副本的索引，再把连续匹配前缀的评分和负载评分一起纳入端点选择。</p>"
    ],
    [
     "<p>NVIDIA Dynamo&#x27;s KV-aware routing can track block creation and removal. It selects workers using the prefill work that matching blocks are expected to save and the workers&#x27; active load. A worker is a serving process that executes inference.</p>",
     "<p>The open-source llm-d project&#x27;s precise prefix routing builds a block-to-replica index from model server events. It combines a score for the contiguous matching prefix with load scores when selecting an endpoint.</p>"
    ]
   ]
  },
  {
   "t": [
    "扩缩容更新可选副本",
    "Autoscaling Changes the Replica Pool"
   ],
   "d": [
    "路由器分配当前请求，扩缩容则改变后续请求能使用的副本集合。",
    "The router assigns the current request, while autoscaling changes which replicas future requests can use."
   ],
   "b": [
    [
     "<p>持续积压时，扩缩容控制器可用队列深度或运行中请求数等信号增加副本。新实例加载模型并进入就绪状态后，路由器才把它纳入候选；减少副本则缩小候选集合。路由逐请求发生，扩缩容通过调整副本数改变服务容量。</p>"
    ],
    [
     "<p>When a backlog persists, an autoscaling controller can add replicas using signals such as queue depth or the number of running requests. A new instance enters the candidate set only after loading the model and becoming ready. Removing replicas shrinks that set. Routing happens per request, while autoscaling changes serving capacity by adjusting the replica count.</p>"
    ]
   ]
  }
 ]
};
</script>
