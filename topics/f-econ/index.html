<script>
window.SS_TOPIC_CFG={
  "anim": "f-econ",
  "ar": [880/302, 350/462],
  "steps": [
    {
      "t": [
        "定义输出 Token 吞吐",
        "Defining Output Token Throughput"
      ],
      "d": [
        "输出吞吐等于测量窗口内完成的请求所返回的输出 Token 总量除以窗口时长。",
        "Output throughput is the number of output tokens returned by requests completed in the measurement window, divided by its duration."
      ],
      "b": [
        [
          "<p>Token 是模型处理文字时使用的离散单位。输出吞吐以每秒输出 Token 表示。输入 Token、输出 Token 和请求数是不同计量口径。测试同时记录输入和输出长度、并发量或请求到达速率，因为这些条件决定同一个吞吐值所对应的负载。这里采用 NVIDIA AIPerf 文档中按基准测试时长计算输出吞吐的口径。</p>"
        ],
        [
          "<p>A token is a discrete unit a model uses to process text. Output throughput is expressed in output tokens per second. Input tokens, output tokens, and requests are separate measurement units. A benchmark records input and output lengths and either concurrency or request arrival rate, because those settings define the workload behind a throughput value. The definition here follows NVIDIA AIPerf’s benchmark-duration convention.</p>"
        ]
      ]
    },
    {
      "t": [
        "同时测量吞吐和响应",
        "Measuring Throughput and Responsiveness Together"
      ],
      "d": [
        "并发批处理可以提高总输出量，负载过高时排队会延长首 Token 等待。",
        "Batching concurrent requests can increase aggregate output, while queueing under heavy load can delay the first token."
      ],
      "b": [
        [
          "<p>并发指多个请求同时在途，批处理指一次调度处理多个请求。预填充处理输入并建立注意力缓存，解码逐步生成输出。输入输出长度、模型、推理引擎和部署资源都会改变可达吞吐。负载上升时，整套服务的吞吐与单请求的体验可能朝不同方向变化。</p>"
        ],
        [
          "<p>Concurrency means multiple requests are in flight, and batching schedules more than one request together. Prefill processes the input and initializes the attention cache, and decode generates the output incrementally. Sequence lengths, the model, the inference engine, and deployment resources all affect attainable throughput. As load rises, aggregate throughput and individual responsiveness can move in different directions.</p>"
        ]
      ]
    },
    {
      "t": [
        "按服务目标筛出合格输出",
        "Counting Output That Meets Service Targets"
      ],
      "d": [
        "先按服务目标筛选成功请求，再汇总这些请求的输出 Token。",
        "Filter successful requests against service targets before summing their output tokens."
      ],
      "b": [
        [
          "<p>首 Token 延迟（TTFT）是从发出请求到收到首个输出 Token 的时间。Token 间延迟（ITL）描述输出期间相邻 Token 的时间间隔。服务水平目标（SLO）可对这两项设置阈值。NVIDIA AIPerf 将达到全部阈值的请求数除以测量时长，得到合格请求吞吐。单位成本也可采用类似筛选，把合格请求的输出 Token 加总作为分母。</p>"
        ],
        [
          "<p>Time to first token (TTFT) runs from sending a request to receiving its first output token. Inter-token latency (ITL) describes the gap between adjacent tokens during generation. A service level objective (SLO) can set a threshold for each. NVIDIA AIPerf divides the count of requests meeting all thresholds by the measurement duration to get goodput in requests per second. A unit-cost calculation can use a similar filter and sum the output tokens from qualifying requests as its denominator.</p>"
        ]
      ]
    },
    {
      "t": [
        "汇总同一窗口的运行成本",
        "Summing Operating Costs over the Same Window"
      ],
      "d": [
        "成本按同一测量范围归集，并计入窗口内的待机容量。",
        "Sum the costs for the same measurement scope, including capacity held idle during the window."
      ],
      "b": [
        [
          "<p>自营环境可以把服务器折旧、托管和软件费用分摊到观测窗口。租用环境可以从已分配实例的使用时长计算资源成本，并按口径计入相关运行费用。运维、网络或存储费用是否纳入，取决于既定的成本范围；跨部署比较时范围和时间口径需一致。</p>"
        ],
        [
          "<p>A self-operated deployment can allocate server depreciation, hosting, and software expenses to the observation window. A rented deployment can calculate resource cost from the time instances were allocated and include applicable operating expenses. Operations, network, and storage expenses follow the chosen cost scope. Comparable deployments use a consistent scope and time basis.</p>"
        ]
      ]
    },
    {
      "t": [
        "计算每百万合格输出 Token 的成本",
        "Calculating Cost per Million Qualifying Output Tokens"
      ],
      "d": [
        "窗口总成本除以窗口内的合格输出 Token 数，再乘以一百万。",
        "Divide total cost by qualifying output tokens in the same window and multiply by one million."
      ],
      "b": [
        [
          "<p>分子包括服务处理输入和保有容量的成本，分母采用符合服务目标的输出 Token。当合格输出量为零时，这个单位成本无定义。这个口径适用于比较相同模型、负载和目标下的部署效率。商业账单可以按输入、输出与缓存类别分别定费率，属于服务收费口径。</p>"
        ],
        [
          "<p>The numerator includes the cost of processing inputs and holding capacity. The denominator is the output tokens from requests meeting service targets. Unit cost is undefined when there is no qualifying output. This measure can compare deployments under the same model, workload, and targets. Commercial billing follows service rates, which can be specified separately for input, output, and cache categories.</p>"
        ]
      ]
    }
  ]
};

</script>
