<script>
window.SS_TOPIC_CFG={
 "anim": "rail",
 "ar": [
  2.021276595744681,
  0.6792452830188679
 ],
 "steps": [
  {
   "t": [
    "GPU 与网卡的亲和关系",
    "GPU-to-NIC Affinity"
   ],
   "d": [
    "每台节点按本地 PCIe 拓扑，把一组 GPU 与合适的网卡端口对应起来。",
    "Each node maps GPUs to suitable NIC ports based on its local PCIe topology."
   ],
   "b": [
    [
     "<p>轨道优化从节点内开始。这里的亲和性指 GPU 到网卡之间的拓扑邻近关系，例如经同一组 PCIe 交换路径连接。轨道编号用来标识跨节点相对应的一组端口。编号本身只是布线和通信软件约定的标识。</p>"
    ],
    [
     "<p>Rail optimization begins inside the node. Affinity describes how closely a GPU and a NIC are connected in the local topology, for example through the same PCIe switching path. A rail index identifies a set of corresponding ports across nodes. It is an identifier used by cabling plans and communication software.</p>"
    ]
   ]
  },
  {
   "t": [
    "对应端口接入同轨 Leaf",
    "Matching Ports Share a Rail Leaf"
   ],
   "d": [
    "不同节点上对应轨道的端口接到同一台 Leaf，规模扩大时可接到同一组 Leaf。",
    "Corresponding ports on different nodes attach to one leaf per rail, or to a group of leaves at larger scale."
   ],
   "b": [
    [
     "<p>Leaf 是直接连接服务器的接入交换机。轨道优化为各轨道预先分配 Leaf 下联端口。只要两个同轨端口在同一台 Leaf 上，它们的流量就可以由这台交换机转发。OCP 的训练网络参考架构也允许一个轨道使用一组 Leaf。</p>"
    ],
    [
     "<p>A leaf is an access switch that directly connects to servers. Rail optimization assigns leaf downlinks to specific rails. If two ports on the same rail share one leaf, that switch alone can forward their traffic. The OCP training fabric reference architecture also allows a rail to span a group of leaves.</p>"
    ]
   ]
  },
  {
   "t": [
    "同轨与跨轨转发",
    "Same-Rail and Cross-Rail Forwarding"
   ],
   "d": [
    "同一 Leaf 内的流量走接入交换机，跨 Leaf 流量仍可借助上层 Spine。",
    "Traffic within a leaf stays on that switch. Traffic between leaves can use a spine."
   ],
   "b": [
    [
     "<p>Spine 是在接入层之上互连 Leaf 的交换机。在轨道优化的两层 Clos 网络中，同轨且同 Leaf 的流量可以留在接入层。若目的端口在另一台 Leaf，例如同轨跨接入组或图中的跨轨通信，路径可经上层 Spine。</p>"
    ],
    [
     "<p>A spine is a switch that interconnects leaves above the access layer. In a rail-optimized two-tier Clos network, traffic on the same rail and leaf can stay at the access layer. When the destination port sits on another leaf, such as across leaf groups within a rail or across rails as shown, the path can use a spine.</p>"
    ]
   ]
  },
  {
   "t": [
    "集合通信如何利用轨道",
    "How Collectives Use Rails"
   ],
   "d": [
    "通信库可让同一个通信环或树优先使用各节点上相对应的网卡。",
    "A communication library can prefer the corresponding NICs across nodes for a given ring or tree."
   ],
   "b": [
    [
     "<p>集合通信指一组进程共同完成的数据交换或归约。物理布线提供了局部路径，通信库选用对应端口时才能利用它。以开源 NCCL 为例，跨网卡策略可以让一个环或树优先使用相同轨道，具体行为还取决于参与通信的 GPU 与拓扑。</p>"
    ],
    [
     "<p>A collective is an exchange or reduction carried out by a group of processes. Cabling makes a local path available, and the library uses that locality by choosing corresponding ports. In open-source NCCL, the cross-NIC policy can favor keeping a ring or tree on the same rail. Actual behavior also depends on participating GPUs and topology.</p>"
    ]
   ]
  },
  {
   "t": [
    "轨道扩展到多个接入组",
    "Extending a Rail Across Leaf Groups"
   ],
   "d": [
    "同一轨道分布到多台 Leaf 后，同轨流量也可能使用上联。",
    "When a rail spans multiple leaves, some same-rail traffic uses uplinks."
   ],
   "b": [
    [
     "<p>同轨描述的是端口分组。同 Leaf 描述的是交换机位置。图中两个端口仍属于轨道 A，但进入不同的接入交换机，流量因此经 Spine 转发。上联需要承载多少流量，取决于端口布线与实际通信模式。</p>"
    ],
    [
     "<p>Same rail describes the port grouping. Same leaf describes switch placement. In the diagram, both ports still belong to rail A but attach to different leaves, so traffic is forwarded through a spine. Uplink demand depends on the port map and actual communication pattern.</p>"
    ]
   ]
  }
 ]
