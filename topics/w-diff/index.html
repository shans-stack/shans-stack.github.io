<script>
window.SS_TOPIC_CFG={
  anim: "w-diff",
  ar: [848/324, 370/430],
  steps: [
    {
      t: ["选定要比较的两个状态", "Select Two States to Compare"],
      d: ["DiffList 可以比较两个快照，也可以比较快照与活动文件系统。", "DiffList can compare two snapshots or compare a snapshot with the live filesystem."],
      b: [["\u003cp>DiffList 是 WEKA 用于查询文件系统状态差异的 REST API，也就是通过 HTTP 调用的程序接口。调用方指定两个状态作为比较端点，服务据此列出变更。两个状态可按任一时间顺序提交。\u003c/p>"], ["\u003cp>DiffList is WEKA's REST API for querying differences between filesystem states. REST APIs expose operations over HTTP. The caller selects two states as comparison endpoints, and the service lists changes between them. The states can be submitted in either chronological order.\u003c/p>"]]
    },
    {
      t: ["识别变化的文件", "Identify Changed Files"],
      d: ["变更项区分新增、修改和删除，并可带路径等属性。", "Entries distinguish creations, modifications, and deletions and can include attributes such as paths."],
      b: [["\u003cp>例如较早状态含 A 和 B，较晚状态含修改后的 A 和新增的 C，结果就会列出修改 A、删除 B、新增 C。结果项的操作类型（opType）结合文件或符号链接等对象类型和变更动作。符号链接是指向另一路径的文件系统对象。\u003c/p>"], ["\u003cp>For example, if an earlier state has A and B and a later state has a modified A and a new C, the result lists a modification to A, a deletion of B, and a creation of C. The operation type (opType) combines the kind of object, such as a file or symbolic link, with the change action. A symbolic link points to another filesystem path.\u003c/p>"]]
    },
    {
      t: ["准备查询并取得令牌", "Prepare the Query and Obtain Tokens"],
      d: ["prepare 请求提交比较端点及并行度，Data Services 容器返回处理令牌列表。", "The prepare request supplies the endpoints and desired parallelism. The Data Services container returns a list of processing tokens."],
      b: [["\u003cp>DiffList 服务运行在已配置且正在运行的 Data Services 容器（dataserv）上。调用方先发送 POST /snapshots/diff/prepare。请求中的 parallelism 指定要生成的处理令牌数。服务按该并行度划分比较任务，调用方使用对应令牌发出 getResults 请求，读取各分片的结果。\u003c/p>"], ["\u003cp>The DiffList service runs in a configured, active Data Services container (dataserv). The caller first sends POST /snapshots/diff/prepare. The parallelism parameter specifies how many processing tokens to generate. The service splits the comparison accordingly. The caller uses the corresponding token in getResults requests for each partition.\u003c/p>"]]
    },
    {
      t: ["分页读取结果", "Retrieve Results by Page"],
      d: ["getResults 使用处理令牌获取分页结果，查询过程支持并行处理。", "getResults uses the processing tokens to return pages of changes, and the workflow supports parallel processing."],
      b: [["\u003cp>POST /snapshots/diff/getResults 返回变更项列表的一部分。分页把较大的结果拆分为多次响应，调用方可以分批处理这些记录。准备和取结果分开的设计也支持并行处理。\u003c/p>"], ["\u003cp>POST /snapshots/diff/getResults retrieves part of the change list. Pagination breaks a large result set into separate responses so callers can process records in batches. The separate preparation and retrieval stages also support parallel processing.\u003c/p>"]]
    },
    {
      t: ["将变更列表交给下游任务", "Use the Change List in Downstream Jobs"],
      d: ["备份、审计或数据移动程序可以根据变更列表决定下一步操作。", "Backup, audit, and data-movement tools can use the change list to decide what to do next."],
      b: [["\u003cp>DiffList 提供的是变更记录。增量备份程序可以用这些记录确定要读取的文件和要处理的删除项，再经备份程序的数据路径传输所需文件。审计程序可以利用变更记录了解两个状态之间的差异。\u003c/p>"], ["\u003cp>DiffList produces records of changes. For example, incremental backup software can use them to select files to read and deletions to handle, then transfer the required files over its data path. Audit tools can use the same records to review what changed between the two states.\u003c/p>"]]
    }
  ]
};
</script>

</script>
