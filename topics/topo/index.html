window.SS_TOPIC_CFG={
 "anim": "topo",
 "ar": [900/360,360/520],
 "steps": [
  {
   "t": [
    "Leaf 汇聚服务器",
    "Leaf Switches Connect Servers"
   ],
   "d": [
    "接在同一台 Leaf 上的服务器可以在这台交换机内完成转发。",
    "Servers on the same leaf can exchange traffic through that switch."
   ],
   "b": [
    [
     "<p>网络拓扑描述设备和链路如何连接。Leaf 是直接连接服务器的接入交换机。同一台 Leaf 上的服务器可以在本交换机内转发。跨 Leaf 的流量需要通过连接这些交换机的上联链路。</p>"
    ],
    [
     "<p>A network topology describes how devices and links connect. A leaf is an access switch that connects directly to servers. Traffic between servers on the same leaf can stay on that switch. Traffic between leaves uses uplinks that connect those switches to the rest of the fabric.</p>"
    ]
   ]
  },
  {
   "t": [
    "Spine 提供跨 Leaf 路径",
    "Spines Provide Paths Between Leaves"
   ],
   "d": [
    "每台 Leaf 接入每台 Spine，跨 Leaf 流量可经不同的 Spine 到达目的端。",
    "Each leaf connects to each spine, giving cross-leaf traffic multiple routes to its destination."
   ],
   "b": [
    [
     "<p>Spine 是在 Leaf 之间转发的上层交换机。在两层 Leaf–Spine 网络中，一个跨 Leaf 报文经源 Leaf、一个 Spine 和目的 Leaf 转发。这是折叠 Clos 拓扑的常见形式，数据中心资料也常称其为胖树。</p>"
    ],
    [
     "<p>A spine is an upper-tier switch that forwards traffic between leaves. In a two-tier leaf–spine fabric, a cross-leaf packet traverses the source leaf, one spine and the destination leaf. This is a common form of folded Clos, also described as a fat-tree in data center literature.</p>"
    ]
   ]
  },
  {
   "t": [
    "等价多路径分散流量",
    "Equal-cost Multipath Distributes Flows"
   ],
   "d": [
    "基于流的 ECMP 把不同流量分配给多个等成本的下一跳。",
    "Flow-based ECMP distributes flows among next hops with equal routing cost."
   ],
   "b": [
    [
     "<p>等价多路径（ECMP）让路由设备在同一目的地有多个同等路由代价的下一跳时使用多条路径。常见做法是对源地址、目的地址等报文字段做哈希，把同一条流稳定映射到其中一个下一跳。多个大流仍可能落在同一条路径上。</p>"
    ],
    [
     "<p>Equal-cost multipath (ECMP) allows a router to use several next hops with the same routing cost to a destination. A common implementation hashes packet fields such as source and destination addresses to keep a flow on one next hop. Several large flows can still land on the same path.</p>"
    ]
   ]
  },
  {
   "t": [
    "上联容量决定超额订阅",
    "Uplink Capacity Determines Oversubscription"
   ],
   "d": [
    "下联总容量高于上联总容量时，并发跨 Leaf 流量会争用上联。",
    "When downlink capacity exceeds uplink capacity, concurrent cross-leaf flows can contend for the uplinks."
   ],
   "b": [
    [
     "<p>超额订阅比是某层面向服务器方向的总链路容量与上行总链路容量之比。下联可同时送入的流量超过上联可同时送出的流量时，跨 Leaf 的数据会在上联出口排队。服务器之间留在同一台 Leaf 的流量使用本地转发路径，例如接在同一台 Leaf 的 GPU 轨道流量。</p>"
    ],
    [

 ]
