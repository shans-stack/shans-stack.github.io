<script>
window.SS_TOPIC_CFG={
 "anim": "f-obs",
 "ar": [880/330, 1],
 "steps": [
  {
   "t": [
    "收集设备与服务信号",
    "Collect Device and Service Signals"
   ],
   "d": [
    "汇总 GPU 利用率、请求延迟、吞吐、错误率和缓存命中，按租户或服务查看用量与健康状态。",
    "Collects GPU utilisation, request latency, throughput, error rate and cache hits, viewed by tenant or service for usage and health."
   ],
   "b": [
    [
     "<p>遥测是系统运行时对外发出的数据。GPU 节点提供设备活动等信号，网关记录请求结果，推理引擎记录生成和缓存行为。指标是随时间采集的数值，日志记录事件，追踪记录单次请求经过的处理环节。三种信号可以按共同的时间和作用域关联。</p>"
    ],
    [
     "<p>Telemetry is data a system emits as it runs. GPU nodes report device activity, gateways record request outcomes, and inference engines report generation and cache behavior. Metrics are measurements collected over time, logs record events, and traces follow individual requests through processing stages. The signals can be correlated by time and scope.</p>"
    ]
   ]
  },
  {
   "t": [
    "区分 GPU 分配与利用率",
    "Distinguish GPU Allocation from Utilization"
   ],
   "d": [
    "调度系统记录已分配的设备，设备遥测反映 GPU 在采样期间的活动。",
    "The scheduling system records device allocations, while device telemetry reflects GPU activity during the sampling interval."
   ],
   "b": [
    [
     "<p>分配记录说明设备归哪个工作负载使用。即使设备已分配，工作负载仍可能在等输入。NVIDIA DCGM Exporter 可公开 GPU 利用率等指标，在 Kubernetes 工作负载映射成功时可附带 Pod 和命名空间标签。覆盖范围取决于设备、驱动和采集配置。</p>"
    ],
    [
     "<p>An allocation identifies the workload assigned to a device. The workload may still be waiting for input while it holds the device. NVIDIA DCGM Exporter can expose metrics such as GPU utilization and attach Pod and namespace labels when Kubernetes workload mapping succeeds. Coverage depends on the device, driver, and collection configuration.</p>"
    ]
   ]
  },
  {
   "t": [
    "读懂推理服务指标",
    "Interpret Inference Service Metrics"
   ],
   "d": [
    "请求延迟、输出吞吐、错误率和缓存命中分别描述等待时间、交付速率、请求结果和缓存复用。",
    "Request latency, output throughput, error rate, and cache hits describe waiting time, delivery rate, request outcomes, and cache reuse."
   ],
   "b": [
    [
     "<p>首 Token 延迟是从观测点收到请求到产生或收到首个 Token 的时间。输出吞吐按同一测量窗口内的输出 Token 数计算。网关错误率按定义好的错误响应数除以同一范围内的请求数，统计口径随观测点而定。</p>",
     "<p>在推理引擎侧，vLLM 分别记录查询前缀缓存的 Token 数和命中的 Token 数。以这两项计算的命中率按 Token 统计。前缀缓存复用的是相同输入开头的中间计算结果。</p>"
    ],
    [
     "<p>Time to first token runs from request receipt to the first token produced or received at the measurement point. Output throughput uses the number of output tokens in the measurement window. A gateway error rate divides the defined error responses by all requests in the same scope. Its coverage depends on where requests are measured.</p>",
     "<p>At the engine layer, vLLM counts the tokens looked up in the prefix cache and the tokens that hit it. The resulting hit rate is token-based. A prefix cache reuses intermediate computation for identical input prefixes.</p>"
    ]
   ]
  },
  {
   "t": [
    "按租户和服务查看",
    "Break Down by Tenant and Service"
   ],
   "d": [
    "采集端携带的标签及平台维护的归属关系，决定指标可以按哪些范围汇总。",
    "Source labels and ownership mappings determine which scopes can be used to aggregate metrics."
   ],
   "b": [
    [
     "<p>标签是随指标保存的键值对，例如服务名或命名空间。网关可以用已识别的租户和请求路由标记服务指标。GPU 指标的租户或服务归属则依赖平台能否把设备上的工作负载映射到对应范围。汇总延迟分布时，兼容的直方图可以先合并各延迟区间的计数，再估算整体的高分位延迟。</p>"
    ],
    [
     "<p>Labels are key-value pairs stored with metrics, such as a service name or namespace. A gateway can label service metrics with the identified tenant and request route. Attributing GPU metrics to tenants or services depends on the platform mapping workloads on each device to those scopes. Compatible latency histograms can be aggregated by combining bucket counts before estimating the overall tail percentile.</p>"
    ]
   ]
  },
  {
   "t": [
    "对齐信号定位等待",
    "Correlate Signals to Locate Waits"
   ],
   "d": [
    "首 Token 变慢时，同一时段的排队与执行信号可用于缩小排查范围。",
    "When the first token takes longer, queue and execution signals from the same interval help narrow the investigation."
   ],
   "b": [
    [
     "<p>示例中，一个服务的首 Token 延迟和引擎排队时间同时升高，模型执行耗时保持平稳。该组合将排查重点指向首 Token 前的排队环节。按同一服务、同一窗口对齐曲线，再结合可用的请求追踪或日志，可进一步核对等待发生的位置。</p>"
    ],
    [
     "<p>In this example, time to first token and engine queue time rise for one service while model execution time remains steady. The pattern narrows the investigation to queueing before the first token. Aligning the series for the same service and time window, then checking available request traces or logs, helps locate the wait.</p>"
    ]
   ]
  },
  {
   "t": [
    "用服务信号触发告警",
    "Alert on Service Symptoms"
   ],
   "d": [
    "以持续的服务异常触发告警，并保留关联资源指标供诊断。",
    "Alert on sustained service symptoms and retain related resource metrics for diagnosis."
   ],
   "b": [
    [
     "<p>如果延迟或错误率持续超出服务阈值，告警可明确受影响的服务和时间范围。GPU 活动和缓存命中等指标可在同一视图辅助诊断。用量趋势还可供容量规划参考，计费则依赖另行定义的计量口径与使用记录。</p>"
    ],
    [
     "<p>When latency or error rate stays beyond a service threshold, an alert can identify the affected service and time range. GPU activity and cache-hit metrics can provide diagnostic context in the same view. Usage trends can also inform capacity planning, while billing relies on its own metering definitions and usage records.</p>"
    ]
   ]
  }
 ]
};
document.addEventListener('ss-lang', ({detail}) => {
  const en = detail === 'en';
  document.querySelector('meta[name=description]').content = ["分 6 步说明如何采集 GPU 和推理服务遥测、按租户或服务汇总，并用关联信号定位异常。","Six steps on collecting GPU and inference telemetry, grouping it by tenant or service, and using related signals to diagnose anomalies."][en ? 1 : 0];
});
</script>
