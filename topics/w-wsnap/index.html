<script>
window.SS_TOPIC_CFG={
  anim: "w-wsnap",
  ar: [820/276, 360/394],
  steps: [
    {
      t: ["从只读时间点开始", "Start with a Read-Only Point in Time"],
      d: ["WEKA 文件系统快照默认只读，保留创建时的文件系统状态。", "A WEKA filesystem snapshot is read-only by default and preserves the filesystem state at capture time."],
      b: [["<p>文件系统快照是某一时间点的文件系统视图。活动文件系统可以继续接收写入，只读快照仍保留捕获时的内容。捕获时两个视图引用已有数据块。这份固定状态可以作为克隆的起点。</p>"], ["<p>A filesystem snapshot is a view of the filesystem at a particular time. The live filesystem can continue receiving writes while the read-only snapshot preserves the captured contents. At capture time both views reference the existing data blocks. That fixed state can serve as the starting point for a clone.</p>"]]
    },
    {
      t: ["从只读源创建可写克隆", "Create a Writable Clone from the Read-Only Source"],
      d: ["从只读快照派生可写分支，两个视图起初共享已有数据块。", "A writable clone branches from the read-only snapshot. Both views initially share the existing data blocks."],
      b: [["<p>可写克隆是在同一文件系统中从指定源快照派生的另一份快照，创建时看到的内容与源快照一致。WEKA 图形界面的 Duplicate Snapshot 操作预填源文件系统和源快照，并为新快照提供可写设置。</p>"], ["<p>A writable clone is a separate snapshot derived from a specified source snapshot in the same filesystem. Its initial contents match the source. In the WEKA GUI, Duplicate Snapshot preselects the source filesystem and snapshot and offers a writable setting for the new snapshot.</p>"]]
    },
    {
      t: ["在克隆中修改文件", "Modify Files in the Clone"],
      d: ["测试写入可以改变克隆中的文件，原快照继续保存初始版本。", "Test writes can change files in the clone while the source snapshot keeps the original version."],
      b: [["<p>克隆有自己的访问点，即挂载文件系统中 <code>.snapshots</code> 下用于访问该快照的目录。测试任务可以在此修改文件。例如，克隆里的示例文件从 A 版变为 B 版时，原只读快照里仍可读取 A 版。</p>"], ["<p>The clone has its own access point, a directory under <code>.snapshots</code> in the mounted filesystem. A test workload can edit files there. As an example, changing a file from version A to version B in the clone leaves version A readable in the source snapshot.</p>"]]
    },
    {
      t: ["可写状态无法逆转", "Writability Is One-Way"],
      d: ["同一份可写快照无法改回只读。", "An existing writable snapshot cannot be changed back to read-only."],
      b: [["<p>可写快照可以继续接收修改。WEKA 的快照更新操作支持修改名称和访问点。需要固定当前内容时，可以从可写快照另建一个只读时间点。</p>"], ["<p>A writable snapshot can continue accepting changes. WEKA's snapshot update operation can change the name and access point. A separate read-only snapshot can capture the current contents at a fixed point in time.</p>"]]
    },
    {
      t: ["另存新的只读快照", "Capture a New Read-Only Snapshot"],
      d: ["从可写克隆另建只读快照后，新快照可通过 Snap-to-Object 上传。", "A new read-only snapshot taken from the writable clone can be uploaded through Snap-to-Object."],
      b: [["<p>以可写克隆为源创建只读快照，可以将测试后的文件状态固定在新的时间点。可写克隆可以继续修改。Snap-to-Object 将只读快照上传到配置好的对象存储，可写克隆本身无法通过该功能上传。</p>"], ["<p>Taking a new read-only snapshot of the writable clone preserves the post-test file state at a new point in time. The clone remains writable. Snap-to-Object can upload the read-only snapshot to configured object storage. The writable clone itself is ineligible for that upload.</p>"]]
    }
  ]
};
</script>
