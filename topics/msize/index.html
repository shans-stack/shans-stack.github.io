<script>
window.SS_TOPIC_CFG = {
 "anim": "msize",
 "ar": [960/334, 400/544],
 "steps": [
  {
   "t": [
    "从权重开始估算",
    "Start with the Weights"
   ],
   "d": [
    "权重占用与参数数量及每个参数的存储字节数直接相关。",
    "Weight storage depends directly on the parameter count and the bytes used per parameter."
   ],
   "b": [
    [
     "<p>参数是模型学习得到的数值，权重是其中用于计算的数值。若参数采用同一种存储格式，权重体积的基础估算是参数量乘以单个参数的字节数。例如 BF16 是 16 位浮点格式，每个值占两字节。混合格式要分组估算，再加上元数据和布局开销。</p>"
    ],
    [
     "<p>Parameters are the values a model learns, including weights used in its calculations. When all weights use a single storage format, their basic footprint is the parameter count multiplied by bytes per parameter. BF16 is a 16-bit floating-point format, so each value occupies two bytes. Mixed formats are counted separately, along with metadata and layout overhead.</p>"
    ]
   ]
  },
  {
   "t": [
    "训练与推理的显存构成",
    "Training and Inference Memory Components"
   ],
   "d": [
    "训练侧保留梯度、优化器状态和激活，生成推理侧还要为 KV Cache 留空间。",
    "Training retains gradients, optimizer state, and activations, while generation budgets separately for the KV cache."
   ],
   "b": [
    [
     "<p>训练中的梯度表示损失对参数的变化率，优化器状态保存更新权重用的历史统计，激活是前向计算产生并可能为反向保留的中间值。生成推理通常无需保存训练梯度和优化器状态。KV Cache 保存已处理 token 的键和值，其占用随保留的序列与 token 增长。两侧还需给临时缓冲区留空间。</p>"
    ],
    [
     "<p>During training, gradients describe how the loss changes with parameters, optimizer state stores statistics used to update weights, and activations are intermediate values that can be retained for backpropagation. Generation typically omits training gradients and optimizer state. Its KV cache stores keys and values for processed tokens and grows with the sequences and tokens retained. Both workloads also need temporary buffer space.</p>"
    ]
   ]
  },
  {
   "t": [
    "数据并行复制模型并划分样本",
    "Data Parallelism Replicates Models and Partitions Samples"
   ],
   "d": [
    "每张卡处理不同数据，常规数据并行同步各副本产生的梯度。",
    "Each GPU processes different data, and conventional data parallelism synchronizes replica gradients."
   ],
   "b": [
    [
     "<p>常规数据并行在每张卡放一份完整模型，用各自的数据子批次计算梯度，再对梯度做归约，使各副本得到一致的更新。归约把分散在不同设备上的值合并，例如求和。若要进一步降低单卡训练状态占用，可采用分片方案，把参数、梯度或优化器状态分布在数据并行组内。</p>"
    ],
    [
     "<p>Conventional data parallelism stores a full model replica on each GPU. Each computes gradients on a different subset of the batch and then reduces those gradients so all replicas apply a consistent update. A reduction combines values across devices, for example by summing them. Sharding can further reduce per-GPU training state by distributing parameters, gradients, or optimizer state across the data-parallel group.</p>"
    ]
   ]
  },
  {
   "t": [
    "张量并行划分层内权重",
    "Tensor Parallelism Partitions Weights Within a Layer"
   ],
   "d": [
    "同一层的权重矩阵分布在多张卡上，设备共同完成这一层。",
    "Several GPUs hold different pieces of the same weight matrix and jointly compute the layer."
   ],
   "b": [
    [
     "<p>张量是按一个或多个维度排列的数值。张量并行通常沿某个维度切分层内权重矩阵，让不同设备做各自的局部计算。结果按层结构进行拼接或归约，必要时在卡间交换数据。</p>"
    ],
    [
     "<p>A tensor is an array of values arranged along one or more dimensions. Tensor parallelism typically partitions a layer's weight matrix along a dimension so devices compute local results. Those results are concatenated or reduced as required by the layer, with communication between GPUs where needed.</p>"
    ]
   ]
  },
  {
   "t": [
    "流水线并行划分模型层",
    "Pipeline Parallelism Partitions Model Layers"
   ],
   "d": [
    "每张卡负责连续的一组层，微批次依次经过各段。",
    "Each GPU runs a consecutive group of layers, and microbatches pass through the stages in order."
   ],
   "b": [
    [
     "<p>流水线并行把层分成多个阶段，上一阶段将激活传给下一阶段。微批次是把一个训练批次再细分得到的小批。多个微批次可同时占用不同阶段，启动、收尾或阶段负载不均时，部分设备会出现空闲。</p>"
    ],
    [
     "<p>Pipeline parallelism assigns groups of layers to stages. Each stage sends activations to the next. A microbatch is a subdivision of a training batch. Multiple microbatches can occupy different stages at once, with idle time during fill, drain, or stage imbalance.</p>"
    ]
   ]
  },
  {
   "t": [
    "并行配置中的单设备峰值显存",
    "Peak Per-Device Memory in Parallel Configurations"
   ],
   "d": [
    "并行分组决定各设备持有的状态，峰值显存还包括通信缓冲区和临时张量。",
    "Parallel groups determine each device’s resident state. Peak memory also includes communication buffers and temporary tensors."
   ],
   "b": [
    [
     "<p>数据、张量和流水线并行可以组合。每张卡的权重与运行状态取决于实际分组，峰值还会包含通信缓冲区、临时张量以及分片方案所需的短时聚合。容量估算按各卡实际放置的内容分别计算。</p>"
    ],
    [
     "<p>Data, tensor, and pipeline parallelism can be combined. Per-GPU weights and runtime state depend on the group layout. Peak usage also covers communication buffers, temporary tensors, and short-lived gathers required by some sharding schemes. Capacity is estimated from the data placed on each GPU.</p>"
    ]
   ]
  }
 ]
};
</script>
