<script>
window.SS_TOPIC_CFG={
 "anim": "pipe",
 "ar": [900/340,360/420],
 "steps": [
  {
   "t": [
    "采集源数据",
    "Collect Source Data"
   ],
   "d": [
    "摄取作业将源记录与来源标识一起写入原始层。",
    "An ingest job writes source records to the raw layer with their source identifiers."
   ],
   "b": [
    [
     "<p>数据管道是一组按依赖关系运行的处理步骤。起点可以是文件、数据库或事件日志。摄取步骤读取输入并保存重新处理所需的信息，例如源文件名或输入位置。原始层形成后，其余步骤可以使用同一份输入。</p>"
    ],
    [
     "<p>A data pipeline is a set of processing steps linked by dependencies. Its input can come from files, databases or event logs. Ingest reads the input and preserves information needed for replay, such as a source file name or input position. The raw layer then provides the same input to subsequent steps.</p>"
    ]
   ]
  },
  {
   "t": [
    "按数据约定分流",
    "Route Records by Validation Rules"
   ],
   "d": [
    "校验通过的记录继续处理，异常记录连同原因进入隔离区。",
    "Valid records proceed to processing, while rejected records go to quarantine with their rejection reasons."
   ],
   "b": [
    [
     "<p>校验可以根据字段的名称、类型和必填规则判断记录是否符合约定。格式错误或缺少必要字段的记录进入隔离区，保留错误原因和原始记录的引用。这样有效数据能继续流转，异常输入也可以回查和修复。</p>"
    ],
    [
     "<p>Validation checks records against agreed field names, types and required values. Malformed records and records missing required fields go to quarantine with a reason and a reference to the source record. Valid data can proceed while rejected inputs remain available for investigation and correction.</p>"
    ]
   ]
  },
  {
   "t": [
    "转成训练样本",
    "Transform Records into Training Samples"
   ],
   "d": [
    "通过校验的记录经过字段转换和关联，形成结构一致的样本。",
    "Validated records are converted and joined to form samples with a consistent structure."
   ],
   "b": [
    [
     "<p>转换步骤按目标用途重新组织字段。例如，训练故障分类模型时，可将同一设备的事件与已核实的故障类别关联，得到带标签的样本。标签是模型训练时使用的目标值。把转换规则和输入版本一同保存，可以复现同一份样本。</p>"
    ],
    [
     "<p>Transformation reshapes fields for a target use. A fault classification dataset, for example, can join each device’s events with verified fault categories to produce labelled samples. A label is the target value used during model training. Saving the transformation rules with the input version makes the samples reproducible.</p>"
    ]
   ]
  },
  {
   "t": [
    "发布完整输出",
    "Publish Complete Output"
   ],
   "d": [
    "消费端在发布成功后取得这一批完整样本。",
    "Consumers receive a complete batch of samples after publication succeeds."
   ],
   "b": [
    [
     "<p>使用事务表时，作业可先写出新数据文件，再通过一次表提交发布该批样本。例如，Delta Lake 的事务日志记录新增文件，读取端按已提交的表版本解析文件集合。</p>"
    ],
    [
     "<p>In a transactional table, a job can write data files and then publish the batch with a table commit. For example, the Delta Lake transaction log records the added files, and consumers resolve the file set from a committed table version.</p>"
    ]
   ]
  },
  {
   "t": [
    "选择批处理或流处理",
    "Choose Batch or Stream Processing"
   ],
   "d": [
    "批处理读取边界已定的输入，流处理随着新事件到达增量更新。",
    "Batch processing reads bounded input, while streaming updates results as new events arrive."
   ],
   "b": [
    [
     "<p>批处理可以按日期或文件清单决定本次要读的范围，适合固定输入上的历史重算。流处理持续接收新事件，并随输入到达更新输出。两者都可以执行校验和转换，差别在于输入范围何时确定以及结果如何更新。</p>"
    ],
    [
     "<p>A batch job can use a date or a file list to bound its input, which suits historical recomputation. A streaming job receives new events and updates its output as input arrives. Both can validate and transform records. They differ in when the input is bounded and how updates are produced.</p>"
    ]
   ]
  },
  {
   "t": [
    "批次标识与幂等重试",
    "Batch Identifiers and Idempotent Retries"
   ],
   "d": [
    "故障恢复后，重跑使用同一批输入和输出标识，避免重复追加。",
    "After recovery, a retry uses the same input and output identifiers to avoid duplicate appends."
   ],
   "b": [
    [
     "<p>幂等写入指重复执行同一逻辑写入时，结果与执行一次相同。Delta Lake 可以用应用标识和事务版本识别重复写入。固定批次输入后，重试复用同一个事务标识。首次未提交时，重试可以提交这一批。首次已提交但客户端未收到确认时，Delta Lake 识别该标识并跳过重复写入。</p>"
    ],
    [
     "<p>An idempotent write leaves the same result after repeats as after one execution. Delta Lake can identify repeated writes by an application identifier and transaction version. With the batch inputs held constant, the retry reuses the same transaction identifier. If the first attempt did not commit, the retry can commit the batch. If the first commit succeeded but the client missed the acknowledgment, Delta Lake recognizes the identifier and skips the duplicate write.</p>"
    ]
   ]
  }
 ]
};
</script>
