<script>
window.SS_TOPIC_CFG={
 "anim": "d-pfl",
 "ar": [900/342,360/320],
 "steps": [
  {
    "t": [
      "固定布局覆盖整个文件",
      "One Fixed Layout for the Whole File"
    ],
    "d": [
      "传统布局用同一套条带参数映射一个文件的所有数据。",
      "A fixed layout maps all of a file’s data using the same striping parameters."
    ],
    "b": [
      [
        "<p>条带化把相邻数据块按布局规则分配给 OST（Object Storage Target，数据目标）。条带数量决定一个布局可使用多少个目标。统一布局需要在分散大文件流量和控制小文件涉及的目标数之间取舍。</p>"
      ],
      [
        "<p>Striping assigns adjacent blocks to Object Storage Targets (OSTs) according to the layout. Stripe count determines how many targets a layout uses. A single layout trades off spreading large-file traffic and limiting the targets involved for small files.</p>"
      ]
    ]
  },
  {
    "t": [
      "按字节偏移定义组件",
      "Defining Components by Byte Offset"
    ],
    "d": [
      "PFL 把一个文件布局拆成互不重叠的字节范围，每段由独立组件描述。",
      "PFL splits a file layout into non-overlapping byte ranges, each described by a separate component."
    ],
    "b": [
      [
        "<p>PFL（Progressive File Layout，渐进式文件布局）的组件记录起止偏移以及该范围的条带参数。它们组成一个复合布局，应用仍看到一个文件。组件边界由布局定义，可以为文件开头和后续内容配置不同规则。</p>"
      ],
      [
        "<p>A Progressive File Layout (PFL) component records a byte range and its striping parameters. The components form a composite layout while the application sees a single file. Layout boundaries allow one rule for the beginning of the file and another for later data.</p>"
      ]
    ]
  },
  {
    "t": [
      "首段使用较窄条带",
      "Starting with a Narrow Stripe"
    ],
    "d": [
      "写入停在首段时，数据只落到首段使用的目标。",
      "When writes stay in the first range, data lands on the targets for that range."
    ],
    "b": [
      [
        "<p>一种布局为首段指定一个目标，为后续范围预留更宽的条带。尚未实例化的组件已经有布局规则，实际存放数据的 OST 对象在相关范围需要时分配。</p>"
      ],
      [
        "<p>One layout can assign a single target to the first range and reserve wider stripes for later ranges. An uninstantiated component already has layout rules. The OST objects that hold its data are allocated when the range is needed.</p>"
      ]
    ]
  },
  {
    "t": [
      "文件增长时启用后续组件",
      "Activating Later Components as the File Grows"
    ],
    "d": [
      "写入跨过边界时，后续数据进入新组件，前段保持原有放置。",
      "When a write crosses the boundary, later data enters the new component and the earlier range stays in place."
    ],
    "b": [
      [
        "<p>客户端访问尚未实例化的范围时，由 MDT（Metadata Target，元数据目标）为该组件分配对象。新数据按这一段的条带数量、条带大小和可选 OST 池分布。先前范围仍由它原来的组件描述。</p>"
      ],
      [
        "<p>When the client accesses an uninstantiated range, the Metadata Target (MDT) allocates objects for that component. The new data follows the range’s stripe count, stripe size, and optional OST pool. The preceding range keeps its existing component.</p>"
      ]
    ]
  },
  {
    "t": [
      "按偏移读回完整文件",
      "Reading the File by Offset"
    ],
    "d": [
      "客户端按每个范围的布局读取数据，应用仍使用同一个文件句柄。",
      "The client reads each range through its own layout while the application uses a single file handle."
    ],
    "b": [
      [
        "<p>跨越组件边界的 I/O 会涉及对应的多个布局。偏移决定访问哪一段，池和条带决定从哪些目标取回这段。为已有数据重新安排布局则是显式迁移，和文件继续增长是两个操作。</p>"
      ],
      [
        "<p>I/O that crosses a component boundary uses the layouts for both ranges. The offset selects the range, and the pool and striping rules determine where to retrieve it. Explicit migration can rearrange existing data independently of file growth.</p>"
      ]
    ]
  }
]
};
