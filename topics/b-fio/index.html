     "<p>fio is a configurable I/O load generator. It runs jobs as threads or processes. Each job defines I/O parameters for a target. A file test uses a file system path, while a raw device test addresses the selected device interface directly. Interpretation depends on the measured path.</p>",

   ],
   "b": [
    [
     "<p><code>[global]</code> 提供默认值，命名作业段可以单独覆盖。常用参数包括 <code>filename</code>（目标）、<code>rw</code>（访问模式）、<code>bs</code>（I/O 大小）和 <code>size</code>（测试范围）。例如 <code>fio workload.fio</code> 读取指定作业文件并实例化各段；需要按时间持续发出负载时，可用 <code>time_based</code> 配合 <code>runtime</code>，<code>ramp_time</code> 则把预热留在统计之外。</p>"
    ],
    [
     "<p><code>[global]</code> supplies defaults, and named job sections can override them. Common settings include <code>filename</code> for the target, <code>rw</code> for the access pattern, <code>bs</code> for I/O size, and <code>size</code> for the tested region. For example, <code>fio workload.fio</code> reads the specified job file and instantiates its job sections. <code>time_based</code> with <code>runtime</code> keeps issuing I/O for a set period, while <code>ramp_time</code> keeps warm-up outside the statistics.</p>"

    ]
   ]

 ]
