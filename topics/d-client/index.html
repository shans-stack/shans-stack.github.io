    ],
    [
     "<p>EXAScaler is based on Lustre. The native client runs in the Linux kernel and translates application file operations into Lustre requests. A mount point attaches the file system to the local directory tree. Applications use POSIX file interfaces, such as open and read, through that path.</p>"
    ]

  },
  {

    "The client obtains target and service endpoint configuration from the management server."
   ],
   "b": [
    [
     "<p>管理服务器（Management Server，MGS）提供文件系统的配置。客户端挂载时获取元数据目标卷（MDT）、对象存储目标卷（OST）及其服务节点的网络标识，用这些配置建立与相应服务的连接。</p>"
    ],
    [
     "<p>The management server (MGS) supplies the file system configuration. At mount time the client learns about metadata targets (MDTs), object storage targets (OSTs), and the network identifiers of their service nodes. It uses that information to connect to the corresponding services.</p>"
    ]
   ]
  },
  {
   "t": [
    "打开文件时取得布局",
    "Obtaining the Layout at Open"
   ],
   "d": [
    "对于需要远程查找的文件，客户端向元数据服务器解析路径并取得文件布局。",
    "For a file that requires a remote lookup, the client resolves the path and obtains the layout from the metadata server."
   ],
   "b": [
    [

    ],
    [
     "<p>The file system configuration describes the available services. A file layout identifies the objects that hold a particular file&#39;s data and maps byte ranges to those objects. The Lustre client can obtain this layout from the metadata server (MDS) when it opens the file.</p>"
