    [
     "<p>LNet stands for Lustre Networking. It carries messages between clients and Lustre services. In EXAScaler, for example, a file open requests its layout from the metadata server (MDS), and a read requests bytes from the object storage server (OSS). Both exchanges use LNet.</p>"

   ]

   "t": [

    ],
    [
     "<p>A Lustre Network Driver (LND) connects LNet to a particular transport. For example, <code>socklnd</code> uses TCP, and <code>o2ib</code> can use remote direct memory access (RDMA) over InfiniBand. Higher-level Lustre services send messages through the same LNet interface.</p>"
    ]
   ]
  },

   ],
