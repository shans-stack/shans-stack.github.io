<script>
window.SS_TOPIC_CFG={
 "anim": "b-goodput",
 "ar": [
  2.5641025641025643,

 ],
 "steps": [
  {
   "t": [
    "同一请求的计时边界",
    "Timing Boundaries of a Request"
   ],
   "d": [
    "首 Token 时延描述多久收到开头，端到端延迟描述多久收到整次响应。",
    "Time to first token describes when output starts. End-to-end latency describes when the full response arrives."
   ],
   "b": [
    [
     "<p>在流式推理中，客户端可在回复完成前接收输出。TTFT（Time to First Token）从客户端发出请求计到收到首个输出 Token，包含客户端观测到的网络、排队及服务处理时间。端到端延迟从同一起点计到响应完成。</p>",
     "<p>Goodput 是指标。本文工具口径对应 AIPerf v0.14.0（2026-11-20）与 vLLM v0.34.0（2026-11-16）。</p>"
    ],
    [
     "<p>In streaming inference, a client can receive output before the response is complete. TTFT (time to first token) runs from sending the request to receiving the first output token and includes network, queueing, and service time observed by the client. End-to-end latency uses the same start and ends at response completion.</p>",
     "<p>Goodput is a metric. The tool definitions here correspond to AIPerf v0.14.0 (2026-11-20) and vLLM v0.34.0 (2026-11-16).</p>"
    ]
   ]
  },
  {
   "t": [
    "Token 间隔与平均生成时间",
    "Token Gaps and Mean Generation Time"
   ],
   "d": [
    "ITL 是相邻输出 Token 的间隔，TPOT 常指首 Token 之后的每 Token 平均耗时。",
    "ITL is the gap between adjacent output tokens. TPOT commonly means average time per token after the first."
   ],
   "b": [
    [
     "<p>ITL（Inter-Token Latency）描述输出过程中的间隔。TPOT（Time per Output Token）在 vLLM 的请求级口径下，用首 Token 后的耗时除以后续输出 Token 数。单 Token 输出没有后续间隔，流式批量返回的计量也依工具定义。</p>",
     "<p>同一次请求可以出现一次明显停顿，同时保持较小的平均 TPOT。分位数的统计对象可能是 Token 间隔，也可能是每个请求的平均值。</p>"
    ],
    [
     "<p>ITL (inter-token latency) describes gaps during output. At the request level in vLLM, TPOT (time per output token) divides time after the first token by the number of subsequent output tokens. A single-token output has no subsequent gap, and batched streaming delivery is handled according to the tool's definition.</p>",
     "<p>A request can have a pronounced stall while retaining a small mean TPOT. Percentiles may summarize token gaps or per-request averages.</p>"
    ]
   ]
  },
  {
   "t": [
    "用服务目标筛选请求",
    "Filtering Requests by Service Objectives"
   ],
   "d": [
    "有效吞吐等于测量窗口内同时满足所有目标的完成请求数除以窗口时长。",
    "Goodput divides the number of completed requests meeting every objective by the measurement window duration."
   ],
   "b": [
    [
     "<p>SLO（服务等级目标）规定允许的指标上限。带多个限制的运行逐请求检查每项限制。发生错误或超过任一目标的请求不贡献 goodput。完成请求速率与输出 Token 速率使用另外的计量口径。</p>",
     "<p>达标比例回答另一项问题：所有尝试中有多大比例达标。一个运行点可以有较高的 goodput，同时未达到要求的达标比例。</p>"
    ],
    [
     "<p>An SLO (service-level objective) sets an acceptable metric limit. A run with multiple limits evaluates each request against every limit. Errors and requests exceeding any objective contribute no goodput. Completion rate and output token rate use separate accounting.</p>",
     "<p>The attainment fraction answers a different question: what share of attempted requests passed? A load point can have high goodput and still fall short of a required attainment fraction.</p>"
    ]
   ]
  },
  {
   "t": [
    "扫描负载并记录约束",
    "Sweeping Load and Recording Constraints"
   ],
   "d": [
    "固定请求分布和各项门槛，在不同请求速率或并发下观测 goodput。",
    "Keep the request distribution and limits fixed while measuring goodput across request rates or concurrency levels."
   ],
   "b": [
    [
     "<p>在线压测确定模型、接口、流式模式、输入与输出长度分布、请求到达方式、预热与测量窗口，然后改变请求速率或并发上限。AIPerf 与 <code>vllm bench serve</code> 均用 <code>--goodput</code> 表达限制，具体指标名称和单位以对应版本文档为准。</p>",
     "<p>比较时记录请求错误、完成吞吐、达标速率和达标比例。固定门槛让各负载点采用相同的筛选条件。</p>"
    ],
    [
     "<p>An online load test fixes the model, endpoint, streaming mode, input and output length distributions, arrivals, warm-up, and measurement window before varying request rate or concurrency. AIPerf and <code>vllm bench serve</code> both accept <code>--goodput</code> constraints, with metric names and units defined in their versioned documentation.</p>",
     "<p>A comparison records errors, completion throughput, goodput, and attainment. Holding limits constant applies the same filter at every load point.</p>"
    ]
   ]
  },
  {
   "t": [
    "吞吐增长与排队",
    "Throughput Growth and Queueing"
   ],
   "d": [
    "负载增加时，完成吞吐可能继续增长，而排队使更多请求超过时延目标。",
    "As load rises, completion throughput can keep growing while queueing causes more requests to miss latency targets."
   ],
   "b": [
    [
     "<p>完成速率反映完成量，goodput 反映规定时延内的完成量。两项在拥塞时可能向不同方向变化。结合尾延迟、失败和达标比例，可以判断增加并发后是否还能维持服务目标。</p>",
     "<p>不同模型、请求长度分布、输出上限和 SLO 对应不同的容量条件。</p>"
    ],
    [
     "<p>Completion rate measures completed work, while goodput measures work completed within the declared latency limits. They can move in different directions under congestion. Tail latency, failures, and attainment show whether higher concurrency still satisfies service goals.</p>",
     "<p>Different models, request lengths, output caps, and SLOs define different capacity conditions.</p>"
    ]
   ]
  }
 ]
};
