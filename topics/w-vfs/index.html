    [
     "<p>The Virtual File System (VFS) is the Linux kernel interface common to different filesystems. The WEKA client installs a native filesystem driver on the application server. Applications use file operations defined by POSIX (Portable Operating System Interface), such as open, read, and write, to access a WEKA filesystem through that interface.</p>"
    ]

  {
   "t": [

   ],
   "d": [
    "挂载点把本机路径关联到指定的 WEKA 文件系统或子目录。",
    "A mount point maps a local path to a WEKA filesystem or a subdirectory."
   ],
   "b": [
    [
     "<p>挂载点是应用服务器上用来访问文件系统的路径。WEKA 原生挂载使用 <code>wekafs</code> 类型，可将整个文件系统或指定子目录挂载到本机。子目录挂载让不同应用从各自所需的目录开始访问，共用同一个底层文件系统。</p>"
    ],
    [
     "<p>A mount point is the path through which an application server accesses a filesystem. A native mount uses the <code>wekafs</code> type and exposes either the filesystem root or a specified subdirectory. Subdirectory mounts allow applications to start at different directories within the same underlying filesystem.</p>"
    ]
   ]
  },

    "Reading File Data from the Page Cache"

    "A read hit uses local memory, while missing data is fetched from the cluster."
   ],
   "b": [
    [
     "<p>Linux 页缓存是在主机内存中保留文件数据页的机制。读取所需数据时，客户端可从页缓存取回有效的数据页。缺失的数据由集群提供，读取的页可留在内存中供后续请求使用。</p>"
    ],
    [
     "<p>The Linux page cache holds file data in host memory. The client can satisfy a read from valid pages already in the cache. The cluster supplies missing pages, and the returned pages can remain in memory for later reads.</p>"

    [

    ],
    [
     "<p>Write cache mode uses write-back. A write can enter the kernel page cache and be acknowledged before it reaches resilient storage in the background. An application can synchronize the file with <code>fsync</code> when it needs a persistence boundary.</p>"

    ]
