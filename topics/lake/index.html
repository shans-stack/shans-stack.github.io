<script>
window.SS_TOPIC_CFG={
 "anim": "lake",
 "ar": [900/340,360/420],
 "steps": [
  {
   "t": [
    "保留多种原始数据",
    "Retain Raw Data in Multiple Formats"
   ],
   "d": [
    "导入后，日志、图像等输入可以按各自的原始格式保留。",
    "Logs, images and other inputs can be retained in their original formats after ingest."
   ],
   "b": [
    [
     "<p>数据湖可集中保存多种来源的数据。以 S3 通用存储桶为例，日志文件和图像可各自保存为对象，对象键在桶内唯一。原始层保留来源数据，为后续处理和重新生成下游结果提供输入。</p>"
    ],
    [
     "<p>A data lake can store data from multiple sources. In an S3 general purpose bucket, log files and images can be stored as separate objects, each with a key unique within the bucket. The raw layer preserves the source data for downstream processing and reprocessing.</p>"
    ]
   ]
  },
  {
   "t": [
    "从原始层生成整理层",
    "Build a Curated Layer from Raw Data"
   ],
   "d": [
    "处理作业生成字段一致的记录，原始文件继续保留。",
    "A processing job produces records with consistent fields while the original files remain available."
   ],
   "b": [
    [
     "<p>下游查询和训练需要稳定的字段与类型。处理作业可以解析原始日志，统一时间和设备标识，再将结果写入整理层。原始文件与输出分开保存，使下游可重复使用整理结果，也使处理作业能够从原始层重跑。</p>"
    ],
    [
     "<p>Downstream queries and training need stable fields and types. A processing job can parse raw logs, standardise timestamps and device identifiers, and write the result to a curated layer. Keeping source files and outputs separate lets downstream jobs reuse the curated data and lets the processing job run again from the raw layer.</p>"
    ]
   ]
  },
  {
   "t": [
    "按列保存常查字段",
    "Store Frequently Queried Fields by Column"
   ],
   "d": [
    "查询引擎可按查询需要读取列式文件中的相关列。",
    "A query engine can read the relevant columns from a columnar file."
   ],
   "b": [
    [
     "<p>整理后的结构化记录可写成 Parquet。Parquet 是一种列式文件格式，将一组行中同一列的值集中存放。查询只读取设备列时，读取器可以跳过时间和载荷列的数据。这种组织方式适用于从宽表中选取少量字段的查询。</p>"
    ],
    [
     "<p>Structured records in the curated layer can be written as Parquet. Parquet is a columnar file format that stores values from the same column together within a group of rows. A query that selects only the device column can skip data from the timestamp and payload columns. This layout suits queries that select a small subset of a wide table.</p>"
    ]
   ]
  },
  {
   "t": [
    "数据目录记录表结构和位置",
    "The Catalog Records Table Schema and Location"
   ],
   "d": [
    "数据目录将表名映射到字段定义和存储位置。",
    "A data catalog maps table names to field definitions and storage locations."
   ],
   "b": [
    [
     "<p>整理层的一张表可以包含多个文件。数据目录记录表的元数据，也就是描述数据的结构和位置的信息。查询引擎先按表名查目录，再根据返回的定义读取数据文件。对需要提交多个文件并保留表版本的场景，开放表格式可以在文件之上维护统一的表状态。</p>"
    ],
    [
     "<p>A table in the curated layer can contain many files. A data catalog records table metadata, which describes the structure and location of the data. The query engine looks up the table name and uses the returned definition to read the files. Where a workload needs multi-file commits and table version history, an open table format can maintain a consistent table state over those files.</p>"
    ]
   ]
  },
  {
   "t": [
    "复用整理后的数据",
    "Reuse Curated Data"
   ],
   "d": [
    "分析作业查询整理表，训练管道从同一张表提取样本。",
    "An analytics job queries the curated table while a training pipeline derives samples from it."
   ],
   "b": [
    [
     "<p>整理表成为多个下游作业的共同输入。分析作业可以按设备统计事件，训练管道可以按固定条件抽取样本，再把选定输入版本和处理规则记录到数据集。查询与训练各自读取所需的数据，整理表可以继续服务后续作业。</p>"
    ],
    [
     "<p>A curated table provides common input for multiple downstream jobs. An analytics job can count events by device, while a training pipeline can select samples with fixed criteria and record the input version and processing rules with the dataset. Each job reads the data it needs, and the table remains available for future jobs.</p>"
    ]
   ]
  }
 ]
};
</script>
