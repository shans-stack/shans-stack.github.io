   "b": [
    [
     "<p>Dynamo 是一个开源分布式推理框架。其前端接收应用请求，并把请求交给后端的推理工作进程。工作进程是能够运行预填充、解码或两个阶段的服务实例。</p>",
     "<p>预填充处理输入提示词，解码继续生成输出。推理引擎负责这两类模型计算，服务层负责选择执行实例和返回输出。</p>"

    [
     "<p>Dynamo is an open-source distributed inference framework. Its frontend receives application traffic and dispatches requests to inference workers. A worker is a service instance that can run prefill, decode, or both phases.</p>",

   "t": [
    "路由器维护候选实例的缓存与负载",
    "The Router Tracks Candidate Cache State and Load"

   "d": [
    "工作进程发布缓存变化，路由器据此更新前缀索引。",
    "Workers publish cache changes so the router can update its prefix index."
   ],
   "b": [
    [
     "<p>KV Cache 保存键和值，即模型注意力计算的中间状态。启用缓存事件时，工作进程报告 KV 块的建立和释放。路由器据此记录哪些实例持有可匹配的前缀。</p>",

    ],
    [
     "<p>The KV cache holds keys and values, the model’s intermediate attention state. With cache events enabled, workers report when KV blocks are created or released. The router tracks which instances hold matching prefixes.</p>",

    ]
   ]
  },
  {
   "t": [
    "相同负载下优先复用已有前缀",
    "Prefer Prefix Reuse When Workers Have Similar Load"
   ],
   "d": [
    "新请求与候选实例的缓存前缀匹配，可减少它需要从头计算的输入。",
    "A match with a candidate’s cached prefix reduces the input it must compute from scratch."
   ],
   "b": [
    [
     "<p>KV 感知路由是把可复用缓存纳入请求放置。路由器用请求开头的 token（模型处理的符号单位）查索引，估算每个候选实例可以复用多少已有前缀。</p>",
     "<p>当候选实例的负载相近时，拥有更多匹配前缀的实例通常有更少的新增预填充工作。请求送达后，实例读取已缓存的状态，再处理剩余输入。</p>"
    ],
    [
     "<p>KV-aware routing considers reusable cache when placing a request. The router looks up the leading tokens, or model input units, in the index to estimate how much prefix state each candidate can reuse.</p>",
     "<p>When candidates have similar load, the one with a longer matching prefix usually has less new prefill work. It reads its cached state and processes the remaining input after receiving the request.</p>"
    ]
   ]
  },
  {
   "t": [
    "繁忙实例的等待会改变路由选择",

    "Routing accounts for both cache overlap and active load, so a worker with cached state can lose the placement."
   ],
   "b": [
    [

     "<p>例如，已有匹配前缀的实例正处理大量活跃请求时，空闲程度更高的候选实例可能获得更低的综合成本，即使它需要计算更多输入。</p>"
    ],
    [
     "<p>A cache hit reduces new computation, while active work consumes compute and KV capacity. Dynamo includes both effects in its routing estimate so that similar requests need not all cluster on one worker.</p>",
     "<p>For example, if the worker with a matching prefix has many active requests, a less busy candidate may have a lower estimated cost even though it must process more prompt tokens.</p>"

   ]

  {
   "t": [

   "b": [
    [

     "<p>Dynamo 的公开架构将请求协调与 KV 数据传输分开。大块 KV 可在工作进程之间直接传输，前端负责协调请求和返回结果。</p>"
    ],
    [
     "<p>In a prefill/decode-disaggregated deployment, the serving layer chooses execution instances for the two phases separately. After prefill, the decode worker obtains the required KV and continuation metadata and takes over output generation.</p>",
     "<p>Dynamo’s public architecture separates request coordination from KV movement. Bulk KV can travel directly between workers while the frontend coordinates the request and returns results.</p>"
    ]
   ]
  },
  {
   "t": [
    "容量规划依据运行信号调整实例数",
    "Capacity Planning Adjusts Worker Counts from Runtime Signals"
   ],
   "d": [
    "规划器依据运行指标调整各阶段的目标实例数，路由器继续为单个请求选点。",
    "The planner adjusts phase-specific worker targets from metrics while the router continues placing individual requests."
   ],
   "b": [
    [
     "<p>实例数的调整面向一段时间内的负载。部署启用规划器后，它读取前端和工作进程提供的指标，并计算预填充和解码的目标实例数。</p>",
     "<p>部署控制器将目标转成实际实例的增删。新实例可用后加入候选集合，请求路由再利用更新后的容量和缓存位置。</p>"
    ],
    [
     "<p>Worker count changes address workload over a period of time. When enabled, the planner reads metrics from the frontend and workers and calculates target counts for prefill and decode.</p>",
     "<p>The deployment controller reconciles the targets with running workers. Ready instances enter the candidate set, and subsequent routing can use the updated capacity and cache locations.</p>"
    ]
   ]
  }
 ]
