window.SS_TOPIC_CFG={

  "steps": [
    {"t": ["从目录申请 GPU 容量", "Request Capacity From a Catalog"], "d": ["把 GPU 容量按需交付为裸金属、虚拟机或容器资源，供租户运行任务。", "Delivers GPU capacity on demand as bare metal, VMs or containers for tenants to run jobs."], "b": [["<p>GPU 即服务（GPUaaS）把运营方管理的 GPU 资源做成租户可申请的规格。目录可列出 GPU 类型或份额、网络和运行环境。控制平面检查权限、配额和可用容量，再按模板创建或分配资源。</p>"], ["<p>GPU as a Service (GPUaaS) exposes operator-managed GPU resources as offerings that tenants can request. A catalog can specify the GPU type or share, network, and runtime environment. The control plane checks permissions, quota, and available capacity before provisioning resources from a template.</p>"]]},
    {"t": ["交付整台服务器", "Deliver a Bare-Metal Server"], "d": ["裸金属交付把已装机并接通网络的物理服务器直接分配给租户。", "Bare-metal delivery assigns a provisioned and networked physical server directly to a tenant."], "b": [["<p>整机交付以物理节点为单位，租户在获分配的主机上运行任务。运营方仍管理硬件库存与节点生命周期。Rafay 的裸金属服务是一个实现例子，公开资料描述了按库存匹配服务器、租户自助分配和生命周期管理。</p>"], ["<p>The unit of delivery is a physical node. The tenant runs jobs on the assigned host, and the operator continues to manage hardware inventory and node lifecycle. Rafay’s bare-metal service is one implementation that documents matching requests to inventory, tenant self-service allocation, and lifecycle management.</p>"]]},
    {"t": ["交付虚拟机", "Deliver a Virtual Machine"], "d": ["虚拟机提供独立的来宾操作系统，并按规格附上 GPU 访问能力。", "A virtual machine provides its own guest OS and GPU access according to its profile."], "b": [["<p>虚拟机（VM）由虚拟化层在物理主机上创建。支持时，可用直通把物理 GPU 交给来宾系统，也可用虚拟 GPU（vGPU）向来宾系统呈现 GPU 资源。虚拟机规格和 GPU 交付方式共同决定租户取得的资源。</p>"], ["<p>A virtualization layer creates a virtual machine (VM) on a physical host. Where supported, passthrough can assign a physical GPU to the guest, while a virtual GPU (vGPU) can expose GPU resources as a virtual device. The VM profile and GPU assignment mode together define what the tenant receives.</p>"]]},
    {"t": ["交付容器运行环境", "Deliver a Container Environment"], "d": ["容器以镜像封装应用和依赖，由集群调度器把任务放在有相应 GPU 资源的节点。", "Containers package applications and dependencies in images. A cluster scheduler places each job on a node with suitable GPU resources."], "b": [["<p>在 Kubernetes 中，设备插件向 kubelet 注册并报告设备，kubelet 通过 API 上报节点资源。调度器根据已公布的资源匹配并绑定请求 GPU 的 Pod，节点侧随后分配设备并运行 Pod。平台可按配置提供整卡或共享资源。独立开发工作区和训练任务都可以建立在这种环境上。</p>"], ["<p>In Kubernetes, the device plugin registers with the kubelet and reports devices. The kubelet advertises node resources through the API. The scheduler uses the reported resources to match and bind a Pod requesting GPUs. The node then allocates the device and runs the Pod. The platform can provide whole GPUs or shared access, depending on its configuration. This can support development workspaces and training jobs.</p>"]]},
    {"t": ["区分计算资源与托管服务", "Distinguish Capacity From Managed Services"], "d": ["GPU 容量交付可记录资源占用时间，模型端点可按处理的 Token 计量。", "GPU capacity can be metered by allocation time, while model endpoints can be metered by the tokens they process."], "b": [["<p>GPUaaS 交付运行任务所需的资源。平台还可交付带 API 的推理环境，或直接交付含应用逻辑的托管 AI 应用。Rafay 的公开目录同时覆盖计算实例和托管服务。分配时长可归入计算用量，模型 API 的输入输出 Token 则可单独归入模型服务用量。</p>"], ["<p>GPUaaS delivers the resources needed to run jobs. A platform may also deliver an inference environment with an API or a managed AI application with its own application logic. Rafay’s public catalog material covers both compute instances and managed services. Allocation duration can be recorded as compute usage, while a model API’s input and output tokens can be tracked as service usage.</p>"]]}
  ]
};
