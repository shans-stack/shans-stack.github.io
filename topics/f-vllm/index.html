<script>
window.SS_TOPIC_CFG={
  anim: "f-vllm",
  ar: [900/350,380/420],
  steps: [
    {
      "t": [
        "从请求到逐步生成",
        "From Requests to Token Generation"
      ],
      "d": [
        "vLLM 对输入做预填充，再在解码中逐步生成 token。",
        "vLLM prefills the input and then generates tokens through successive decode steps."
      ],
      "b": [
        [
          "<p>预填充（prefill）处理输入 token 并生成 KV Cache，也就是注意力层为已处理 token 保留的键和值。解码（decode）利用已有键值生成后续 token，并不断追加新产生的键值。生成长度在请求开始时通常未知，缓存会随请求增长。</p>"
        ],
        [
          "<p>Prefill processes the input tokens and creates the KV cache, the keys and values that attention layers retain for processed tokens. Decode uses the existing keys and values to generate later tokens and appends new entries as it goes. The generation length is generally unknown at arrival, so the cache grows with the request.</p>"
        ]
      ]
    },
    {
      "t": [
        "按需分配显存块",
        "Allocating GPU Memory Blocks on Demand"
      ],
      "d": [
        "PagedAttention 将一条序列的 KV Cache 分成固定大小的块，物理块按需分配。",
        "PagedAttention divides a sequence’s KV cache into fixed-size blocks and allocates physical blocks on demand."
      ],
      "b": [
        [
          "<p>逻辑块按 token 顺序排列，每块容纳固定数量 token 的键值。分配器按本轮新增 token 需要的空间申请物理块，已有块的空位也可使用。逐 token 解码可能只追加一个块，预填充一轮可以分配多个块。不同序列可以从同一个显存池取得空闲块。</p>"
        ],
        [
          "<p>Logical blocks follow token order, and each holds keys and values for a fixed number of tokens. The allocator requests physical blocks for the new tokens scheduled in the current iteration and can use open slots in existing blocks. Token-by-token decoding may add one block, while a prefill iteration can allocate several. Multiple sequences can draw free blocks from the same GPU memory pool.</p>"
        ]
      ]
    },
    {
      "t": [
        "通过块表定位物理块",
        "Mapping Logical Blocks to Physical Blocks"
      ],
      "d": [
        "块表保留逻辑顺序，注意力按映射读取分散在显存中的物理块。",
        "A block table preserves logical order while attention uses it to find physical blocks across GPU memory."
      ],
      "b": [
        [
          "<p>新分配的物理块可以位于显存池的任意空闲位置。块表记录逻辑块到物理块的对应关系，例如逻辑顺序 A、B 对应池中的位置 2、1。PagedAttention 的分页设计允许注意力按逻辑顺序读取这些键值。</p>"
        ],
        [
          "<p>A newly allocated physical block can occupy any free slot in the GPU memory pool. The block table maps the logical order A, B to physical slots such as 2, 1. The PagedAttention design lets attention read those keys and values in logical order.</p>"
        ]
      ]
    },
    {
      "t": [
        "复用完整的前缀块",
        "Reusing Full Prefix Blocks"
      ],
      "d": [
        "自动前缀缓存用当前块的 token 和前序块的哈希来识别可复用的完整块。",
        "Automatic prefix caching identifies reusable full blocks from their tokens and the preceding block’s hash."
      ],
      "b": [
        [
          "<p>哈希是由输入计算出的标识。vLLM 为块生成标识时纳入前序块哈希、当前块 token 及与缓存身份相关的其他信息。匹配的完整前缀块可以被新请求直接引用，未命中的输入仍要计算，新输出仍由解码生成。</p>"
        ],
        [
          "<p>A hash is an identifier computed from input. vLLM includes the parent block’s hash, the current tokens, and additional cache identity information when constructing a block key. A new request can reference matching full prefix blocks. Uncached input still needs computation, and decode still generates new output.</p>"
        ]
      ]
    },
    {
      "t": [
        "调度解码与分块预填充",
        "Scheduling Decode and Chunked Prefill"
      ],
      "d": [
        "在分块预填充开启时，vLLM V1 先安排待解码任务，再用剩余 token 预算安排预填充。",
        "With chunked prefill enabled, vLLM V1 schedules pending decode work before assigning the remaining token budget to prefill."
      ],
      "b": [
        [
          "<p>token 预算是一次调度迭代可处理的 token 数上限。长输入的预填充超过剩余预算时，调度器先安排能容纳的一段，其余留到后续迭代。块表与前缀缓存决定键值的存放和复用，调度器决定本轮 GPU 执行哪些工作。</p>"
        ],
        [
          "<p>The token budget limits how many tokens a scheduling iteration can process. If a long prefill exceeds the remaining budget, the scheduler takes the chunk that fits and leaves the rest for a later iteration. The block table and prefix cache govern KV placement and reuse. The scheduler decides which work runs on the GPU this iteration.</p>"
        ]
      ]
    }
  ]
};
</script>
