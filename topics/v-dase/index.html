<script>
window.SS_TOPIC_CFG={
 "anim": "v-dase",
 "ar": [960/520,480/500],
 "steps": [
  {
   "t": [
    "共享无架构中的节点本地存储",
    "Node-Local Storage in a Shared-Nothing Architecture"
   ],
   "d": [
    "每台节点管理自己的盘。不同节点维护缓存副本时，需要协调副本的一致性。",
    "Each node manages its own drives. Nodes that keep cached copies need to coordinate cache coherence."
   ],
   "b": [
    [
     "<p>在共享无（shared-nothing）架构中，每台节点运行存储软件并管理本地的一组盘。节点失效可能同时中断对这组盘的访问。</p>",
     "<p>多个节点同时服务同一数据时，锁、缓存一致性和元数据同步可能产生节点间的协调流量。</p>"
    ],
    [
     "<p>In a shared-nothing architecture, each node runs storage software and manages a local set of drives. A node failure can cut off access to that set at once.</p>",
     "<p>When several nodes serve the same data, locks, cache coherence, and metadata synchronization can generate coordination traffic between nodes.</p>"
    ]
   ]
  },
  {
   "t": [
    "CNode 计算与 DBox 存储分离",
    "Separation of CNode Compute and DBox Storage"
   ],
   "d": [
    "在 CNode/DBox 部署中，CNode 执行存储逻辑，DBox 提供持久介质。",
    "In a CNode/DBox deployment, CNodes execute storage logic and DBoxes provide persistent media."
   ],
   "b": [
    [
     "<p>DASE 是 Disaggregated Shared Everything 的缩写。在 CNode/DBox 部署中，CNode 执行协议处理、纠删码和数据缩减，DBox 内的 DNode 负责将盘接入 NVMe-oF 网络。各 CNode 启动时经 NVMe-oF 接入共享 SSD。NVMe-oF 是通过网络访问 NVMe 设备的协议。</p>",
     "<p>Shared Everything 指所有 CNode 可直接访问同一套数据、元数据与持久状态。存储级内存（SCM）用于持久写缓冲和元数据，大容量闪存用于长期存储。纠删码条带也可跨多个机箱的共享 SSD 分布，见<a href=\"../v-wec/\">宽条带与本地可解码纠删码</a>。</p>"
    ],
    [
     "<p>DASE stands for Disaggregated Shared Everything. In a CNode/DBox deployment, CNodes handle protocols, erasure coding, and data reduction, and DNodes in the DBoxes attach the drives to the NVMe-oF fabric. Each CNode connects to the shared SSDs at boot using NVMe-oF, a protocol for accessing NVMe devices over a fabric.</p>",
     "<p>Shared Everything means that all CNodes can access the same data, metadata, and durable state directly. Storage-class memory (SCM) holds durable write buffers and metadata, and high-capacity flash holds long-term data. Erasure-coded stripes can span shared SSDs in multiple enclosures. See <a href=\"../v-wec/\">Wide Stripes and Locally Decodable Codes</a>.</p>"
    ]
   ]
  },
  {
   "t": [
    "接到读取请求的 CNode 直接访问盘",
    "The Receiving CNode Accesses the Drives Directly"
   ],
   "d": [
    "CNode 先读共享元数据，再按位置从共享 SSD 读取数据。",
    "The CNode reads shared metadata, then fetches the data from the shared SSDs."
   ],
   "s": [
    "共享 SSD 访问",
    "Shared SSD Access"
   ],
   "b": [
    [
     "<p>白皮书描述的常规读取路径由接到请求的 CNode 完成。它从共享 SCM 读取持久元数据，再从大容量闪存或写缓冲读取数据，最后返回客户端。这个读取流程无需把请求转发给另一台 CNode。常规读取直接访问共享介质，无需在 CNode 之间维持数据或持久元数据缓存的一致性。</p>"
    ],
    [
     "<p>On the ordinary read path described in the white paper, the CNode receiving the request reads persistent metadata from shared SCM. It fetches the data from high-capacity flash or the write buffer and replies to the client without forwarding the request to another CNode. Routine reads access the shared media directly and require no cache-coherence traffic for data or persistent metadata between CNodes.</p>"
    ]
   ]
  },
  {
   "t": [
    "一致性哈希定位 V-Tree 根",
    "Consistent Hashing Locates the V-Tree Root"
   ],
   "d": [
    "CNode 对元素的唯一标识做哈希，找到持有树根的 DBox。",
    "A CNode hashes the element’s unique handle to locate a DBox that holds its root."
   ],
   "s": [
    "找元数据",
    "Find metadata"
   ],
   "b": [
    [
     "<p>DataStore 用 V-Tree 保存文件、对象、目录、表或卷的元数据。CNode 启动时把一致性哈希表加载到内存。哈希表用元素的唯一标识定位树根，随后 CNode 沿树读取持久元数据。</p>",
     "<p>白皮书描述的布局将每个哈希区间分配给两到三台 DBox。V-Tree 的宽扇出把查找所需的网络往返限制在最多七跳。这些数量是白皮书描述的布局与查找上限（截至 2026-11-23）。</p>"
    ],
    [
     "<p>DataStore uses V-Trees for the metadata of files, objects, directories, tables, and volumes. At boot, a CNode loads the consistent hash table into memory. It uses the element’s unique handle to locate the root and traverses the tree to read persistent metadata.</p>",
     "<p>In the white paper’s layout, each hash range is assigned to two or three DBoxes. A V-Tree’s wide fan-out limits the round trips needed for a lookup to at most seven hops. These figures describe the layout and lookup bound in the white paper (as of 2026-11-23).</p>"
    ]
   ]
  },
  {
   "t": [
    "元素锁协调同一数据范围的写入",
    "Element Locks Coordinate Writes to the Same Range"
   ],
   "d": [
    "竞争同一范围的 CNode 根据元素锁中记录的持有者 ID 联系对方。",
    "A contending CNode uses the owner ID in the element lock to contact its holder."
   ],
   "s": [
    "锁",
    "Locks"
   ],
   "b": [
    [
     "<p>元数据读取无需加锁。多个写入者操作同一数据范围时，元素锁协调并行写入。发现锁已被持有时，CNode 联系持有者确认状态，无需中心锁管理器。</p>",
     "<p>相关 DBox 的 DRAM 保存元素锁的只读副本。白皮书另述，CNode 通过对 DBox Fabric Module 内存执行原子 RDMA 操作来核验锁状态。</p>"
    ],
    [
     "<p>Metadata reads are lockless. Element locks coordinate concurrent writers targeting the same data range. A contending CNode contacts the recorded owner directly without relying on a central lock manager.</p>",
     "<p>The relevant DBox keeps a read-only copy of the element lock in DRAM. The white paper also describes the CNode using an atomic RDMA operation against the DBox fabric module’s memory to verify lock state.</p>"
    ]
   ]
  },
  {
   "t": [
    "写入确认与事务令牌",
    "Write Acknowledgment and Transaction Tokens"
   ],
   "d": [
    "数据写入受保护的共享 SCM 并提交元数据后才确认。事务令牌记录未完成更新的状态。",
    "The CNode acknowledges after persisting data in protected shared SCM and committing metadata. Transaction tokens track in-flight updates."
   ],
   "b": [
    [
     "<p>写入数据在受保护的共享 SCM 中持久化，随后提交元数据，再向客户端确认（ACK）。计算节点不持有唯一的持久状态。更新 V-Tree 时，事务令牌记录唯一 ID、所属 CNode 和事务状态。</p>",
     "<p>其他 CNode 依据令牌状态选择一致的元数据版本。如果未完成事务的所属 CNode 无响应，访问方可读取先前的版本，也可取消事务并移除该令牌关联的未提交更新。</p>"
    ],
    [
     "<p>The CNode persists write data in protected shared SCM, commits metadata, and then acknowledges the client. Durable state is held on shared media. For a V-Tree update, a transaction token records a unique ID, the owning CNode, and the transaction state.</p>",
     "<p>Other CNodes choose a consistent metadata version based on the token. If the owner of an in-flight transaction stops responding, another CNode can read the previous version or cancel the transaction and remove uncommitted updates associated with the token.</p>"
    ]
   ]
  },
  {
   "t": [
    "CNode 故障与存储访问连续性",
    "CNode Failure and Continued Storage Access"
   ],
   "d": [
    "一台 CNode 失效后，仍在运行的 CNode 可从共享介质访问数据。",
    "After a CNode fails, surviving CNodes can access data on shared media."
   ],
   "b": [
    [
     "<p>CNode 故障会减少可用处理能力。存活的 CNode 可采用共享 SSD 上的数据和状态处理转移过来的请求。</p>",
     "<p>客户端地址和请求的接管见 CNode。共享介质侧的访问高可用由 DBox 提供。</p>"
    ],
    [
     "<p>A CNode failure reduces available processing capacity. Surviving CNodes use the data and state on shared SSDs to serve redirected requests.</p>",
     "<p>CNode covers client address and request takeover. DBox provides high availability on the shared-media side.</p>"
    ]
   ]
  }
 ]
};
</script>
