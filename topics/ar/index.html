     "<p>等价多路径（ECMP）允许交换机为同一目的地使用多个路由代价相同的下一跳。按流哈希利用包头字段为一条流选取下一跳，通常能使该流在拓扑稳定时沿同一路径转发。不同的流也可能得到相同的选择，导致一个出口排队，另一条路径仍有余量。</p>"
    ],
    [
     "<p>Equal-cost multipath (ECMP) allows multiple next hops with the same routing cost for a destination. Flow hashing uses packet header fields to select a next hop for a flow, generally keeping it on one path while topology is stable. Different flows can hash to the same egress port, creating a queue even when another path has spare capacity.</p>"
    ]
   ]
  },
  {
   "t": [
    "按出口状态动态选路",
    "Dynamic Selection by Egress State"
   ],
   "d": [
    "自适应路由可依据本地队列或端口利用率，选择负载较低的合格出口。",
    "Adaptive routing can use local queue occupancy or port utilization to choose a less loaded eligible egress port."
   ],
   "b": [
    [
     "<p>队列占用反映当前有多少数据等待从端口发出。自适应路由在既有的合格下一跳中利用这类信号做转发选择。图中的交换机把后续符合条件的数据导向另一条路径，已经进入队列的数据仍沿原路径发送。本地采样只能反映所观察到的端口状态。</p>"
    ],
    [
     "<p>Queue occupancy reflects how much data is waiting to leave a port. Adaptive routing uses signals like this to select among eligible next hops. In the diagram the switch sends later eligible traffic over the other path, while traffic already queued continues on its original path. Local measurements describe the state of the ports being observed.</p>"
    ]
   ]
  },
  {
   "t": [
    "逐包分流与接收顺序",
    "Per-Packet Forwarding and Arrival Order"

   "d": [
    "同一条流的包如果走不同路径，后发的包可能先到。",
    "When packets from one flow take different paths, a later packet can arrive first."
   ],
   "b": [
    [
     "<p>逐包选路允许相邻分组使用不同出口。路径时延和排队时间的差异可能改变到达顺序，因此这种模式要求端到端传输支持乱序到达。例如 OCP 的 MRC 规范要求接收端在跟踪窗口内按包序号记录已收到的数据，并允许直接放置符合条件的数据。</p>"
    ],
    [
     "<p>Per-packet selection allows consecutive packets to leave through different ports. Differences in path delay and queuing can change arrival order, so this mode requires transport support for out-of-order arrivals. The OCP MRC specification, for example, has the receiver track received packets by sequence number within a window and allows direct placement for eligible data.</p>"
    ]

    "Ethernet ECMP and InfiniBand adaptive routing groups define eligible egress ports in different ways."
   ],
   "b": [
    [
     "<p>以运行 Cumulus Linux 的以太网实现为例，交换机可对符合条件的 IP 包在 ECMP 成员端口间逐包选择。NVIDIA 的 InfiniBand 部署文档给出另一种实现，子网管理器为目的地配置自适应路由组，交换机从组内出口转发。适用的流量和候选范围由具体实现决定。</p>"
    ],
    [
     "<p>In the Ethernet implementation documented for Cumulus Linux, a switch can select an ECMP member port for each eligible IP packet. NVIDIA’s InfiniBand deployment guide describes adaptive routing groups set up by the subnet manager for destinations. The switch selects an output port from the group. Eligibility and the set of candidate ports depend on the implementation.</p>"
    ]

   ],
   "d": [
    "当多条路径共享同一个拥堵出口时，换路径之外还需要拥塞控制。",
    "When multiple paths share a congested egress port, congestion control is needed in addition to path selection."
   ],
   "b": [
    [
     "<p>图中两条路径在接入目的节点前汇合，末段出口成为共同瓶颈。换上游路径仍会经过这个出口。拥塞控制通过反馈调节发送端的注入速率。例如显式拥塞通知（ECN）可让设备标记拥塞，端点据传输机制处理反馈并调整速率。</p>"

    ]

 ]
