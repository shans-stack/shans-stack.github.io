    [
     "<p>In the Lustre architecture used by EXAScaler, an object storage server (OSS) handles client reads and writes of file data. An object storage target (OST) is a persistent volume that holds file data objects. One OSS can serve multiple OSTs.</p>"

   ],
   "b": [

     "<p>这里的对象是 Lustre 内部保存文件字节的单元。一个文件可对应一个或多个对象。当布局包含多个对象时，元数据服务器（Metadata Server，MDS）提供的布局使客户端能够确定每段数据的目标。</p>"
    ],
    [
     "<p>An object is a unit Lustre uses internally to hold file bytes. A file may use one or several objects. When the layout includes several objects, the layout supplied by the metadata server (MDS) lets the client identify the target for each range of data.</p>"

   ]

   ],

    ],
    [
     "<p>Stripe size is the amount of data assigned before the layout advances to the next object. In an illustrative layout with two objects, the first and third chunks go to object A, and the second and fourth go to object B. Each object resides on its corresponding OST.</p>"
