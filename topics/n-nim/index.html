<script>
window.SS_TOPIC_CFG={
  "anim": "n-nim",
  "ar": [
    3.3076923076923075,
    0.8780487804878049
  ],
  "steps": [
    {
      "t": [
        "推理服务的交付单元",
        "The Inference Service as a Deployment Unit"
      ],
      "d": [
        "NIM 将推理引擎、运行依赖和模型交付配置组织成可部署的微服务。",
        "NIM packages the inference engine, runtime dependencies, and model configuration as a deployable microservice."
      ],
      "b": [
        [
          "<p>推理引擎负责加载模型并在 GPU 上执行计算。容器镜像将引擎和运行依赖一起交付，模型权重是训练得到的参数，可在启动时按配置获取。应用通过 API（应用程序编程接口）发送请求，推理服务管理模型及其运行环境。</p>"
        ],
        [
          "<p>The inference engine loads the model and runs its computations on the GPU. The container image packages the engine and runtime dependencies. Model weights, the parameters learned during training, can be fetched at startup according to the deployment configuration. The application sends requests through an API, while the service manages the model and its runtime.</p>"
        ]
      ]
    },
    {
      "t": [
        "模型配置与 GPU 匹配",
        "Matching a Model Profile to the GPU"
      ],
      "d": [
        "NIM 可根据检测到的 GPU 选择模型配置，也支持显式指定配置。",
        "NIM can select a profile for the detected GPUs or use an explicitly chosen profile."
      ],
      "b": [
        [
          "<p>以 NIM for LLM and VLM 为例，模型配置（profile）描述特定模型的运行方式，包括目标 GPU、数值精度和并行方式。精度决定数值采用何种格式，并行方式决定计算如何分配到多颗 GPU。</p>",
          "<p>同一模型可能有多个配置。可用组合取决于模型、镜像版本和硬件，应用请求仍可走同一类接口。</p>"
        ],
        [
          "<p>In NIM for LLM and VLM, a model profile specifies how a particular model runs, including its GPU target, numeric precision, and parallelism. Precision determines the number format. Parallelism determines how computation is distributed across GPUs.</p>",
          "<p>A model can have several profiles. Available combinations depend on the model, image version, and hardware, while the application can continue to use the same API format.</p>"
        ]
      ]
    },
    {
      "t": [
        "权重加载与就绪检查",
        "Weight Loading and Readiness Checks"
      ],
      "d": [
        "容器启动后先报告存活，后端加载权重并通过检查后才报告就绪。",
        "The container can report liveness at startup and becomes ready once the backend loads the weights and passes its checks."
      ],
      "b": [
        [
          "<p>在这一实现中，容器内的代理先开始监听。引擎需要的模型文件若已在本地缓存中，启动时可直接读取，否则先获取文件。引擎随后将模型加载到运行环境。</p>",
          "<p>存活检查表示服务进程在运行。就绪检查确认后端已能接收请求，编排系统据此决定何时分发推理流量。</p>"
        ],
        [
          "<p>In this implementation, a proxy inside the container starts listening first. If the model files are already cached locally, the engine can read them directly. Otherwise, the files are fetched before the engine loads the model.</p>",
          "<p>Liveness indicates that the service process is running. Readiness confirms that the backend can receive requests, giving the orchestrator a signal for when to route inference traffic.</p>"
        ]
      ]
    },
    {
      "t": [
        "从 API 请求到模型输出",
        "From API Request to Model Output"
      ],
      "d": [
        "容器内的代理接收请求，并交给推理引擎执行 GPU 计算。",
        "The proxy inside the container accepts requests and forwards them to the inference engine for GPU execution."
      ],
      "b": [
        [
          "<p>以支持对话的语言模型为例，应用向 OpenAI 兼容的对话接口提交消息。代理转发请求，推理引擎运行模型，生成的文本经同一个服务接口返回。</p>",
          "<p>请求格式定义应用与服务之间的交接方式。模型的输入形式和生成能力仍由具体模型及服务配置决定。</p>"
        ],
        [
          "<p>For a language model that supports chat, the application submits messages to an OpenAI-compatible chat endpoint. The proxy forwards the request, the inference engine runs the model, and the generated text returns through the same service interface.</p>",
          "<p>The request format defines the handoff between the application and the service. The selected model and service configuration determine which inputs and generation capabilities are available.</p>"
        ]
      ]
    },
    {
      "t": [
        "托管试用与自行部署",
        "Hosted and Self-Hosted Endpoints"
      ],
      "d": [
        "同一种推理 API 可由托管端点提供，也可由自行部署的 NIM 提供。",
        "The same kind of inference API can be exposed by a hosted endpoint or a self-hosted NIM."
      ],
      "b": [
        [
          "<p>托管端点由服务提供方运行。自行部署时，NIM 运行在部署方管理的基础设施上，由部署方配置镜像、GPU 资源和服务地址。</p>",
          "<p>对于接口和模型均兼容的部署，应用可保留同一种请求格式。服务地址、认证和可用模型由目标部署决定。</p>"
        ],
        [
          "<p>The service provider operates the hosted endpoint. In a self-hosted deployment, the operator configures the image, GPU resources, and service address on infrastructure under their control.</p>",
          "<p>Deployments with matching APIs and compatible models can use the same request format. The target deployment determines the endpoint address, authentication, and available models.</p>"
        ]
      ]
    }
  ]
};
</script>
