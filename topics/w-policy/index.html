<script>
window.SS_TOPIC_CFG={
  anim: "w-policy",
  ar: [848/324, 370/430],
  steps: [
    {
      t: ["将策略关联到文件系统", "Attach a Policy to Filesystems"],
      d: ["一条策略可管理多个关联文件系统的快照计划和保留设置。", "One policy can apply snapshot schedules and retention settings to multiple attached filesystems."],
      b: [["\u003cp>快照策略是一组自动创建和管理快照的规则。规则在策略中配置，并作用于与该策略关联的文件系统。文件系统仍各自生成自己的恢复点。\u003c/p>"], ["\u003cp>A snapshot policy is a set of rules for creating and managing snapshots automatically. The rules are defined in the policy and apply to its attached filesystems. Each filesystem still gets its own recovery points.\u003c/p>"]]
    },
    {
      t: ["按计划生成恢复点", "Create Recovery Points on a Schedule"],
      d: ["小时、日、周、月或自定义周期决定何时创建快照。", "Hourly, daily, weekly, monthly, or periodic schedules determine when snapshots are created."],
      b: [["\u003cp>调度决定何时捕获文件系统状态。小时和日计划可提供较密集的时间点，周和月计划可覆盖较长的历史范围。自定义周期可以在指定的时间窗口内按间隔安排快照。\u003c/p>"], ["\u003cp>Schedules determine when filesystem state is captured. Hourly and daily schedules can provide closely spaced recovery points, while weekly and monthly schedules can cover a longer history. A periodic schedule uses a custom interval within a defined time window.\u003c/p>"]]
    },
    {
      t: ["处理同一时刻的重叠计划", "Resolve Overlapping Schedules"],
      d: ["同一文件系统的计划重叠时，只有优先级最高的计划创建快照。", "When schedules overlap on one filesystem, only the highest-priority schedule creates a snapshot."],
      b: [["\u003cp>WEKA 按月、周、日、小时、自定义周期的顺序确定优先级。例如周计划与日计划在同一时刻触发时，只创建周快照，避免在同一文件系统上为一个时间点生成重复快照。\u003c/p>"], ["\u003cp>WEKA gives priority to monthly schedules, then weekly, daily, hourly, and periodic schedules. If a weekly and a daily schedule coincide, only the weekly snapshot is created. This avoids duplicate recovery points for the same filesystem and time.\u003c/p>"]]
    },
    {
      t: ["按保留数量轮转", "Rotate Snapshots by Retention Count"],
      d: ["快照超过计划的保留数量时，较早的策略快照会轮转退出。", "When the schedule exceeds its retention count, older policy snapshots rotate out."],
      b: [["\u003cp>保留数量决定每个计划留下多少个恢复点。示意中保留两个日快照，新快照加入后，最早的日快照退出。停用策略后若下调保留设置，关联文件系统的已有快照仍可能被删除。\u003c/p>"], ["\u003cp>The retention count determines how many recovery points a schedule keeps. In the example, the policy retains two daily snapshots. When the next arrives, the oldest rotates out. A disabled policy can still delete existing snapshots on attached filesystems if retention is reduced.\u003c/p>"]]
    },
    {
      t: ["将上传纳入计划", "Add Uploads to a Schedule"],
      d: ["计划可将生成的快照上传到文件系统已关联的对象存储。", "A schedule can upload its snapshots to object storage already attached to the filesystem."],
      b: [["\u003cp>对象存储以桶组织数据。计划可指定本地、远端或两类对象存储目标。上传由后台任务处理，恢复点的创建时间与对象端副本的完成时间是两个阶段。\u003c/p>"], ["\u003cp>Object stores organize data in buckets. A schedule can target a local object store, a remote object store, or both. A background task handles the upload, so recovery-point creation and completion of the copy in object storage are separate stages.\u003c/p>"]]
    }
  ]
};
</script>
