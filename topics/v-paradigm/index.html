  steps:[
    {"s": ["两件事", "Two questions"], "t": ["盘的访问范围与持久状态", "Drive access and persistent state"], "d": ["这组架构示例按设备访问范围和持久状态的位置来读。", "The examples show who can reach storage devices and where persistent state lives."], "b": [["<p>存储架构可以从两个角度描述：哪些控制器或节点能直接访问存储设备，以及条带位置等持久元数据由哪些组件保存。这里用共享介质、无共享、分设元数据服务的并行文件系统以及 VAST DASE 举例。</p>"], ["<p>A storage architecture defines which controllers or nodes can reach storage devices directly and which components hold persistent metadata such as stripe locations. The examples cover shared media, shared nothing, a parallel file system with a separate metadata service, and VAST DASE.</p>"]]},
    {"s": ["共享介质", "Shared media"], "t": ["共享介质：一对控制器共用盘组", "Shared media: a controller pair shares a drive set"], "d": ["控制器对连接同一组盘，图中展示其中一台故障时的接管。", "A controller pair connects to one drive set. The diagram shows takeover after a controller failure."], "b": [["<p>在双控制器高可用配置中，两台控制器都能访问同一组存储设备。图示中，备用控制器在活动控制器故障后接管访问。</p>"], ["<p>Both controllers in this high-availability configuration can access the same storage devices. The diagram shows the standby controller taking over after the active controller fails.</p>"]]},
    {"s": ["无共享", "Shared nothing"], "t": ["无共享：节点管理本地盘", "Shared nothing: nodes manage local drives"], "d": ["每台节点直接访问自己的盘。图中展示一次跨节点转发。", "Each node directly reaches its own drives. The diagram shows a request forwarded between nodes."], "b": [["<p>无共享集群将存储处理和本地盘放在同一个节点内。数据可分布在多个节点上，图中由请求入口将操作转给保存目标数据的节点。</p>", "<p>节点故障会使其本地盘失去访问路径，集群可以通过跨节点纠删码保护数据。</p>"], ["<p>A shared-nothing cluster places storage processing and local drives in the same node. Data can span nodes. In the diagram, the receiving node forwards the operation to the node that holds the requested data.</p>", "<p>A node failure makes its local drives inaccessible. The cluster can protect data across nodes with erasure coding.</p>"]]},
    {"s": ["并行文件系统", "Parallel file system"], "t": ["并行文件系统示例：布局与数据分路", "Parallel file system example: separate layout and data paths"], "d": ["客户端取得条带位置后，直接并行访问承载文件内容的存储目标。", "The client obtains the stripe locations, then accesses the file’s storage targets in parallel."], "b": [["<p>在图示架构中，元数据服务提供各条带对应的存储目标。专用客户端可据此同时向多个数据服务器发送 I/O。</p>"], ["<p>In the architecture shown, the metadata service supplies a layout that maps file stripes to storage targets. The file system client uses that layout to send I/O to several data servers concurrently.</p>"]]},

    button.lang = en ? 'en' : nativeLang;
  }
});
