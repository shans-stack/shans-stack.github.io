    ],
    [
     "<p>The Container Storage Interface (CSI) defines how orchestrators such as Kubernetes call storage drivers. The WEKA plugin connects the control plane and worker nodes to WEKA storage so that Pods, the basic execution units for containers, can use external persistent storage.</p>"

    [

    "创建后端卷并绑定",

    ],
    [
     "<p>A PersistentVolume (PV) represents backing storage in Kubernetes. For example, the WEKA plugin provisions a directory in the selected filesystem for a directory-backed volume, and Kubernetes binds the corresponding PV to the PVC. With static provisioning, a predefined PV can reference an existing directory.</p>"
