<script>
/* 七步：标题、一句话说明（演示模式也用）、文档模式正文。正文只取自公开的 DataEnclave 白皮书与作者学习笔记里讲机密计算、远程证明的页面，不写发布状态和任何数字。 */
window.SS_TOPIC_CFG={
 "anim": "v-enclave",
 "ar": [960/548,480/944],
 "steps": [
  {
   "t": [
    "两边都不肯交出东西",
    "Neither Side Will Hand Anything Over"
   ],
   "d": [
    "企业的数据不能出门，模型厂商的权重不肯交出去，机房的运营者默认还能看内存，三方僵持不下。",
    "The enterprise's data cannot leave, the model vendor will not hand over its weights, and the operator running the machines can read memory by default. All three are stuck."
   ],
   "b": [
    [
     "<p>最有价值的 AI 应用，往往要把两样分属不同主人的东西放在一起：企业的机密业务数据，和闭源前沿模型的权重。银行、医院、政府部门的数据受监管，不能送到别人的机房；模型厂商的权重是它最值钱的资产，也不肯部署到自己管不着的环境里。还有第三方：真正运行这些服务器的运营者，按默认设置能看到运行中的内存。</p>",
     "<p>结果是谁都不肯先让步。企业只能在自家跑能力弱一些的开源模型，模型厂商只做不敏感的生意，最需要前沿模型的应用一直建不起来。DataEnclave 的目标，是在企业自己的环境里提供一个外部无法窥探的隔离运行环境，让运营者成为无需被信任的一方。</p>"
    ],
    [
     "<p>The most valuable AI applications often need to bring together two things with different owners: an enterprise's confidential business data and the weights of a closed frontier model. Data at banks, hospitals and government agencies is regulated and cannot be sent to someone else's data center. A model vendor's weights are its most valuable asset, and it will not deploy them where it has no control. There is also a third party: the operator who runs the servers can, by default, see memory while workloads run.</p>",
     "<p>So nobody moves first. Enterprises run weaker open-source models in-house, model vendors take only non-sensitive business, and the applications that most need frontier models never get built. DataEnclave provides, inside the enterprise's own environment, an isolated runtime that no one can see into from outside, so the operator becomes a party that does not need to be trusted.</p>"
    ]
   ]
  },
  {
   "t": [
    "缺的是「使用中」这一段",
    "The Missing Piece Is Data in Use"
   ],
   "d": [
    "加密管得住存着的数据和路上的数据，可一跑起来，数据和权重在内存里都是明文，主机管理员能复制走。",
    "Encryption covers data at rest and in transit, but once a job runs, data and weights sit in memory as plaintext, and a host admin can copy them."
   ],
   "b": [
    [
     "<p>常见的加密只覆盖两段：静态加密（at rest，数据存在盘上时）和传输加密（in transit，数据在网络上走时）。程序真正处理数据时，数据和模型权重必须解密后放进内存，CPU 和 GPU 才能算。这时它们就是明文。</p>",
     "<p>普通容器（container，一种轻量的程序隔离方式）只隔开了程序和程序，挡不住主机本身。拥有主机管理员权限的人，或者被攻破的虚拟化层，可以把容器的内存读出来，拿走凭据、数据和权重，而原来的程序照常运行，察觉不到。直接在密文上计算的技术称为同态加密，目前太慢、太占显存，跑不动 AI 负载。所以要补的，是「使用中」这一段。</p>"
    ],
    [
     "<p>Common encryption covers two stages: at rest, while data sits on disk, and in transit, while it moves over the network. When a program processes data, the data and the model weights must be decrypted into memory so the CPU and GPU can compute on them. At that point they are plaintext.</p>",
     "<p>An ordinary container (a lightweight way to isolate programs) only separates programs from each other; it does not stop the host itself. Someone with host administrator rights, or a compromised virtualization layer, can read a container's memory and take credentials, data and weights while the original program keeps running unaware. Computing directly on encrypted data is called homomorphic encryption; today it is too slow and uses too much GPU memory for AI workloads. So the gap to close is data in use.</p>"
    ]
   ]
  },
  {
   "t": [
    "机密计算：把内存锁在硬件里",
    "Confidential Computing: Memory Locked in Hardware"
   ],
   "d": [
    "同一个容器放进机密环境（CVM），内存由硬件加密隔离，管理员同样的抓取拿不到内容。",
    "Put the same container in a confidential VM (CVM). Hardware encrypts and isolates its memory, so the admin's same grab gets nothing."
   ],
   "b": [
    [
     "<p>机密计算（Confidential Computing）是用硬件保护「正在使用的数据」的一类技术。CPU 里有一块可信执行环境（TEE），例如 AMD SEV-SNP 和 Intel TDX，它把这块区域的内存加密，主机读到的只是密文。较新的 NVIDIA GPU 也有机密计算模式，GPU 显存以及 CPU 和 GPU 之间的通道同样受硬件保护。光保护 CPU 不够，因为 AI 负载的大头在 GPU 上。</p>",
     "<p>DataEnclave 给每个工作负载起一台机密虚拟机（CVM，Confidential VM），把 CPU 和 GPU 一起圈进同一个保护边界。CVM 里还有一份由数据主人定的策略，规定主机能在里面做什么，例如不允许主机进去执行命令。同一个抓内存的操作，换成 CVM 就拿不到内容。</p>"
    ],
    [
     "<p>Confidential computing is a family of technologies that use hardware to protect data in use. The CPU provides a trusted execution environment (TEE), such as AMD SEV-SNP or Intel TDX, which encrypts that region's memory so the host only ever reads ciphertext. Newer NVIDIA GPUs also have a confidential computing mode that protects GPU memory and the channel between CPU and GPU in hardware. Protecting only the CPU is not enough, because most of an AI workload runs on the GPU.</p>",
     "<p>DataEnclave starts a confidential virtual machine (CVM, Confidential VM) for each workload and puts the CPU and GPU inside the same protection boundary. The CVM also carries a policy set by the data owner that defines what the host may do inside it, for example that the host may not run commands there. The same memory grab that works on a container gets nothing from a CVM.</p>"
    ]
   ]
  },
  {
   "t": [
    "先验证，后给钥匙",
    "Verify First, Then Hand over Keys"
   ],
   "d": [
    "CVM 空手启动，硬件签一份报告送去模型厂商核验，通过了钥匙才进来，权重只在受保护的内存里解密。",
    "The CVM boots without keys. Hardware signs a report for the model vendor to check; only if it passes do keys arrive, and the weights are decrypted only in protected memory."
   ],
   "b": [
    [
     "<p>仅有隔离环境还不够，模型厂商需要先确认环境确实受保护。CVM 启动时手里没有任何钥匙。CPU 和 GPU 的硬件出一份报告，写明硬件和固件版本、要跑的软件和策略，并用芯片厂商认证过的密钥签名，这一步叫远程证明（attestation）。CVM 主动把报告发给模型厂商自己的证明服务器，只需要出站连接，模型厂商不用接进客户的网络。</p>",
     "<p>证明服务器按模型厂商登记的标准核对：签名是真的，配置和登记的一致，才从模型厂商自己的密钥管理系统（KMS）取出钥匙，用只有这台 CVM 能解开的方式送回去。镜像和权重各有各的钥匙。加密的镜像和权重平时存在客户的 VAST 集群上，集群只存密文；拿到钥匙后，权重直接解密进 CVM 的受保护内存。VAST 和运营者都拿不到这些钥匙。这就是「先验证，后解密」（verify-before-decrypt）。</p>"
    ],
    [
     "<p>Isolation alone is not enough; the model vendor first needs to confirm the environment really is protected. The CVM starts without any keys. The CPU and GPU hardware produce a report stating the hardware and firmware versions and the software and policy to run, signed with a key certified by the chip maker. This step is called remote attestation. The CVM sends the report to the model vendor's own attestation server. Only an outbound connection is needed; the model vendor does not have to connect into the customer's network.</p>",
     "<p>The attestation server checks the report against what the model vendor registered: the signature must be genuine and the configuration must match. Only then does it fetch keys from the model vendor's own key management system (KMS) and send them back in a form only this CVM can unwrap. The image and the weights each have their own key. The encrypted image and weights normally live on the customer's VAST cluster, which stores only ciphertext; once the key arrives, the weights are decrypted straight into the CVM's protected memory. Neither VAST nor the operator ever holds these keys. This is verify-before-decrypt.</p>"
    ]
   ]
  },
  {
   "t": [
    "策略被改，钥匙就不放",
    "Change the Policy and No Keys Are Released"
   ],
   "d": [
    "如果有人在主机上改了策略或换了镜像，报告和登记的对不上，证明服务器不放钥匙，负载根本起不来。",
    "If someone changes the policy or swaps the image on the host, the report no longer matches what was registered, the attestation server releases no keys, and the workload never starts."
   ],
   "b": [
    [
     "<p>报告里记的是这台 CVM 实际的配置和策略。假设有人在主机上把策略改了，比如想打开调试入口，或者换成一个没授权的镜像，报告就和模型厂商登记的值对不上。证明服务器拒绝，钥匙一把都不放，加密的镜像打不开，负载起不来。证明服务器连不上，结果也一样。</p>",
     "<p>同理，CVM 只能跑经过签名的镜像，模型厂商只接受自己登记过的镜像度量值；要换新版本，得模型厂商重新登记。模型厂商还可以随时在自己的证明服务器上改策略、收回授权，不需要客户配合。证明不能说明软件没有漏洞，它只证明镜像是正版、没被改过。</p>"
    ],
    [
     "<p>The report records the CVM's actual configuration and policy. Suppose someone on the host changes the policy, say to open a debug entry, or swaps in an unauthorized image. The report then no longer matches the values the model vendor registered. The attestation server refuses and releases no keys, the encrypted image cannot be opened, and the workload does not start. The result is the same if the attestation server cannot be reached.</p>",
     "<p>Likewise, a CVM can run only signed images, and the model vendor accepts only image measurements it has registered; a new version must be registered again by the model vendor. The model vendor can also change policy or revoke authorization on its own attestation server at any time, without the customer's involvement. Attestation does not prove the software has no bugs; it only proves the image is genuine and unmodified.</p>"
    ]
   ]
  },
  {
   "t": [
    "模型来找数据",
    "The Model Comes to the Data"
   ],
   "d": [
    "检索和拼装 prompt 在企业自己的系统里做，只把 prompt 递进 CVM，拿回回答，数据本身不出门。",
    "Retrieval and prompt assembly happen in the enterprise's own systems. Only the prompt goes into the CVM and the answer comes back; the data itself never leaves."
   ],
   "b": [
    [
     "<p>模型在 CVM 里就绪以后，企业通过推理服务的接口和它交互，用起来和调用云端模型的接口差不多，只是数据不出自己的网络。</p>",
     "<p>在 RAG（检索增强生成，先从自有数据中检索相关内容，再连同问题一起交给模型）场景里，检索和拼装 prompt 都在 CVM 外、企业自己的系统里完成，例如用 VAST DataBase 和向量检索。挑哪些数据、怎么切，企业自己决定，模型只看到最后组装好的那段 prompt。推理服务跑在企业网内，原有的出口管控照常有效。这正是「模型去找数据」：以前是把数据送到模型那里，现在是把模型带到数据旁边。</p>"
    ],
    [
     "<p>Once the model is ready in the CVM, the enterprise talks to it through the inference service's interface, much like calling a cloud model's API, except the data stays on its own network.</p>",
     "<p>In RAG (retrieval-augmented generation: relevant content is first retrieved from the organisation's own data, then given to the model along with the question), retrieval and prompt assembly both happen outside the CVM, in the enterprise's own systems, for example with VAST DataBase and vector search. The enterprise decides which data to pick and how to slice it; the model sees only the final assembled prompt. The inference service runs inside the enterprise network, so existing egress controls still apply. This is what “the model goes to the data” means: instead of sending data to the model, the model is brought next to the data.</p>"
    ]
   ]
  },
  {
   "t": [
    "谁能看到什么",
    "Who Can See What"
   ],
   "d": [
    "企业看得到自己的数据、prompt 和回答，模型厂商只看得到自己的权重，运营者两样都看不到，只能决定跑不跑。",
    "The enterprise sees its data, prompts and answers; the model vendor sees only its own weights; the operator sees neither and can only decide whether the workload runs."
   ],
   "b": [
    [
     "<p>每台 CVM 只信任一个主人，只放这个主人的钥匙；其他方的数据只能通过接口以输入的形式进来。于是：企业看不到模型权重；模型厂商看不到企业的数据，prompt 虽然进到它的模型里，却只在 CVM 里处理，模型厂商本身拿不到，前提是它自己的程序不把输入往外发（见下面的边界）；运营者什么都看不到。运营者这边的 VAST DataBase 会记下跑过哪个应用、哪个镜像、在哪个节点上、什么时候，只记「跑了什么」，不记「处理了什么」。</p>",
     "<p>保护边界如下：它保护的是使用中的机密性和完整性，不保证可用性：运营者随时可以不跑或停掉负载。它也不防应用自身的漏洞（例如用 prompt 注入把检索到的内容套出来），不防负载故意把数据往外发（网络出口仍由企业和运营者管），硬件本身的风险（固件漏洞、侧信道、物理攻击）也一并继承。</p>"
    ],
    [
     "<p>Each CVM trusts exactly one owner and receives only that owner's keys; other parties' data can enter only as input through the interface. So the enterprise cannot see the model weights. The model vendor cannot see the enterprise's data: prompts do go into its model, but they are processed only inside the CVM and the model vendor itself cannot get them, provided its own program does not send inputs out (see the limits below). The operator sees nothing. On the operator's side, VAST DataBase records which application and which image ran, on which node and when: it logs what ran, not what was processed.</p>",
     "<p>Its limits: it protects the confidentiality and integrity of data in use, not availability: the operator can decline to run or stop a workload at any time. It does not protect against bugs in the application itself (such as using prompt injection to extract retrieved content), nor against a workload deliberately sending data out (network egress is still controlled by the enterprise and the operator). Hardware risks (firmware bugs, side channels, physical attacks) are inherited as well.</p>"
    ]
   ]
  }
 ]
};
