    "Virtual Metadata Servers"

   "d": [
    "计算服务在多台服务器上运行虚拟元数据服务器，每个逻辑分片管理一部分文件系统对象。",

   ],
   "b": [
    [
     "<p>这里的分片是所有权的划分。一个物理主机的计算服务可运行多个虚拟元数据服务器。多个分片在集群内分布，元数据处理与其他文件系统计算共用同一组服务角色。</p>"

    [

   "b": [
    [

    ],
    [
     "<p>For requests that address file data, different ranges within one file can belong to different shards. Logical ownership and the physical host currently running the shard are distinct. The hosting assignment can change with cluster conditions.</p>"
