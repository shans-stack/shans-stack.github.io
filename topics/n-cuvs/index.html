<script>
window.SS_TOPIC_CFG={
  "anim": "n-cuvs",
  "ar": [
    2.7439024390243905,
    0.8181818181818182
  ],
  "steps": [
    {
      "t": [
        "查询向量与最近邻",
        "Query Vectors and Nearest Neighbors"
      ],
      "d": [
        "cuVS 按距离或相似度从向量集里返回与查询最接近的候选。",
        "cuVS finds the dataset vectors closest to a query under a distance or similarity metric."
      ],
      "b": [
        [
          "\u003cp>向量用一组数表示样本的特征，例如文本经嵌入模型生成的语义表示。近邻查询固定一种度量规则，例如平方欧氏距离，并选出排名前 k 个结果。cuVS 提供在 GPU 上执行这类检索的算法。\u003c/p>"
        ],
        [
          "\u003cp>A vector represents a sample with numbers, such as a semantic representation produced by a text embedding model. Nearest-neighbor search uses a specified metric, such as squared Euclidean distance, and returns the top k results. cuVS provides GPU algorithms for this task.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "全量扫描得到精确结果",
        "Exact Search by Exhaustive Scan"
      ],
      "d": [
        "暴力搜索将查询与每个数据向量比较，再按得分保留前 k 个结果。",
        "Brute-force search compares the query with every dataset vector and retains the top k by score."
      ],
      "b": [
        [
          "\u003cp>全量扫描在指定度量下提供精确近邻。随着数据集增大，每条查询需要检查的向量也随之增加。精确结果可作为衡量近似索引召回率的基准。\u003c/p>"
        ],
        [
          "\u003cp>An exhaustive scan yields exact neighbors under the selected metric. The number of vectors examined per query grows with the dataset. Exact results can serve as a baseline for measuring the recall of an approximate index.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "构建 CAGRA 近邻图",
        "Building the CAGRA Neighbor Graph"
      ],
      "d": [
        "CAGRA 先构建候选近邻图，再筛选连接，形成可在 GPU 上搜索的索引。",
        "CAGRA builds an initial neighbor graph and prunes its links into a GPU-searchable index."
      ],
      "b": [
        [
          "\u003cp>CAGRA 是 cuVS 的一种近似最近邻图索引。图中每个节点代表一个向量，边连接可供搜索访问的近邻。构建过程先找候选近邻，再筛减冗余连接，以固定的出度组织最终图。\u003c/p>"
        ],
        [
          "\u003cp>CAGRA is an approximate nearest-neighbor graph index in cuVS. Each vertex represents a vector, and its links give search a set of neighbors to visit. Construction finds candidate neighbors first, then prunes redundant links to produce a graph with a fixed out-degree.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "沿图扩展候选",
        "Exploring Candidates Along the Graph"
      ],
      "d": [
        "查询从起始节点开始，沿近邻连边检查新候选并保留更接近查询的结果。",
        "From starting vertices, search follows neighbor links and retains promising candidates as it goes."
      ],
      "b": [
        [
          "\u003cp>搜索计算当前候选与查询的距离，再扩展较有希望的候选节点的邻接边。访问到的候选形成有界的中间结果集合，最终从其中选出前 k 个。因为搜索只探索部分图节点，结果可能漏掉精确近邻。\u003c/p>"
        ],
        [
          "\u003cp>Search scores candidates against the query and expands links from promising vertices. It maintains a bounded pool of intermediate candidates and returns the top k from that pool. Because traversal explores only part of the graph, it can miss exact neighbors.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "用召回率衡量候选覆盖",
        "Measuring Coverage with Recall"
      ],
      "d": [
        "保留更多中间候选通常能提高召回率，同时增加查询工作量。",
        "Keeping more intermediate candidates usually improves recall while increasing search work."
      ],
      "b": [
        [
          "\u003cp>召回率衡量返回结果覆盖了多少精确近邻。CAGRA 的 \u003ccode>itopk_size\u003c/code> 控制搜索中保留的候选数，必须至少为 k。增大该值通常可覆盖更多精确近邻，也要处理更多候选；实际取舍取决于数据和检索目标。\u003c/p>"
        ],
        [
          "\u003cp>Recall measures how many exact neighbors appear in the returned results. CAGRA&#x27;s \u003ccode>itopk_size\u003c/code> sets how many intermediate candidates search keeps and must be at least k. A larger pool usually improves exact-neighbor coverage while increasing candidate work. The trade-off depends on the data and retrieval target.\u003c/p>"
        ]
      ]
    }
  ]
};
