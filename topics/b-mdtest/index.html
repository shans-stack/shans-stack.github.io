  {
   "t": [
    "MPI 进程与并发",
    "MPI Processes and Concurrency"

   "d": [

   ],
   "b": [
    [
     "<p>MPI（消息传递接口）负责启动和协调并行进程，每个进程称为一个 rank。<code>mpiexec -n</code> 指定进程数，mdtest 的 <code>-d</code> 指定测试目录，<code>-n</code> 指定每个进程处理的条目数。测试目录独立于业务数据。</p>",

    [
     "<p>MPI (Message Passing Interface) launches and coordinates processes, known as ranks. <code>mpiexec -n</code> sets the process count. mdtest's <code>-d</code> sets the test directory and its <code>-n</code> sets the item count per process. The test directory is separate from application data.</p>",
     "<p>The <code>-i</code> option sets the number of iterations. Placing the same number of ranks across a different set of clients can change client caching and network paths.</p>"
    ]
   ]
  },
  {
   "t": [
    "共享目录与独立目录",
    "Shared and Per-Rank Directories"
   ],
   "d": [

     "<p>The <code>-w</code> and <code>-e</code> options set bytes written and read per file. With content transfer enabled, phases that include data I/O also reflect data path costs.</p>"

 ]
