<script>
window.SS_TOPIC_CFG={
 "anim": "otf",
 "ar": [900/340,360/420],
 "steps": [
  {
   "t": [
    "表元数据及有效数据文件",
    "Table Metadata and Active Data Files"
   ],
   "d": [
    "以 Iceberg v2 为例，表元数据记录表结构与快照，快照通过清单引用数据文件。",
    "In Iceberg v2, table metadata records the schema and snapshots. A snapshot references data files through manifests."
   ],
   "b": [
    [
     "<p>开放表格式用公开规范定义表状态。Parquet 等数据文件保存记录内容。以 Iceberg v2 为例，表元数据记录表结构和快照，读取器沿选定快照的 manifest list 与 manifest 解析该快照的数据文件集合。</p>"
    ],
    [
     "<p>An open table format defines table state through a public specification. Data files such as Parquet store the records. In Iceberg v2, table metadata records the schema and snapshots. Readers resolve the data files in the selected snapshot through its manifest list and manifests.</p>"
    ]
   ]
  },
  {
   "t": [
    "用快照固定一次读取",
    "Pin a Read to a Snapshot"
   ],
   "d": [
    "打开表时选定一个快照，整次读取沿用其中记录的文件集合。",
    "A read selects a snapshot when it opens the table and uses that snapshot’s file set throughout."
   ],
   "b": [
    [
     "<p>快照表示表在某次提交时的状态。以 Iceberg 为例，快照通过文件清单引用表中的数据文件。读取器可以固定在当前快照上完成一次查询，同时写入器在准备下一版。不同快照可以引用同一份未更改的数据文件。</p>"
    ],
    [
     "<p>A snapshot represents the table’s state at a commit. In Iceberg, for example, a snapshot refers to the table’s data files through manifests. A reader can finish a query against its selected snapshot while a writer prepares the next version. Multiple snapshots can refer to the same unchanged data files.</p>"
    ]
   ]
  },
  {
   "t": [
    "原子发布新版本",
    "Publish a New Version Atomically"
   ],
   "d": [
    "新文件准备完毕后切换表元数据指针，读者一次看到完整的新版本。",
    "Once new files are ready, the table metadata pointer switches and readers can see the complete new version."
   ],
   "b": [
    [
     "<p>以 Iceberg 的提交方式为例，写入器先生成数据文件和新版元数据，再尝试将当前元数据指针从自己读到的基准版本切换到新版本。原子切换指读者只会看到切换前或切换后的完整状态。如果并发写入已改变基准版本，本次写入需要按操作规则重新校验后再提交。</p>"
    ],
    [
     "<p>In Iceberg’s commit scheme, a writer creates the data files and new metadata, then tries to swap the current metadata pointer from the base version it read to the new version. An atomic swap lets readers see a complete state on either side of the change. If a concurrent write has changed the base version, the operation must be revalidated under its commit rules before retrying.</p>"
    ]
   ]
  },
  {
   "t": [
    "根据文件统计裁剪扫描",
    "Prune Scans Using File Statistics"
   ],
   "d": [
    "查询通过分区信息和文件统计排除不可能匹配的文件。",
    "A query uses partition information and file statistics to exclude files that cannot match."
   ],
   "b": [
    [
     "<p>Iceberg 清单记录文件的分区值，可保存列值上下界等统计。查询引擎可用这些信息排除不可能匹配谓词的文件。例如，查找周二事件时，可跳过时间上界早于周二的文件。其余文件仍由读取器按谓词筛选。</p>"
    ],
    [
     "<p>Iceberg manifests record file partition values and can contain column statistics such as lower and upper bounds. A query engine can eliminate files that cannot satisfy a predicate, such as files whose upper timestamp bound precedes Tuesday. The reader still applies the predicate to remaining files.</p>"
    ]
   ]
  },
  {
   "t": [
    "读取仍然保留的历史快照",
    "Read a Retained Historical Snapshot"
   ],
   "d": [
    "历史查询指定以前的快照，重新打开当时的文件集合。",
    "A historical query selects an earlier snapshot and reopens its file set."
   ],
   "b": [
    [
     "<p>当前表已有新版本时，读取器还可以按快照标识或受支持的时间条件读取保留的历史状态，这一能力称为时间旅行。历史读取依赖快照及其引用的文件仍然可用。快照过期后，维护作业可清理其他保留快照也未引用的文件。</p>"
    ],
    [
     "<p>After a new version becomes current, a reader can still select a retained historical state by snapshot identifier or a supported time criterion. This is called time travel. Historical reads require both the snapshot and its referenced files to be available. After a snapshot expires, maintenance can remove files that other retained snapshots also leave unreferenced.</p>"
    ]
   ]
  }
 ]
};
</script>
