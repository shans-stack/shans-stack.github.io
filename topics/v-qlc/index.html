<script>
window.SS_TOPIC_CFG={
  "anim": "v-qlc",
  "ar": [960/480,480/560],
  "steps": [
    {
      "t": [
        "从 SLC 到 QLC：单元的比特数与电压档位",
        "From SLC to QLC: Bits and Voltage Levels per Cell"
      ],
      "d": [
        "SLC、MLC、TLC、QLC 每个单元分别存 1、2、3、4 比特，对应 2、4、8、16 个阈值电压档位。",
        "SLC, MLC, TLC and QLC store 1, 2, 3 and 4 bits per cell, using 2, 4, 8 and 16 threshold-voltage states, respectively."
      ],
      "b": [
        [
          "<p>读出时，芯片按单元阈值电压所在的范围判定存储值。每个单元存储的比特越多，给定单元数量下的容量越大。档位更密，编程时通常需要更精细地控制电荷，写入更慢。</p>",
          "<p>反复编程和擦除会磨损单元绝缘层。档位间隔较窄时，相同的电荷损失更容易使读出的状态跨过判定边界，因此多比特单元通常更不耐擦写。</p>"
        ],
        [
          "<p>On a read, the chip determines the stored value from the range containing the cell’s threshold voltage. More bits per cell increase capacity for a given number of cells. Closer states usually require more precise charge control, so programming takes longer.</p>",
          "<p>Repeated programming and erasing wear the cell’s insulating layer. With narrower margins, the same charge loss is more likely to cross a read decision boundary, so cells storing more bits generally have lower program/erase endurance.</p>"
        ]
      ]
    },
    {
      "t": [
        "闪存按页写入、按块擦除",
        "Flash Programs Pages and Erases Blocks"
      ],
      "d": [
        "页是最小编程单位，擦除块是最小擦除单位。一个擦除块包含多页。",
        "The page is the smallest programming unit, and the erase block is the smallest erase unit. Each erase block contains multiple pages."
      ],
      "b": [
        [
          "<p>更新写入空页后，旧页作废。只有擦除旧页所在的整个块，其中的页才能重新用于写入。对于 VAST 白皮书举例的无盘内 DRAM 写缓冲的超大规模 SSD，4 KB 写入也可能占用一个 128 KB 闪存页。</p>"
        ],
        [
          "<p>Updates go to empty pages and invalidate the old pages. Erasing the entire block frees its pages for new writes. In the VAST white paper’s example of a hyperscale SSD without an on-drive DRAM write buffer, a 4 KB write can consume a 128 KB flash page.</p>"
        ]
      ]
    },
    {
      "t": [
        "回收搬移增加写入量，耐久度随负载变化",
        "Reclaim Copies Add Writes, and Endurance Depends on Workload"
      ],
      "d": [
        "擦除前搬移有效页会产生写放大。整盘耐久度也随写入大小和访问模式变化。",
        "Moving valid pages before erasure causes write amplification. Drive endurance also varies with write size and access pattern."
      ],
      "b": [
        [
          "<p>SSD 控制器回收仍含有效页的擦除块时，先把有效页复制到别处。介质写入量因此高于主机写入量。VAST DataStore 同时处理集群和 SSD 两层回收产生的搬移。</p>",
          "<p>DWPD 表示额定期限内每天可写入的整盘容量数，TBW 表示累计可写入的 TB。VAST 白皮书引用的 JEDEC 负载有 77% 的写入不超过 4 KB。该白皮书以 Intel P4326（2026 年白皮书，第 56–57 页）比较 128 KB 顺序写与 4 KB 随机写，前者的整盘耐久度约为后者的 20 倍。这个比较同时改变了请求大小和访问模式。</p>"
        ],
        [
          "<p>To reclaim an erase block that still contains valid pages, the SSD controller first copies those pages elsewhere. This makes the media write more data than the host requested. VAST DataStore addresses data movement during both cluster- and drive-level reclamation.</p>",
          "<p>DWPD is the number of full-drive writes per day over the rated period. TBW is cumulative writable terabytes. VAST’s white paper cites a JEDEC workload with 77% of writes at 4 KB or less. Its 2026 Intel P4326 comparison (pp. 56–57) reports about 20 times the drive endurance for 128 KB sequential writes versus 4 KB random writes, varying both request size and access pattern.</p>"
        ]
      ]
    },
    {
      "t": [
        "SCM 缓冲后组织整页对齐写入",
        "SCM Buffers Writes Before Full-Page Programming"
      ],
      "d": [
        "常规写入在 SCM 中受到持久化保护后即获确认，迁移时再把缩减后的数据装入整页。",
        "On the standard path, writes are acknowledged once durably protected in SCM. Reduced data is packed into full pages during migration."
      ],
      "b": [
        [
          "<p>高耐久度 SCM（存储级内存）为前台写入提供持久化缓冲，并吸收一部分短期改写。后台迁移时，VAST DataStore 重新分块并缩减数据，再把变长结果紧密装入页对齐的纠删码子条带。</p>",
          "<p>白皮书中的布局使用 1 MB SSD 写入请求。一个请求覆盖多个完整页，也让控制器有机会并行写入多颗闪存芯片。</p>"
        ],
        [
          "<p>High-endurance SCM, or storage-class memory, provides a durable buffer for foreground writes and absorbs some transient updates. During background migration, VAST DataStore rechunks and reduces the data and packs the variable-length results into page-aligned erasure-coded substripes.</p>",
          "<p>The white paper’s layout uses 1 MB SSD write requests. A request spans several full pages and allows the controller to program multiple flash chips in parallel.</p>"
        ]
      ]
    },
    {
      "t": [
        "每盘条带段与擦除块对齐",
        "Align Each Drive’s Stripe Segment to Erase Blocks"
      ],
      "d": [
        "白皮书的布局把多次 1 MB 写入组成每盘 1 GB 的条带段，对齐一组擦除块。",
        "In the white paper’s layout, multiple 1 MB writes fill a 1 GB strip per SSD that aligns with a group of erase blocks."
      ],
      "b": [
        [
          "<p>DataStore 在集群层迁出仍有效的数据后，可释放整段空间。与擦除块对齐后，SSD 回收这些擦除块时需要再次搬移的数据更少。</p>"
        ],
        [
          "<p>After moving any remaining live data at the cluster layer, DataStore can release the entire strip. Erase-block alignment leaves less data for the SSD to move again when reclaiming those blocks.</p>"
        ]
      ]
    },
    {
      "t": [
        "Foresight 按预期寿命组织条带",
        "Foresight Groups Data by Expected Lifetime"
      ],
      "d": [
        "预期寿命相近的块放入同一批条带。短期数据删除后，回收通常只需搬移少量有效数据。",
        "Chunks with similar expected lifetimes go into the same stripes. Once short-lived data is deleted, reclamation typically moves little live data."
      ],
      "b": [
        [
          "<p>每个块的元数据包含预期寿命。垃圾回收期间被迁移的有效块会提高这一预期，逐步与其他长寿命数据归到同类条带。</p>"
        ],
        [
          "<p>Each chunk’s metadata includes its expected lifetime. Relocating a live chunk during garbage collection raises that estimate, gradually grouping it with similarly long-lived data.</p>"
        ]
      ]
    },
    {
      "t": [
        "集群范围内均衡磨损并回收空间",
        "Balance Wear and Reclaim Space Across the Cluster"
      ],
      "d": [
        "新条带按各盘的剩余空间和耐久度放置。空闲空间低于阈值时，优先回收能释放较多空间的条带。",
        "New stripes are placed according to free space and remaining endurance. When free space falls below a threshold, reclamation prioritises stripes with more recoverable space."
      ],
      "b": [
        [
          "<p>CNode 可管理集群内的共享擦除块池。新盘或容量较大的盘可接收更多写入，随着条带分布变化，逐步均衡容量使用和磨损。</p>"
        ],
        [
          "<p>CNodes manage the cluster’s shared pool of erase blocks. New or larger drives can receive more writes, gradually balancing capacity usage and wear as stripe placement changes.</p>"
        ]
      ]
    }
  ]
};
</script>
