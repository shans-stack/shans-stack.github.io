<script>
window.SS_TOPIC_CFG={
 "anim": "v-dataspace",
 "ar": [840/328,350/420],
 "steps": [
  {
   "t": [
    "远程客户端经广域网访问集群",
    "Remote Clients Reach a Cluster over the WAN"
   ],
   "d": [
    "客户端直接访问远程集群时，请求和响应都要经过站点间网络。",
    "When a client accesses a distant cluster directly, the request and response both cross the inter-site network."
   ],
   "b": [
    [
     "<p>单集群的命名空间定义数据可通过哪些路径访问。客户端直接访问远端集群时，每次请求都需要跨广域网（WAN）往返。</p>",
     "<p>VAST AI OS 的 DataSpace 提供跨集群数据服务。它的 Global Access（全局访问）把选定的活动目录接入联邦式全局命名空间。参与集群保留本地目录，并在其中发布共享路径。</p>"
    ],
    [
     "<p>A single-cluster namespace defines the paths used to access its data. When a client connects directly to a remote cluster, each request requires a round trip over the wide-area network (WAN).</p>",
     "<p>DataSpace is the cross-cluster data service in VAST AI OS. Its Global Access feature exposes selected live directories through a federated global namespace. Each participating cluster keeps its local directory tree and exposes shared paths within it.</p>"
    ]
   ]
  },
  {
   "t": [
    "源路径与卫星路径",
    "Origin and Satellite Paths"
   ],
   "d": [
    "一个现有源路径可对应多个目标集群上的卫星路径，各站可采用自己的路径名。",
    "An existing origin path can have satellite paths on multiple destination clusters. The names can differ by site."
   ],
   "b": [
    [
     "<p>在 VAST 管理系统（VMS）中，受保护路径（Protected Path）是应用快照、复制或全局访问等策略的目录配置。启用全局访问时，VMS 将源集群上的现有路径与目标集群上新建的路径关联。目标路径称为卫星路径（Satellite Path）。</p>",
     "<p>例如，站点 A 的 <code>/research</code> 可通过站点 B 的 <code>/shared</code> 访问。配置完成后，目标路径随即可以接受读写请求，数据按访问需要跨站点传输。客户端使用目标集群发布的视图作为入口，支持的协议与权限配置取决于视图和全局访问的支持范围。源集群维护该共享目录的完整内容。</p>"
    ],
    [
     "<p>In VAST Management System (VMS), a protected path identifies a directory to which settings for snapshots, replication, or global access can apply. With Global Access, VMS pairs an existing path on the origin cluster with a newly created path on a destination cluster. The destination path is called a satellite path.</p>",
     "<p>For example, site B can expose site A’s <code>/research</code> as <code>/shared</code>. The destination path can accept requests when configured, and data crosses sites as needed. Clients connect through a view exposed on the destination cluster. Available protocols and permission settings depend on both the view and Global Access support. The origin maintains the complete shared directory.</p>"
    ]
   ]
  },
  {
   "t": [
    "按需回源与预取",
    "On-Demand Reads and Prefetch"
   ],
   "d": [
    "卫星集群在缓存未命中时向源集群取数，同时保留一份本地缓存。",
    "On a cache miss, the satellite fetches data from the origin and keeps a local cached copy."
   ],
   "b": [
    [
     "<p>首次读取尚未缓存的数据时，卫星集群通过站点间链路向源集群请求数据。它将返回的数据缓存起来，并可同时预取相关数据和元数据。元数据记录名称、目录结构和属性等信息。</p>",
     "<p>对于已知会访问的目录，目标站点也可提前发起预取，只取目录结构，或连同文件内容一起取回。</p>"
    ],
    [
     "<p>When requested data is absent from the cache, the satellite fetches it from the origin over the intersite link. It caches the returned data and can also prefetch related data and metadata. Metadata describes names, directory structure, and other attributes.</p>",
     "<p>For a directory expected to be used, the destination can also initiate prefetch ahead of time, fetching the directory structure alone or including file contents.</p>"
    ]
   ]
  },
  {
   "t": [
    "定期同步会留下版本不一致的窗口",
    "Periodic Sync Can Leave Versions Out of Step"
   ],
   "d": [
    "采用周期同步的模型中，站点可以在同步前看到不同版本，版本冲突需要另行解决。",
    "In a periodic-sync model, sites can see different versions before the next sync, and version conflicts need a resolution rule."
   ],
   "b": [
    [
     "<p>在采用周期同步的模型中，如果两站在同一个同步周期内修改同一文件，下一次同步前可以读到不同版本。以较晚写入为准、把另一版保留在历史记录，是一种冲突处理策略。</p>",
     "<p>这个窗口取决于同步周期。Global Access 的读写租约用于协调活动数据的访问。</p>"
    ],
    [
     "<p>Under periodic synchronization, two sites can read different versions if they edit the same file between syncs. One conflict policy makes the later write current and retains the other version in history.</p>",
     "<p>The sync interval determines this window. Global Access uses read and write leases to coordinate access to live data.</p>"
    ]
   ]
  },
  {
   "t": [
    "读租约与缓存刷新",
    "Read Leases and Cache Refresh"
   ],
   "d": [
    "有效读租约允许卫星从本地缓存返回数据；缓存失效后，下次读取重新回源。",
    "A valid read lease lets a satellite serve cached data. After invalidation, the next read fetches it from the origin again."
   ],
   "b": [
    [
     "<p>读租约是源集群允许卫星在一段时间内直接使用缓存数据的授权。数据被反复访问时，卫星可以请求或续租。有效租约内的读取由卫星响应，数据无需再次跨站点传输。</p>",
     "<p>当租约到期或源端内容发生变化时，卫星会使旧缓存失效。下一次读取需要重新向源端取数。全局访问由源站协调租约，同一元素同一时刻仅由一个集群持有写租约。发放写租约时，相关读租约会被收回。</p>"
    ],
    [
     "<p>A read lease is permission from the origin for a satellite to use cached data for a period of time. When the data is accessed repeatedly, the satellite can request or renew a lease. While the lease is valid, the satellite can serve the data locally without another intersite transfer.</p>",
     "<p>The satellite invalidates its cached data when the lease expires or the content at the origin changes. The next read fetches the data from the origin again. The origin coordinates leases. Only one cluster can hold the write lease for a given element at a time. Granting it revokes the related read leases.</p>"
    ]
   ]
  },
  {
   "t": [
    "卫星写入转发到源站",
    "Forwarding Satellite Writes to the Origin"
   ],
   "d": [
    "在 VAST AI OS 5.4 的 Global Access 路径中，卫星将写入转发到源站，收到源站确认后再确认客户端。",
    "On the VAST AI OS 5.4 Global Access path, the satellite forwards writes to the origin and waits for its acknowledgment before replying to the client."
   ],
   "b": [
    [
     "<p>这是绕写缓存路径：源站提交写入，卫星后续读取时可以回源并缓存。此前缓存该数据的其他卫星按租约失效规则刷新数据。</p>",
     "<p>白皮书还描述了可转移的写租约。卫星取得写租约后，可以先在本地缓存提交并确认，再异步回写源站。</p>"
    ],
    [
     "<p>This is the write-around path. The origin commits the write, and a satellite can fetch and cache the data on a subsequent read. Other satellites that cached the data refresh it according to the lease invalidation rules.</p>",
     "<p>The white paper also describes portable write leases. A satellite holding the write lease can commit to its local cache and acknowledge the write before sending it back to the origin asynchronously.</p>"
    ]
   ]
  },
  {
   "t": [
    "全局访问与灾难恢复",
    "Global Access and Disaster Recovery"
   ],
   "d": [
    "Global Access 提供活动数据的访问路径，异步复制在远端保留可用于恢复的副本。",
    "Global Access exposes live data, while asynchronous replication keeps a remote copy for recovery."
   ],
   "b": [
    [
     "<p>Global Access 的卫星缓存包含访问过或预取的数据。灾难恢复可另行配置异步复制，按保护策略把源路径的时间点快照增量传到远端。目标站点的恢复点取决于最近一次完成传输的快照。</p>",
     "<p>在满足配置条件时，Global Access 和异步复制可用在同一源路径上。两项能力分别服务于日常访问和故障恢复。DataSpace 也包含跨集群克隆。</p>"
    ],
    [
     "<p>A Global Access satellite cache contains data that was read or prefetched. Disaster recovery can use a separate asynchronous replication policy to send snapshot changes from the source path to a remote cluster. The recovery point at the destination depends on the most recently transferred snapshot.</p>",
     "<p>Global Access and asynchronous replication can share a source path when the configuration requirements are met. The two capabilities serve day-to-day access and recovery respectively. DataSpace also includes cross-cluster cloning.</p>"
    ]
   ]
  }
 ]
};
</script>
