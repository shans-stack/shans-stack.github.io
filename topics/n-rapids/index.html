        "列式数据进入 GPU",
        "Bringing Columnar Data to the GPU"
      ],
      "d": [
        "cuDF 将表格表示为一组列，并在 GPU 上执行表格运算。",
        "cuDF represents a table as a collection of columns and runs tabular operations on the GPU."
      ],
      "b": [
        [
          "\u003cp>DataFrame 是由带名称的列组成的表格数据结构。cuDF 的底层 C++ 库 libcudf 提供与 Apache Arrow 兼容的列式数据结构，也提供处理这些数据的 GPU 算法。列式布局把同一字段的值放在一起，适合按列组织计算。\u003c/p>"
        ],
        [
          "\u003cp>A DataFrame is a tabular data structure organized into named columns. The underlying C++ library, libcudf, provides Apache Arrow-compatible columnar structures and GPU algorithms that operate on them. A columnar layout groups values of the same field for column-oriented processing.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "用分组聚合生成结果表",
        "Producing a Table with Grouped Aggregation"
      ],
      "d": [
        "GPU 按键将记录分组，并对每组的值求和。",
        "The GPU groups records by key and sums the values in each group."
      ],
      "b": [
        [
          "\u003cp>分组键用于判断哪些行属于同一组。以按类别汇总数量为例，cuDF 读取类别列和数量列，为每个类别生成一行汇总结果。输入的明细表与输出的聚合表有不同的粒度。\u003c/p>"
        ],
        [
          "\u003cp>A group key determines which rows belong together. To sum quantities by category, cuDF reads the category and quantity columns and produces one summary row per category. The input describes individual records, while the output describes groups.\u003c/p>"
        ]
      ]
    },
    {
      "t": [
        "pandas 的加速代理",
        "The pandas Acceleration Proxy"
      ],
      "d": [
        "`cudf.pandas` 通过代理将可加速的调用交给 cuDF，其余调用由 pandas 处理。",
        "The `cudf.pandas` proxy routes eligible calls to cuDF and falls back to pandas for other calls."
      ],
      "b": [
        [
          "\u003cp>代理先尝试在 GPU 上执行操作，必要时将对象转成 GPU 格式。GPU 路径成功时直接返回结果。失败时，代理改用 CPU 上的 pandas，并在需要时转换对象。后续支持的操作仍可回到 GPU。一次工作流的执行位置随调用和数据而变化。\u003c/p>"
        ],
        [
          "\u003cp>The proxy tries the GPU implementation first, converting objects to the GPU representation when needed. A successful GPU attempt returns the result directly. On failure, the proxy tries pandas on the CPU and converts objects as needed. Later supported operations can return to the GPU. Execution therefore depends on the calls and data in the workflow.\u003c/p>"
        ]
      ]
    },

        "Spark 的执行计划替换",

      "d": [

        "NVIDIA's Spark plug-in replaces eligible physical SQL or DataFrame operators with GPU implementations."
      ],
      "b": [
        [
          "\u003cp>Spark 的物理计划确定每一步怎样执行。插件根据算子、表达式和数据类型等条件选择可替换的部分，其余部分仍按 Spark 的 CPU 路径执行。这条集成路径针对 Spark 作业，和进程内的 pandas 代理属于不同执行层。\u003c/p>"
        ],
        [
          "\u003cp>A Spark physical plan determines how each operation runs. The plug-in checks conditions such as the operator, expression, and data type to determine which parts can be replaced. The remaining parts use Spark&#x27;s CPU path. This integration operates at the Spark job level, while the pandas proxy dispatches calls within a process.\u003c/p>"
        ]
      ]

        "The CPU–GPU Data Boundary"
      ],
      "d": [
        "连续的 GPU 运算可保留设备端数据，CPU 回退处可能需要转换并复制数据。",
        "Consecutive GPU operations can keep data on the device, while a CPU fallback may require data conversion and copying."
      ],
      "b": [
        [
          "\u003cp>GPU 执行的收益取决于有多少操作可以在设备上连续运行。切换到 CPU 实现时，相关输入可能需要转成主机端可用的表示；后续 GPU 运算则可能重新将它传入设备。混合路径由实际执行计划或代理分派结果决定。\u003c/p>"
        ],
        [
          "\u003cp>The benefit of GPU execution depends in part on how much work can stay on the device. A CPU implementation may need inputs converted into a host representation, and a later GPU operation may need to move data back. The actual plan or proxy dispatch determines where these boundaries occur.\u003c/p>"
        ]
      ]
