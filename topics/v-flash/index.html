    [
     "<p>Updates go to empty pages and invalidate the old pages. Erasing their entire block frees its pages for subsequent writes.</p>"

   ]
  },
  {
   "s": [
    "写放大",
    "Write amplification"

   "t": [
    "回收时搬动有效页会增加写入量",

   "d": [
    "擦除块内仍有有效页时，SSD 控制器先把有效页复制到别处，再擦除原块。",

   "b": [
    [
     "<p>这种内部复制导致介质写入量高于主机写入量，也就是写放大。VAST DataStore 同时考虑集群层回收和 SSD 内部回收产生的数据搬动。</p>"
    ],
    [
     "<p>These internal copies make the media write more data than the host requested, a form of write amplification. The VAST DataStore addresses data movement during both cluster-level and drive-level reclamation.</p>"
    ]
   ]
  },
  {
   "s": [
    "整页写入",
    "Full-page writes"
   ],
   "t": [
    "将数据装入页对齐的写入",
    "Pack Data into Page-Aligned Writes"
   ],

   ],
   "b": [
    [

     "<p>1 MB 请求覆盖多个页，也给 SSD 控制器并行写入多颗闪存芯片的机会。</p>"

    [
     "<p>Regular writes first land in SCM. During migration to the capacity tier, the system rechunks and reduces the data, then packs the results into erasure-coded substripes aligned to the page size.</p>",
     "<p>A 1 MB request spans multiple pages and gives the SSD controller the opportunity to write across several flash chips in parallel.</p>"
    ]
   ]
  },
  {
   "s": [
    "整段回收",
    "Whole-strip reclaim"
   ],
   "t": [
    "每盘条带段与擦除块对齐",
    "Align Each Drive’s Stripe Segment to Erase Blocks"
   ],
   "d": [
    "在白皮书的布局中，多次 1 MB 写入组成每盘 1 GB 的条带段，对齐一组擦除块。",
    "In the white paper’s layout, multiple 1 MB writes fill a 1 GB strip per SSD, aligned with a group of erase blocks."
   ],
   "b": [
    [
     "<p>DataStore 在集群层迁出仍有效的数据后，释放整段空间。对齐减少了 SSD 为回收这些擦除块而再次搬移数据的需要。</p>"
    ],
    [
     "<p>After moving any remaining live data at the cluster layer, the DataStore releases the entire strip. Alignment reduces the need for the SSD to move data again when reclaiming those erase blocks.</p>"
    ]
   ]
  },
  {
   "s": [
    "按寿命分组",
    "Grouping by lifetime"
   ],
   "t": [
    "Foresight 按预期寿命组织条带",
    "Foresight Groups Data by Expected Lifetime"
   ],
   "d": [
    "预期寿命相近的块放进同一批条带。短期数据被删除后，对应条带通常只有少量数据需要搬移。",
    "Chunks with similar expected lifetimes are grouped in the same stripes. Once short-lived data is deleted, relatively little data typically remains to move."
   ],
   "b": [
    [
     "<p>每个块的元数据包含预期寿命。垃圾回收期间需要搬移的有效块会提高这一预期，逐步与其他长期保留的数据放在一起。</p>"
    ],
    [
     "<p>Each chunk’s metadata includes its expected lifetime. Live chunks relocated during garbage collection get a higher estimate and gradually group with other long-lived data.</p>"
    ]
   ]
  },
  {
   "s": [
    "集群磨损均衡",
    "Cluster wear levelling"
   ],
   "t": [
    "在集群范围内安排写入与回收",
    "Allocate Writes and Reclaim Space Across the Cluster"
   ],
   "d": [
    "条带放置考虑 SSD 剩余空间和耐久度。空闲空间低于阈值时，优先回收可释放空间较多的条带。",
    "Stripe placement considers SSD free space and remaining endurance. Below a free-space threshold, reclaim prioritizes stripes with the most recoverable space."
   ],
   "b": [
    [
     "<p>CNode 可管理整个集群的共享擦除块池。新盘或更大容量的盘可获得更多写入，逐步均衡容量使用与磨损。</p>"
    ],
    [
     "<p>CNodes can manage the shared pool of erase blocks across the cluster. New or larger drives can receive more writes as capacity use and wear balance over time.</p>"
    ]
   ]
