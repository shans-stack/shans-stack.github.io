    "b": [

      ],
      [
        "<p>Each test is defined by a model, dataset, and interaction pattern. The v1.0 single-turn tasks include summarization and reasoning. Multi-turn agentic workloads replay traces, ordered interactions that include requests and tool-call context. Later turns carry more context. A single request and a complete multi-turn task are different units of measurement.</p>"
      ]
    ]

    "t": [
      "逐档改变并发",
      "Testing at Discrete Concurrency Levels"

    "d": [
      "客户端在多个并发档位分别运行测试，每个档位产生一个观测点。",

      [
        "<p>Concurrency counts requests that are in flight at the same time. The <code>inference-endpoint</code> reference tool sends the defined traffic to the selected model and endpoint. The organizer’s v1.0 submission guide specifies seven measurement points for agentic benchmarks and eight to 32 points for non-agentic benchmarks, including a dedicated Offline run.</p>",
        "<p>The Offline mode submits the full batch of queries together to observe maximum throughput. Online concurrency points describe how the service behaves at different in-flight loads. Each type of point has its own test conditions.</p>"

      ],
      [
        "<p>Model quality is checked for each distinct configuration. Submissions also disclose the hardware and software setup and provisioned system power. The Standardized division requires model equivalence and software disclosure so results can be compared under the same rules.</p>",
        "<p>A result can appear as provisional after automated checks while peer review is still underway. The review status distinguishes provisional results from official results that have completed verification.</p>"
      ]
    ]
  },
  {
    "t": [
      "同时看系统吞吐和交互速度",
      "Reading Throughput and Interactivity Together"

    "b": [
      [
        "<p>系统吞吐以每秒生成的 Token 数表示。交互速度以单个用户每秒收到的 Token 数表示，智能体结果还提供覆盖整段任务的平均交互速度。首 Token 时延（TTFT）是从发出请求到收到首个 Token 的时间。P90 表示约九成观测值在该时延以内。</p>",
        "<p>每个点代表一次运行。较高的系统吞吐可能伴随较慢的单用户输出，因此同样的吞吐下仍需看交互速度和首 Token 时延。发布图保留离散测量点，点间的显示连线不增加测量数据。</p>"
      ],
      [
        "<p>System throughput counts generated tokens per second across the service. Interactivity describes the tokens per second seen by one user. Agentic results also report average interactivity over the full task. Time to first token (TTFT) is the time from sending a request to receiving its first token. P90 is the latency at or below which roughly nine in ten observations fall.</p>",
        "<p>Each point represents one run. Higher system throughput may come with slower output for each user, so points with similar throughput can still differ in interactivity and TTFT. The published chart retains discrete observations. Any connecting lines add no measurements between those points.</p>"
      ]
    ]
  },
  {
    "t": [
      "对齐条件再比较",
      "Comparing Results under the Same Conditions"
    ],
    "d": [
      "可比条件包括基准版本、模型、负载、组别、审阅状态和交互目标。",

      ],
      [
        "<p>As of November 23, 2026, the latest public release in the MLCommons results archive was MLPerf Endpoints v1.0, published on November 19, 2026. The results table also lists publication dates for individual submissions.</p>",

      ]
    ]
  }
]
